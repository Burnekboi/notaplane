<!doctype html>

<html>
    <head>
        <title>Shooter Prototype</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <script src="https://telegram.org/js/telegram-web-app.js"></script>

        <style>
            * {
                margin: 0;

                padding: 0;

                box-sizing: border-box;
            }

            body {
                background: #000;
                position: fixed;
                inset: 0;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #bgCanvas, #gameCanvas, #uiCanvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
            #bgCanvas {
                background: #0a3a4a;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            }
            #gameCanvas {
                cursor: crosshair;
                background: transparent;
            }
            #uiCanvas {
                pointer-events: none;
                background: transparent;
            }

            /* Canvas wrapper for absolute positioning of overlay buttons */

            #gameWrap {
                position: fixed;
                inset: 0;
                line-height: 0;
            }

            /* ── Exit confirmation overlay ── */
            #exitOverlay {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 999;
                background: rgba(0,0,0,0.65);
                justify-content: center;
                align-items: center;
                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);
            }
            #exitOverlay.active {
                display: flex;
            }
            #exitModal {
                background: linear-gradient(160deg, #1a1a2e, #16213e);
                border: 1px solid rgba(255,216,102,0.25);
                border-radius: 12px;
                padding: 28px 32px 22px;
                text-align: center;
                min-width: 260px;
                max-width: 320px;
                box-shadow: 0 0 30px rgba(0,0,0,0.6);
            }
            #exitModal h2 {
                color: #ffd866;
                font: bold 20px 'Impact', 'Arial Black', sans-serif;
                margin: 0 0 8px;
                letter-spacing: 1px;
            }
            #exitModal p {
                color: rgba(255,216,102,0.6);
                font: 13px 'Segoe UI', Arial, sans-serif;
                margin: 0 0 20px;
            }
            .exit-buttons {
                display: flex;
                gap: 12px;
                justify-content: center;
            }
            .exit-btn {
                min-width: 90px;
                padding: 10px 0;
                border: 1px solid rgba(255,216,102,0.2);
                border-radius: 6px;
                font: bold 14px 'Impact', 'Arial Black', sans-serif;
                letter-spacing: 1px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .exit-btn-yes {
                color: #ff6b6b;
                background: rgba(255,0,0,0.1);
                border-color: rgba(255,100,100,0.3);
            }
            .exit-btn-yes:hover {
                background: rgba(255,0,0,0.2);
                border-color: rgba(255,100,100,0.5);
            }
            .exit-btn-no {
                color: #ffd866;
                background: rgba(255,216,102,0.08);
                border-color: rgba(255,216,102,0.2);
            }
            .exit-btn-no:hover {
                background: rgba(255,216,102,0.15);
                border-color: rgba(255,216,102,0.4);
            }

            /* Missile button — inside canvas, right side middle */

            #missileBtn {
                position: absolute;

                right: 8px;

                top: 50%;

                transform: translateY(-50%);

                width: 42px;

                background: linear-gradient(160deg, #1a0a00, #2a1000);

                border: 2px solid #cc4400;

                border-radius: 6px;

                box-shadow:
                    0 0 10px rgba(255, 80, 0, 0.5),
                    inset 0 0 6px rgba(255, 60, 0, 0.15);

                cursor: default;

                overflow: hidden;

                display: flex;

                flex-direction: column;

                align-items: center;

                padding-bottom: 3px;
            }

            #missileBtnImgWrap {
                position: relative;

                width: 42px;

                height: 42px;

                flex-shrink: 0;
            }

            #missileBtn img {
                width: 42px;

                height: 42px;

                object-fit: cover;

                object-position: center;

                mix-blend-mode: screen;

                display: block;
            }

            #missileBtnLabel {
                position: absolute;

                top: 50%;

                left: 0;
                right: 0;

                transform: translateY(-50%);

                color: #ffcc44;

                font: bold 6px Arial;

                letter-spacing: 0.3px;

                text-align: center;

                text-shadow:
                    0 0 3px #000,
                    0 0 5px #ff8800;

                line-height: 1.2;

                pointer-events: none;
            }

            #missileBtnCost {
                display: flex;

                align-items: center;

                gap: 2px;

                margin-top: 0px;

                margin-bottom: 1px;
            }

            #missileBtnCost .coin {
                width: 9px;

                height: 9px;

                border-radius: 50%;

                background: radial-gradient(
                    circle at 35% 35%,
                    #ffe066,
                    #cc8800
                );

                border: 1px solid #ffdd44;

                box-shadow: 0 0 3px #ffaa00;

                flex-shrink: 0;
            }

            #missileBtnCost span {
                color: #fff;

                font: bold 9px Arial;

                text-shadow: 0 0 4px #ff8800;
            }

            /* Dragon Strike button — below missile button */

            #dragonBtn {
                position: absolute;

                right: 8px;

                top: calc(50% + 60px);

                width: 42px;

                background: linear-gradient(160deg, #1a0a00, #2a1000);

                border: 2px solid #cc4400;

                border-radius: 6px;

                box-shadow:
                    0 0 10px rgba(255, 80, 0, 0.5),
                    inset 0 0 6px rgba(255, 60, 0, 0.15);

                cursor: default;

                overflow: hidden;

                display: flex;

                flex-direction: column;

                align-items: center;

                padding-bottom: 3px;
            }

            #dragonBtnImgWrap {
                position: relative;

                width: 42px;

                height: 42px;

                flex-shrink: 0;
            }

            #dragonBtn img {
                width: 42px;

                height: 42px;

                object-fit: cover;

                object-position: center;

                mix-blend-mode: screen;

                display: block;
            }

            #dragonBtnLabel {
                position: absolute;

                top: 50%;

                left: 0;
                right: 0;

                transform: translateY(-50%);

                color: #ffcc44;

                font: bold 6px Arial;

                letter-spacing: 0.3px;

                text-align: center;

                text-shadow:
                    0 0 3px #000,
                    0 0 5px #ff8800;

                line-height: 1.2;

                pointer-events: none;
            }

            #dragonBtnCost {
                display: flex;

                align-items: center;

                gap: 2px;

                margin-top: 0px;

                margin-bottom: 1px;
            }

            #dragonBtnCost .coin {
                width: 9px;

                height: 9px;

                border-radius: 50%;

                background: radial-gradient(
                    circle at 35% 35%,
                    #ffe066,
                    #cc8800
                );

                border: 1px solid #ffdd44;

                box-shadow: 0 0 3px #ffaa00;

                flex-shrink: 0;
            }

            #dragonBtnCost span {
                color: #fff;

                font: bold 9px Arial;

                text-shadow: 0 0 4px #ff8800;
            }
            /* ── Base HUD (balance, AUTO, bet) ────────────────────────── */
            #hudOverlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 10;
            }
            #leftHudBox, #rightHudBox {
                position: absolute;
                pointer-events: auto;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(0,0,0,0.55);
                border: 1px solid rgba(255,200,100,0.2);
                border-radius: 6px;
                font: bold 16px 'Impact','Arial Black',sans-serif;
                color: #ffd866;
                text-shadow: 0 0 8px rgba(255,200,80,0.3);
                user-select: none;
            }
            #autoBtn {
                background: none;
                border: none;
                color: inherit;
                font: inherit;
                cursor: pointer;
                width: 100%;
                height: 100%;
                text-shadow: 0 0 8px rgba(255,200,80,0.3);
            }
            #autoBtn.active {
                color: #4cff4c;
                text-shadow: 0 0 12px rgba(76,255,76,0.6);
            }
            #balanceDisplay {
                pointer-events: none;
            }
            #betIndicator {
                position: absolute;
                pointer-events: auto;
                cursor: pointer;
                user-select: none;
                font: bold 14px 'Impact','Arial Black',sans-serif;
                color: #ffd866;
                text-shadow: 0 0 6px rgba(255,200,80,0.3);
                display: flex;
                align-items: center;
                gap: 4px;
                background: rgba(0,0,0,0.4);
                border: 1px solid rgba(255,200,100,0.15);
                border-radius: 4px;
                padding: 1px 4px;
            }
            .betBtn {
                font: bold 18px 'Impact','Arial Black',sans-serif;
                padding: 0 3px;
                line-height: 1;
                pointer-events: none;
            }
            /* ── Landscape Orientation Overlay ────────────────────────── */
            #orientationOverlay {
                position: fixed;
                inset: 0;
                z-index: 9999;
                background: #0a0a0a;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                user-select: none;
                -webkit-user-select: none;
            }
            #orientationOverlay.active {
                display: flex;
            }
            #orientationOverlay .rotate-icon {
                width: 88px;
                height: 88px;
                border: 3px solid rgba(255,255,255,0.2);
                border-radius: 18px;
                position: relative;
                animation: rotateHint 2.4s ease-in-out infinite;
            }
            #orientationOverlay .rotate-icon::after {
                content: '↻';
                font-size: 52px;
                color: rgba(255,255,255,0.6);
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            @keyframes rotateHint {
                0%   { transform: rotate(0deg); }
                40%  { transform: rotate(90deg); }
                60%  { transform: rotate(90deg); }
                100% { transform: rotate(0deg); }
            }
            #orientationOverlay .rotate-text {
                color: #fff;
                font: bold 22px Arial, sans-serif;
                text-align: center;
                line-height: 1.5;
            }
            #orientationOverlay .rotate-sub {
                color: rgba(255,255,255,0.4);
                font: 14px Arial, sans-serif;
                text-align: center;
            }
            /* ── Loading Screen Overlay ──────────────────────────── */
            #loadingOverlay {
                position: fixed;
                inset: 0;
                z-index: 99999;
                background: #0a1a2a;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                user-select: none;
                -webkit-user-select: none;
                transition: opacity 0.5s ease;
            }
            #loadingOverlay.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #loadingOverlay .loading-title-img {
                max-width: 80%;
                max-height: 35vh;
                object-fit: contain;
                margin-bottom: 40px;
                opacity: 0.85;
                image-rendering: auto;
            }
            #loadingOverlay .loading-bar-track {
                width: 320px;
                max-width: 70vw;
                height: 6px;
                background: rgba(255,255,255,0.1);
                border-radius: 3px;
                overflow: hidden;
                margin-bottom: 14px;
            }
            #loadingOverlay .loading-bar-fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #ff8c00, #ffcc00);
                border-radius: 3px;
                transition: width 0.2s ease;
            }
            #loadingOverlay .loading-pct {
                color: rgba(255,255,255,0.5);
                font: 13px 'Consolas', monospace;
                letter-spacing: 1px;
            }
            #loadingOverlay .loading-sub {
                color: rgba(255,255,255,0.2);
                font: 11px Arial, sans-serif;
                margin-top: 8px;
            }

            /* ── Matchmaking Overlay ── */
        </style>
    </head>

    <body>
        <div id="gameWrap">
            <!-- ── Loading Screen Overlay ── -->
            <div id="loadingOverlay">
                <img class="loading-title-img" src="assets/intro title.png" alt="Loading..." />
                <div class="loading-bar-track">
                    <div class="loading-bar-fill" id="loadingBarFill"></div>
                </div>
                <div class="loading-pct" id="loadingPct">0%</div>
                <div class="loading-sub">Preparing the battlefield...</div>
            </div>

            <canvas id="bgCanvas"></canvas>
            <canvas id="gameCanvas"></canvas>
            <canvas id="uiCanvas"></canvas>

            <div id="hudOverlay">
                <div id="leftHudBox">
                    <span id="balanceDisplay">0</span>
                </div>
                <div id="rightHudBox">
                    <button id="autoBtn">AUTO</button>
                </div>
                <div id="betIndicator">
                    <span class="betBtn betMinus">−</span>
                    <span id="betDisplay">1</span>
                    <span class="betBtn betPlus">+</span>
                </div>

            </div>

            <div id="missileBtn">
                <div id="missileBtnImgWrap">
                    <img src="assets/missile icon.png" alt="Missile" />

                    <div id="missileBtnLabel">NUKE<br />STRIKE</div>
                </div>

                <div id="missileBtnCost">
                    <div class="coin"></div>

                    <span>×5</span>
                </div>
            </div>

            <div id="dragonBtn">
                <div id="dragonBtnImgWrap">
                    <img src="assets/dragonstrike icon.png" alt="Dragon" />

                    <div id="dragonBtnLabel">DRAGON<br />STRIKE</div>
                </div>

                <div id="dragonBtnCost">
                    <div class="coin"></div>

                    <span>×7</span>
                </div>
            </div>

            <!-- ── Landscape Orientation Overlay ── -->
            <div id="orientationOverlay">
                <div class="rotate-icon"></div>
                <div class="rotate-text">Please rotate your device<br>to landscape mode</div>
                <div class="rotate-sub">Landscape mode is required to play</div>
            </div>

            <!-- ── Exit Confirmation Overlay ── -->
            <div id="exitOverlay">
                <div id="exitModal">
                    <h2>EXIT GAME?</h2>
                    <p>Your progress will be saved.</p>
                    <div class="exit-buttons">
                        <button class="exit-btn exit-btn-yes" id="exitConfirmYes">YES</button>
                        <button class="exit-btn exit-btn-no" id="exitConfirmNo">NO</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="ui">
            <span id="rtpDisplay"></span>
        </div>

        <audio id="bgMusic" src="sfx/game music.mp3" loop preload="auto"></audio>

        <script>
            const bgCanvas = document.getElementById("bgCanvas");
            const gameCanvas = document.getElementById("gameCanvas");
            const uiCanvas = document.getElementById("uiCanvas");
            const canvas = gameCanvas;

            const bgCtx = bgCanvas.getContext('2d', { alpha: false });
            const ctx = gameCanvas.getContext('2d', { alpha: true, desynchronized: true });
            const uiCtx = uiCanvas.getContext('2d', { alpha: true });

            let bgDrawn = false;

            const hitCanvas = document.createElement('canvas');
            hitCanvas.width = 600;
            hitCanvas.height = 600;
            const hitCtx = hitCanvas.getContext('2d', { alpha: true });

            // ── Object pool helpers (reduce GC pressure) ─────────────────────────
            // Reuses inactive objects instead of splice+push churn.
            function poolNext(arr) {
                for (let i = 0; i < arr.length; i++) {
                    if (!arr[i].active) return arr[i];
                }
                const obj = {};
                arr.push(obj);
                return obj;
            }

            // ── Loading screen overlay ──────────────────────────────────────────
            // Canvas setup for game rendering (loading shown via DOM overlay)
            bgCanvas.width = screen.width;
            bgCanvas.height = screen.height;
            gameCanvas.width = screen.width;
            gameCanvas.height = screen.height;
            uiCanvas.width = screen.width;
            uiCanvas.height = screen.height;

            // ── Game Scale (letterboxed fullscreen) ────────────────────────────
            // Scales the 800x500 virtual game space to fit the screen
            // while maintaining the 8:5 aspect ratio, with black letterbox bars.
            let gameScale = 1;
            let gameOffsetX = 0;
            let gameOffsetY = 0;

            function calcGameLayout() {
                const sw = screen.width;
                const sh = screen.height;
                const s = Math.min(sw / 800, sh / 500);
                gameScale = s;
                gameOffsetX = Math.round((sw - 800 * s) / 2);
                gameOffsetY = Math.round((sh - 500 * s) / 2);
            }
            calcGameLayout();

            // ── Asset Preloading System ──────────────────────────────────────────
            // Shows the intro title image on the DOM overlay with progress bar,
            // then starts the game loop once all assets are ready.

            let assetsLoaded = false;
            let assetsTotal = 0;
            let assetsLoadedCount = 0;

            function updateLoadingProgress() {
                const pct = Math.round((assetsLoadedCount / assetsTotal) * 100);
                const fill = document.getElementById('loadingBarFill');
                const label = document.getElementById('loadingPct');
                if (fill) fill.style.width = pct + '%';
                if (label) label.textContent = pct + '%';
            }

            function preloadAssets(paths, callback) {
                assetsTotal = paths.length;
                assetsLoadedCount = 0;
                let errored = 0;

                if (assetsTotal === 0) {
                    assetsLoaded = true;
                    if (callback) callback();
                    return;
                }

                // Preload the intro title first so it shows on the loading screen
                const introImg = new Image();
                introImg.src = 'assets/intro title.png';
                // The loading overlay img tag loads it separately - no need to track

                for (const src of paths) {
                    const img = new Image();
                    img.onload = () => {
                        assetsLoadedCount++;
                        updateLoadingProgress();
                        if (assetsLoadedCount + errored >= assetsTotal) {
                            assetsLoaded = true;
                            if (callback) callback();
                        }
                    };
                    img.onerror = () => {
                        errored++;
                        assetsLoadedCount++;
                        updateLoadingProgress();
                        console.warn('Failed to load asset:', src);
                        if (assetsLoadedCount + errored >= assetsTotal) {
                            assetsLoaded = true;
                            if (callback) callback();
                        }
                    };
                    img.src = src;
                }
            }

            // All image assets that need to be preloaded
            const ASSET_PATHS = [
                "assets/missile.png",
                "assets/bullet.png",
                "assets/T1A.png",
                "assets/T1B.png",
                "assets/smoke.png",
                "assets/D1.png",
                "assets/T2.png",
                "assets/T3.png",
                "assets/D2.png",
                "assets/D3.png",
                "assets/D4.png",
                "assets/T6.png",
                "assets/T6B.png",
                "assets/T6C.png",
                "assets/T6 title.png",
                "assets/T6B title.png",
                "assets/T6C title.png",
                "assets/nT1AT1B title.png",
                "assets/D1 title.png",
                "assets/D2 title.png",
                "assets/D3 title.png",
                "assets/D4 title.png",
                "assets/cosmos.png",
                "assets/T4.png",
                "assets/T5.png",
                "assets/base cannon.png",
                "assets/textbox.png",
                "assets/cannon.png",
                "assets/missileB.png",
                "assets/base missile.png",
                "assets/missile launcher2.png",
                "assets/base thunder.png",
                "assets/electric ball.png",
                "assets/explosionC.png",
            ];

            function startGameAfterPreload() {
                document.getElementById('loadingOverlay').classList.add('hidden');
                introStartTime = performance.now();
                gamePhase = 'intro';
                document.getElementById('hudOverlay').style.display = '';
                document.getElementById('ui').style.display = '';
                document.getElementById('missileBtn').style.display = '';
                document.getElementById('dragonBtn').style.display = '';
                // Initialize balance from server (non-blocking)
                setTimeout(initBalanceFromServer, 100);
            }

            // Check for auth token in URL (passed from dashboard)
            (function checkUrlToken() {
                const urlParams = new URLSearchParams(window.location.search);
                const urlToken = urlParams.get('token');
                if (urlToken) {
                    localStorage.setItem('token', urlToken);
                    authToken = urlToken;
                    window.history.replaceState({}, '', window.location.pathname);
                }
            })();

            // Kick off preloading
            preloadAssets(ASSET_PATHS, startGameAfterPreload);

            let audioCtx = null;
            let bulletFireAudio = null;
            let missileFireAudio = null;
            let dragonFireAudio = null;

            // ── GPU / Renderer Detection ────────────────────────────────────────
            // Collects device GPU info + Canvas 2D benchmark to estimate
            // whether rendering is likely GPU-accelerated or CPU-backed.
            // Runs deferred so it doesn't block the loading screen.

            let gpuInfo = null;

            function detectGPU() {
                const info = {};

                // 1. GPU vendor & renderer via WebGL
                try {
                    const c = document.createElement('canvas');
                    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                    if (gl) {
                        const ext = gl.getExtension('WEBGL_debug_renderer_info');
                        if (ext) {
                            info.vendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL);
                            info.renderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
                        }
                        info.glVendor = gl.getParameter(gl.VENDOR);
                        info.glRenderer = gl.getParameter(gl.RENDERER);
                        gl.getExtension('WEBGL_lose_context')?.loseContext();
                    }
                } catch (e) { /* WebGL not available */ }

                // 2. Canvas 2D quick benchmark — 500 draw ops
                try {
                    const c = document.createElement('canvas');
                    c.width = 400; c.height = 400;
                    const bCtx = c.getContext('2d');
                    const t0 = performance.now();
                    for (let i = 0; i < 500; i++) {
                        bCtx.fillStyle = `hsl(${(i * 37) % 360}, 80%, 50%)`;
                        bCtx.fillRect((i * 13) % 380, (i * 7) % 380, 10 + (i % 20), 10 + (i % 20));
                        bCtx.globalAlpha = 0.3 + (i % 7) * 0.1;
                        bCtx.beginPath();
                        bCtx.arc((i * 11) % 390, (i * 17) % 390, 8 + (i % 12), 0, Math.PI * 2);
                        bCtx.fill();
                        bCtx.globalAlpha = 1.0;
                    }
                    info.benchMs = Math.round((performance.now() - t0) * 10) / 10;
                } catch (e) { info.benchMs = -1; }

                // 3. Hardware info
                info.cores = navigator.hardwareConcurrency || '?';
                info.deviceMemory = navigator.deviceMemory || '?';

                // 4. Determine likely backend (conservative — WebGL presence ≠ Canvas 2D acceleration)
                let verdict = 'Unable to determine';
                if (info.benchMs > 0 && info.benchMs < 20) {
                    verdict = info.renderer
                        ? 'Likely GPU-accelerated'
                        : 'Likely GPU-accelerated (fast Canvas 2D)';
                } else if (info.benchMs >= 20 && info.benchMs < 60) {
                    verdict = info.renderer
                        ? 'Likely GPU-accelerated (moderate)'
                        : 'Canvas 2D backend uncertain — moderate speed';
                } else if (info.benchMs >= 60) {
                    verdict = 'Likely CPU-backed or slow GPU (benchmark: ' + info.benchMs + 'ms)';
                }

                const isLowEnd =
                    (info.cores !== '?' && info.cores <= 2) ||
                    (info.deviceMemory !== '?' && info.deviceMemory <= 1);
                if (isLowEnd && info.benchMs > 0) {
                    verdict += ' [low-end device]';
                }

                info.verdict = verdict;

                // 5. Log formatted report
                const sep = '━'.repeat(48);
                console.log(`%c${sep}`, 'color:#888');
                console.log('%c 🖥  GPU DETECTION REPORT', 'font-weight:bold;font-size:13px');
                console.log(`%c${sep}`, 'color:#888');
                console.log(`  Vendor:     ${info.vendor || info.glVendor || 'N/A'}`);
                console.log(`  Renderer:   ${info.renderer || info.glRenderer || 'N/A'}`);
                console.log(`  Canvas 2D:  ${info.benchMs}ms (500 ops)`);
                console.log(`  CPU cores:  ${info.cores}`);
                console.log(`  RAM:        ${info.deviceMemory}GB`);

            //   T6   500× hitChance 0.0019 → EV = 0.960 (approx)

            //

            // Higher tiers = lower hit chance = more "luck drain" per shot.

            // A live modifier steers actual RTP back to target over time.

            const TARGET_RTP = 0.96;

            const rtp = {
                totalSpent: 0, // total betAmount units wagered

                totalPaid: 0, // total betAmount units won

                // Base per-shot kill probability per tier index 0–11

                    0.24, 0.192, 0.12, 0.048, 0.019, 0.0096, 0.0019, 0.04,
                    0.022, 0.24, 0.192, 0.0019, 0.05, 0.03, 0.02, 0.0008,

                _drift() {
                    if (this.totalSpent === 0) return 0;

                    return TARGET_RTP - this.totalPaid / this.totalSpent;
                },

                // Smooth modifier: clamps [0.50, 1.60], kicks in after 50 shots

                modifier() {
                    if (this.totalSpent < 50) return 1.0;

                    return Math.max(
                        0.5,
                        Math.min(1.6, 1.0 + this._drift() * 3.0),
                    );
                },

                currentRTP() {

                        0.003, 0.002, 0.008, 0.006, 0.0001, 0.004, 0.002,
                        0.001, 0.00005,
                    ];

                        drift > 0.3
                            ? 0.3 // 30% instant kill when RTP < 30%
                            : drift > 0.15
                              ? instantBase[tierIndex] * 2

                        0.05, 0.05, 0.072, 0.06, 0.06, 0.06, 0.06,

                        critical: false,
                        instant: false,

            // ── D1 Thunder Cluster ────────────────────────────────────────────────────

            // Reward cap table:

            let d1Count = 0; // 0–2 concurrent D1s

            const thunderFX = []; // { x, y, bolts[], alpha, radius }
            const chainLightningFX = []; // { x, y, targets[], alpha, startTime } for D4 chain lightning
            const screenShake = {

            function triggerScreenShake(amplitude, durationMs) {
                screenShake.amplitude = Math.max(screenShake.amplitude, amplitude);

            function rollD1Cap() {
                const r = rng.next();

                if (r < 0.5) return 60 + Math.floor(rng.next() * 21); // ×60–×80

                if (r < 0.8) return 81 + Math.floor(rng.next() * 20); // ×81–×100

                if (r < 0.95) return 101 + Math.floor(rng.next() * 10); // ×101–×110

                return 111 + Math.floor(rng.next() * 10); // ×111–×120

            // Called AFTER D1 is already removed from enemies array

            function triggerThunder(x, y, d1Reward) {
                const radius = 700;

                // T1A(0), T1B(1), T2(2), T3(3) are vulnerable — kill max 10-12 in range

                const vulnerable = [0, 1, 2, 3];

                const maxKills = 5 + Math.floor(rng.next() * 3); // 5-7 enemies
                const zapped = [];
                let killCount = 0;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const en = enemies[i];

                    if (Math.hypot(en.x - x, en.y - y) >= radius) continue;
                    
                    if (killCount >= maxKills) break; // Stop after 10-12 kills

                    zapped.push({ x: en.x, y: en.y }); // save pos before splice

                    enemies.splice(i, 1);
                    killCount++;

                        subText: "",
                        duration: 3000,

                    scheduleBaseReward(d1Reward, 1500);

                const bolts = [];

                const boltTargets = zapped.map((z) => ({ tx: z.x, ty: z.y }));

                const extras = 5 + Math.floor(rng.next() * 5);

                for (let i = 0; i < extras; i++) {
                    const angle = rng.next() * Math.PI * 2;

                    const dist = 60 + rng.next() * Math.min(radius, 300);

                        ty: y + Math.sin(angle) * dist,

            function triggerExplosion(x, y) {

                const vulnerable = [0, 1, 2, 3];

                if (explosionFX.length < MAX_EXPLOSION_FX) {

            function triggerD2Death(x, y, d2Reward, wasSlowed) {
                // Prevent multiple simultaneous D2 deaths (debounce)
                const now = performance.now();
                if (now - lastD2DeathTime < 500) return;
                lastD2DeathTime = now;

                // Play D2 death animation: frame 16 for 1s, then frames 17,18,21,22,23 (skip 19-20)
                const deathAnim = {

                    done: false,
                    isD2Death: true,
                    maxDuration: 2500, // Increased safety timeout
                    wasSlowed: wasSlowed,

                d2DeathAnims.push(deathAnim);

                // First explosion at D2 death position (~1750ms)
                const t1 = setTimeout(() => {
                    triggerExplosion(x, y);
                }, 1750);

                // Second explosion at offset position (~1900ms)
                const t2 = setTimeout(() => {
                    const offsetX = x + (rng.next() - 0.5) * 300;
                    const offsetY = y + (rng.next() - 0.5) * 300;
                    triggerExplosion(offsetX, offsetY);

                const t3 = setTimeout(() => {
                    const offsetX = x + (rng.next() - 0.5) * 300;
                    const offsetY = y + (rng.next() - 0.5) * 300;
                    triggerExplosion(offsetX, offsetY);
                }, 2050);

                const t4 = setTimeout(() => {

                        if (d2Reward > 0) {
                            rtp.pay(d2Reward);
                            popups.push({
                                x, y: y - 30,
