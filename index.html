                                    Math.round(-displayH / 2) + padTop,
                                    drawW, drawH);
                            }

                            ctx.restore();

                            if (e.dragonHitFlash > 0) {
                                ctx.save();
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;
                                ctx.beginPath();
                                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }

                        } else {
                            ctx.fillStyle = "#ff6600";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = "#ffffff";
                            ctx.textAlign = "center";
                            ctx.font = "bold 10px Arial";
                            ctx.fillText("T6C", e.x, e.y + 3);
                            ctx.textAlign = "left";
                        }
                    } else if (e.isD3) {
                        // Draw D3 using sprite sheet animation
                        if (d3Img.complete && d3Img.naturalWidth > 0) {
                            const now = performance.now();
                            const fw = d3Img.naturalWidth / D3_COLS;
                            const fh = d3Img.naturalHeight / D3_ROWS;
                            let row = 0, col = 0, spinRot = 0;

                            // Frame helper: 1-based frame number → (row, col)
                            const frameToRC = f => ({ r: Math.floor((f - 1) / D3_COLS), c: (f - 1) % D3_COLS });

                            // Determine animation frame based on state
                            if (e.state === "normal") {
                                // Frame 1 only, slow counter-clockwise rotation
                                const fr = frameToRC(1);
                                row = fr.r; col = fr.c;
                                spinRot = -now / 2000;
                            } else if (e.state === "spinning") {
                                const elapsed = now - e.spinTimer;
                                if (elapsed < 1500) {
                                    // Stopped - show frame 1
                                    const fr = frameToRC(1);
                                    row = fr.r; col = fr.c;
                                } else {
                                    // Animate frames 1-7 with increasing speed
                                    const abilityElapsed = elapsed - 1500;
                                    const progress = Math.min(1, abilityElapsed / 2000);
                                    const eased = progress * progress; // quadratic ease-in
                                    const frameNum = 1 + Math.min(6, Math.floor(eased * 6));
                                    const fr = frameToRC(frameNum);
                                    row = fr.r; col = fr.c;
                                }
                                spinRot = e.rotation;
                            } else if (e.state === "bouncing") {
                                // Frame 7 (fastest spin) during ability travel
                                const fr = frameToRC(7);
                                row = fr.r; col = fr.c;
                                spinRot = e.rotation;
                            } else if (e.state === "exploding") {
                                // Frames 8-15, fast to slow
                                const elapsed = now - e.explosionStart;
                                const progress = Math.min(1, elapsed / 3000);
                                // Ease-out: fast at start, slow at end
                                const eased = 1 - (1 - progress) * (1 - progress);
                                const frameNum = 8 + Math.min(7, Math.floor(eased * 7));
                                const fr = frameToRC(frameNum);
                                row = fr.r; col = fr.c;
                                spinRot = e.rotation * (1 - progress * 0.8); // rotation fades
                            }

                            const sx = col * fw;
                            const sy = row * fh;
                            
                            const drawSize = r * 3.5;
                            const dw = drawSize * (fw / fh);
                            const dh = drawSize;

                            // Fire trail during bouncing (thick-to-thin, solid-to-fade)
                            if (e.state === "bouncing" && e.trailPositions.length > 1) {
                                ctx.save();
                                ctx.lineCap = "round";
                                ctx.lineJoin = "round";
                                const trail = e.trailPositions;
                                const len = trail.length;
                                const maxW = e.size * 0.8;
                                for (let i = 1; i < len; i++) {
                                    const t = i / len;
                                    const alpha = t * 0.85;
                                    const lineW = 1 + t * maxW;
                                    const r = 255;
                                    const g = Math.floor(80 + t * 140);
                                    const b = Math.floor(t * 20);
                                    ctx.beginPath();
                                    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                                    ctx.lineTo(trail[i].x, trail[i].y);
                                    ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                                    ctx.lineWidth = lineW;
                                    ctx.stroke();
                                }
                                ctx.restore();
                            }

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.rotate(spinRot);

                            // Pulsing shadow glow during ability (bouncing)
                            if (e.state === "bouncing") {
                                ctx.shadowColor = "rgba(192, 192, 192, 0.5)";
                                ctx.shadowBlur = 12 + 6 * Math.sin(now / 200);
                            }

                            // Draw sprite
                            ctx.drawImage(d3Img, sx, sy, fw, fh, -dw/2, -dh/2, dw, dh);
                            ctx.shadowBlur = 0;

                            // Apply red flash hit effect (sprite-alpha masked)
                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(d3Img, sx, sy, fw, fh, 0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, dw, dh, -dw/2, -dh/2, dw, dh);
                            }

                            // Apply dragon hit flash
                            if (e.dragonHitFlash > 0) {
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;
                                ctx.beginPath();
                                ctx.arc(0, 0, r, 0, Math.PI * 2);
                                ctx.fill();
                            }

                            ctx.restore();
                        } else {
                            // Fallback: draw procedurally if image not loaded
                            ctx.save();
                            ctx.translate(e.x, e.y);
                            
                            const gd = ctx.createRadialGradient(
                                -r * 0.3, -r * 0.3, r * 0.1,
                                0, 0, r
                            );
                            if (e.hitEffect > 0) {
                                const ri = e.hitEffect;
                                gd.addColorStop(0, `rgba(255, ${Math.floor(224 * (1 - ri))}, ${Math.floor(224 * (1 - ri))}, 1)`);
                                gd.addColorStop(0.5, `rgba(255, ${Math.floor(192 * (1 - ri))}, ${Math.floor(192 * (1 - ri))}, 1)`);
                                gd.addColorStop(1, `rgba(255, ${Math.floor(128 * (1 - ri))}, ${Math.floor(128 * (1 - ri))}, 1)`);
                            } else {
                                gd.addColorStop(0, "#e0e0e0");
                                gd.addColorStop(0.5, "#c0c0c0");
                                gd.addColorStop(1, "#808080");
                            }
                            ctx.fillStyle = gd;
                            ctx.shadowColor = "#ffffff";
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.arc(0, 0, r, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.strokeStyle = "#a0a0a0";
                            ctx.lineWidth = 2;
                            ctx.stroke();

                            ctx.restore();
                        }
                    } else if (e.isD4) {
                        // Draw D4 sprite sheet — same grid-based state approach as D3
                        if (d4Img.complete && d4Img.naturalWidth > 0) {
                            const now = performance.now();
                            const fw = d4Img.naturalWidth / D4_COLS;
                            const fh = d4Img.naturalHeight / D4_ROWS;
                            let row = 0, col = 0, spinRot = 0;

                            // Frame helper: 1-based frame number → (row, col)
                            const frameToRC = f => ({ r: Math.floor((f - 1) / D4_COLS), c: (f - 1) % D4_COLS });

                            // Determine animation frame based on state
                            if (e.state === "normal") {
                                // Cycle frames 1-4 (row 0) for normal animation, slow rotation
                                const fr = frameToRC(1 + (Math.floor(now / 200) % 4));
                                row = fr.r; col = fr.c;
                                spinRot = now / 3000;
                            } else if (e.state === "chaining") {
                                // Cycle frames 5-8 (row 1) during chaining
                                const age = (now - e.chainStart) % 800;
                                const fr = frameToRC(5 + Math.floor((age / 800) * 4) % 4);
                                row = fr.r; col = fr.c;
                            } else if (e.state === "detonating") {
                                // Cycle frames 5-8 (row 1) during detonation
                                const age = (now - e.popAt) % 600;
                                const fr = frameToRC(5 + Math.floor((age / 600) * 4) % 4);
                                row = fr.r; col = fr.c;
                            }

                            const sx = col * fw;
                            const sy = row * fh;

                            const drawSize = r * 3.5;
                            const dw = drawSize * (fw / fh);
                            const dh = drawSize;

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.rotate(spinRot);

                            // Fade-to-solid entry effect (600ms)
                            const entryAge = now - e.bornAt;
                            if (entryAge < 600) {
                                ctx.globalAlpha = entryAge / 600;
                            }

                            // Draw sprite frame
                            ctx.drawImage(d4Img, sx, sy, fw, fh, -dw/2, -dh/2, dw, dh);

                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(d4Img, sx, sy, fw, fh, 0, 0, dw, dh);

                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, dw, dh, -dw/2, -dh/2, dw, dh);
                            }

                            // Apply dragon hit flash
                            if (e.dragonHitFlash > 0) {
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;

                            const gd = ctx.createRadialGradient(

                                e.y - r * 0.3,
                                r * 0.1,
                                e.x,
                                e.y,
                                r,

                            // Apply red flash hit effect
                            if (e.hitEffect > 0) {
                                const redIntensity = e.hitEffect;
                                gd.addColorStop(0, `rgba(255, ${Math.floor(206 * (1 - redIntensity))}, ${Math.floor(250 * (1 - redIntensity))}, 1)`);
                                gd.addColorStop(0.5, `rgba(100, ${Math.floor(180 * (1 - redIntensity))}, ${Math.floor(255 * (1 - redIntensity))}, 1)`);
                                gd.addColorStop(1, `rgba(0, ${Math.floor(150 * (1 - redIntensity))}, ${Math.floor(200 * (1 - redIntensity))}, 1)`);
                            } else {
                                gd.addColorStop(0, "#7aecff");
                                gd.addColorStop(0.5, "#00d4ff");
                                gd.addColorStop(1, "#0066cc");

                            ctx.shadowColor = "#00d4ff";
                            ctx.shadowBlur = 14;

                                const x1 = e.x + Math.cos(angle) * r;
                                const y1 = e.y + Math.sin(angle) * r;
                                const x2 = e.x + Math.cos(nextAngle) * r;

                                const brightness = 0.5 + 0.5 * Math.sin(phase * Math.PI * 2 + i * Math.PI / 4);

                                ctx.lineTo(x2, y2);

                            }

                        ctx.shadowBlur = 0;
                        ctx.lineCap = "butt";
                        ctx.lineWidth = 1;

                        ctx.fillStyle = "#fff";
                        ctx.font = "bold 11px Arial";
                        ctx.textAlign = "center";
                        ctx.fillText("D4", e.x, e.y);

                        ctx.textAlign = "left";
                    } else {
                        // T1A sprite (tier 0 + elite variant 9): face travel direction
                        if (
                            (e.tierIndex === 0 || e.tierIndex === 9) &&
                            t1aImg.complete &&
                            t1aImg.naturalWidth > 0

                            // T1A.png nose points to the RIGHT (forward along +X), so no offset.

                            ctx.translate(e.x, e.y);
                            ctx.rotate(ang);

                            // Slightly oversize vs collision circle so it feels like a plane, not a dot

                            ctx.drawImage(t1aImg, -size / 2, -size / 2, size, size);

                            if (e.isNewT1A) {
                                ctx.save();
                                ctx.globalAlpha = 0.6 + 0.3 * Math.sin(performance.now() * 0.01);

                                ctx.shadowColor = "#00ffff";

                                hitCtx.drawImage(t1aImg, 0, 0, size, size);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, size, size);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, size, size, -size / 2, -size / 2, size, size);

                            ctx.restore();

                        // T1B / T1B Elite — one sheet cell (nose +X) + facingAngle = path tangent
                        if (
                            (e.tierIndex === 1 || e.tierIndex === 10) &&
                            t1bImg.complete &&
                            t1bImg.naturalWidth > 0
                        ) {
                            const r = e.size / 2;
                            const ang = e.d4Linked ? e.d4Rotation : (e.facingAngle ?? Math.atan2(e.vy || 0, e.vx || 0));

                            const frame = T1B_DRAW_FRAME;

                            const fw = t1bImg.naturalWidth / T1B_COLS;
                            const fh = t1bImg.naturalHeight / T1B_ROWS;
                            const col = frame % T1B_COLS;
                            const row = Math.floor(frame / T1B_COLS);

                            ctx.save();

                            ctx.save();

                            const tFx = performance.now() * 0.003;
                            const flickerCore = 0.65 + 0.35 * Math.sin(tFx * 16);

                            const beamScale = e.tierIndex === 1 ? 1.5 : 1;

                        // ── T3 sprite (tier 3) ───────────────────────────────────
                        if (e.tierIndex === 3 && t3Img.complete && t3Img.naturalWidth > 0) {

                                [0,3], // frame 4

                        }
                        // ─────────────────────────────────────────────────────────

                        // ── T2 sprite (tier 2 + Elite T2 tier 12) ────────────────
                        if (
                            (e.tierIndex === 2 || e.tierIndex === 12) &&

                            const pipeOffY = dh * 0.13;   // vertical spread between the two pipes

                            const beamLen  = dw * 0.28;   // short beam length

                            const wsX  =  dw * 0.18;   // forward of center

                    }

                        ctx.shadowBlur = 12;
                        
                        const boltCount = 4;
