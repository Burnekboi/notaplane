            }

            function spawnD2() {
                if (gamePhase !== 'playing' || spawningPaused) return;
                if (d2Active) return;

                d2Active = true;

                const t = ENEMY_TIERS[8];

                // Spawn from corner edges

                const corner = Math.floor(rng.next() * 4);

                let x, y;

                if (corner === 0) {
                    // Top-left to Bottom-right

                    x = rng.next() * W;
                    y = -t.size;
                } else if (corner === 1) {
                    // Top-right to Bottom-left

                    x = rng.next() * W;
                    y = H + t.size;
                } else if (corner === 2) {
                    // Bottom-left to Top-right

                    x = -t.size;
                    y = rng.next() * H;
                } else {
                    // Bottom-right to Top-left

                    x = W + t.size;
                    y = rng.next() * H;
                }

                const style = Math.floor(rng.next() * 4);

                const born = performance.now();

                const lifespan = 10000 + rng.next() * 5000; // 10–15s then exits
                
                // D2 speed phases: fast → slow (10-12s) → fast to exit
                const slowPhaseDuration = 10000 + rng.next() * 2000; // 10-12 seconds
                const slowPhaseStart = 2000 + rng.next() * 2000; // Start 2-4s after spawn (during entering/early movement)

                const en = {
                    x,
                    y,
                    vx: 0,
                    vy: 0,

                    size: t.size,
                    hp: t.hp,
                    maxHp: t.hp,

                    tierIndex: 8,
                    wave: false,
                    born: born,
                    age: rng.next() * Math.PI * 2,

                    isD2: true,
                    entering: true, // D2 enters from edge first
                    exiting: false,
                    style: style,

                    state: "normal",
                    orbitTimer: 0,
                    orbitAngle: rng.next() * Math.PI * 2,
                    angle: rng.next() * Math.PI * 2,
                    angularV: 0.001 + rng.next() * 0.002,
                    wanderTimer: born,
                    wanderTarget: { x: W / 2, y: H / 2 },
                    hitEffect: 0,
                    
                    // Speed phase tracking
                    slowPhaseStart: slowPhaseStart,
                    slowPhaseDuration: slowPhaseDuration,
                    isSlowed: false,
                    
                    // D2 holds reward internally
                    d2Reward: betAmount * rollD2Cap(),
                    
                    // Flag to prevent multiple death triggers
                    d2Triggered: false,
                };

                enemies.push(en);

                // Switch from entering to normal movement after 1 second

                setTimeout(() => {
                    const found = enemies.find((e) => e.isD2);

                    if (found) found.entering = false;
                }, 1000);

                // After lifespan, switch to exit mode

                setTimeout(() => {
                    const found = enemies.find((e) => e.isD2);

                    if (found) found.exiting = true;
                }, lifespan);
            }

            function scheduleD2() {
                setTimeout(() => {
                    spawnD2();

                    scheduleD2();
                }, 60000); // Changed to 60 seconds (1 minute)
            }

            scheduleD2();

            // D3 Blade Wheel System

            let d3Active = false;

            let playerAttackLocked = false; // Lock player attacks during D3 death sequence

            function rollD3Cap() {
                const r = rng.next();

                if (r < 0.5) return 60 + Math.floor(rng.next() * 21); // 60-80 (50%)

                if (r < 0.9) return 81 + Math.floor(rng.next() * 15); // 81-95 (40%)

                return 96 + Math.floor(rng.next() * 55); // 96-150 (10%)
            }

            function rollD3Bounces() {
                // Always 12-20 bounces for D3 reward distribution

                return 12 + Math.floor(rng.next() * 9); // 12-20 bounces
            }

            function spawnD3() {
                if (gamePhase !== 'playing' || spawningPaused) return;
                if (d3Active) return;

                d3Active = true;

                const t = ENEMY_TIERS[13];

                // Spawn from center of screen edges for better visibility

                const side = Math.floor(rng.next() * 4);

                let x, y, vx, vy;

                const speed = 1; // 2x slower initial drift (was 2)

                if (side === 0) {
                    // Top edge

                    x = W / 2;
                    y = -t.size;
                    vx = (rng.next() - 0.5) * 2;
                    vy = speed;
                } else if (side === 1) {
                    // Right edge

                    x = W + t.size;
                    y = H / 2;
                    vx = -speed;
                    vy = (rng.next() - 0.5) * 2;
                } else if (side === 2) {
                    // Bottom edge

                    x = W / 2;
                    y = H + t.size;
                    vx = (rng.next() - 0.5) * 2;
                    vy = -speed;
                } else {
                    // Left edge

                    x = -t.size;
                    y = H / 2;
                    vx = speed;
                    vy = (rng.next() - 0.5) * 2;
                }

                const en = {
                    x,
                    y,
                    vx,
                    vy,

                    size: t.size,
                    hp: t.hp,
                    maxHp: t.hp,

                    tierIndex: 13,
                    wave: false,
                    age: rng.next() * Math.PI * 2,

                    isD3: true,

                    state: "normal", // 'normal' | 'spinning' | 'bouncing' | 'exploding'

                    spinTimer: 0,

                    bounceCount: 0,

                    maxBounces: 0,

                    bounceSpeed: 1, // Normal speed multiplier

                    rotation: 0,

                    lastBounceX: null, // Track last bounce position

                    lastBounceY: null,
                    
                    trailPositions: [],

                    // D3 holds reward internally
                    d3Reward: betAmount * rollD3Cap(),

                    // Track explosion animation timing
                    explosionStart: 0,
                    explosionStarted: false,
                };

                enemies.push(en);
            }

            function triggerD3Death(d3) {
                showTitle('D3', 0, d3);

                // Start death sequence - D3 stops, then readies ability

                d3.state = "spinning";

                d3.spinTimer = performance.now();

                d3.rotation = 0; // Abrupt stop

                d3.hp = d3.maxHp; // Restore HP for invulnerability

                playerAttackLocked = true; // Lock player attacks

                // D3 already has reward in d3.d3Reward

                d3.maxBounces = rollD3Bounces();

                d3.bounceCount = 0; // Reset bounce count to ensure proper counting

                d3.abilityPhase = 0; // Track frame animation progress (0-1)

                triggerScreenShake(6, 250); // Minimal shake on D3 death
            }

            function updateD3(d3, ts) {
                if (d3.state === "spinning") {
                    const elapsed = ts - d3.spinTimer;

                    if (elapsed < 1500) {
                        // Stopped - no rotation, showing frame 1
                        d3.rotation = 0;
                    } else {
                        // Animate frames 1-7 (indices 0-6) with increasing speed
                        const abilityElapsed = elapsed - 1500;
                        const animDuration = 2000;
                        const progress = Math.min(1, abilityElapsed / animDuration);
                        d3.abilityPhase = progress;
                        // Easing: quadratic ease-in (slow→fast)
                        const easedProgress = progress * progress;
                        const totalFrames = 7;
                        const frameIdx = Math.min(totalFrames - 1, Math.floor(easedProgress * totalFrames));
                        // CCW rotation speed increases with frame progress
                        d3.rotation += -0.05 - (frameIdx / totalFrames) * 0.4;

                        if (progress >= 1) {
                            // Frame 7 reached - transition to bouncing
                            d3.state = "bouncing";
                            d3.bounceSpeed = 6; // Slower during ability
                            // Normalize velocity
                            const spd = Math.hypot(d3.vx, d3.vy) || 1;
                            d3.vx = d3.vx / spd;
                            d3.vy = d3.vy / spd;
                        }
                    }
                } else if (d3.state === "bouncing") {
                    // Slower movement during ability
                    d3.x += d3.vx * d3.bounceSpeed;
                    d3.y += d3.vy * d3.bounceSpeed;

                    d3.trailPositions.push({ x: d3.x, y: d3.y });
                    if (d3.trailPositions.length > 80) d3.trailPositions.shift();

                    d3.rotation += 0.5; // Fast spinning during bounce

                    let bouncedThisFrame = false;

                    if (d3.x <= d3.size || d3.x >= W - d3.size) {
                        if (d3.lastBounceX !== Math.floor(d3.x)) {
                            d3.vx = -d3.vx;
                            d3.vy += (rng.next() - 0.5) * 1.5;
                            d3.lastBounceX = Math.floor(d3.x);
                            bouncedThisFrame = true;
                            spawnD3BounceParticles(d3.x, d3.y);
                            killEnemiesOnD3Path(d3.x, d3.y);
                        }
                        if (d3.x <= d3.size) d3.x = d3.size + 1;
                        if (d3.x >= W - d3.size) d3.x = W - d3.size - 1;
                    }

                    if (d3.y <= d3.size || d3.y >= H - d3.size) {
                        if (d3.lastBounceY !== Math.floor(d3.y)) {
                            d3.vy = -d3.vy;
                            d3.vx += (rng.next() - 0.5) * 1.5;
                            d3.lastBounceY = Math.floor(d3.y);
                            bouncedThisFrame = true;
                            spawnD3BounceParticles(d3.x, d3.y);
                            killEnemiesOnD3Path(d3.x, d3.y);
                        }
                        if (d3.y <= d3.size) d3.y = d3.size + 1;
                        if (d3.y >= H - d3.size) d3.y = H - d3.size - 1;
                    }

                    const currentSpeed = Math.hypot(d3.vx, d3.vy) || 1;
                    d3.vx = d3.vx / currentSpeed;
                    d3.vy = d3.vy / currentSpeed;

                    if (bouncedThisFrame) {
                        d3.bounceCount++;
                    }

                    if (d3.bounceCount >= d3.maxBounces) {
                        d3.state = "exploding";
                        d3.explosionStart = performance.now();
                        d3.explosionStarted = false;
                        d3.rotation = 0;
                        d3.trailPositions = [];
                    }
                } else if (d3.state === "exploding") {
                    // Frames 8-16 fast to slow spin handled in draw
                    d3.rotation += 0.5; // Start fast, will be adjusted by draw

                    if (!d3.explosionStarted) {
                        d3.explosionStarted = true;
                        setTimeout(() => {
                            const idx = enemies.indexOf(d3);

                            if (idx !== -1) {
                                enemies.splice(idx, 1);
                            }
                            playerAttackLocked = false;

                            if (d3.d3Reward > 0) {
                                rtp.pay(d3.d3Reward);
                                popups.push({
                                    x: d3.x,
                                    y: d3.y - 30,
                                    startTime: performance.now(),
                                    scale: 0,
                                    alpha: 1,
                                    text: d3.d3Reward.toString(),
                                    subText: "",
                                    duration: 3000,
                                });
                                scheduleBaseReward(d3.d3Reward, 1500);
                            }

                            d3Active = false;
                            setTimeout(() => {
                                spawnD3();
                            }, 30000);
                        }, 3000);
                    }
                }
            }

            function killEnemiesOnD3Path(x, y) {
                // Only T1A, T1B, T2, T3, T4 are vulnerable (tiers 0-4)

                const vulnerable = [0, 1, 2, 3, 4];

                const radius = 100; // Path damage radius

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const en = enemies[i];

                    if (!vulnerable.includes(en.tierIndex) || en.isNewT1A || en.isNewT1B) continue;

                    if (Math.hypot(en.x - x, en.y - y) >= radius) continue;

                    enemies.splice(i, 1); // Kill enemy (no reward collected)
                }
            }

            function scheduleD3() {
                setTimeout(() => {
                    spawnD3();

                    scheduleD3();
                }, 90000); // 1 minute 30 seconds between spawns
            }

            scheduleD3();

            // ── D4 Chain Lightning System ───────────────────────────────────────────

            let d4Active = false;

            function rollD4Cap() {
                if (rng.next() < 0.9) return 90 + Math.floor(rng.next() * 31); // ×90–×120 (90%)
                return 130 + Math.floor(rng.next() * 21); // ×130–×150 (10%)
            }

            function rollD4ChainCount() {
                return 5 + Math.floor(rng.next() * 11); // 5–15
            }

            function spawnD4() {
                if (gamePhase !== 'playing' || spawningPaused) return;
                if (d4Active) return;
                d4Active = true;

                const t = ENEMY_TIERS[14];
                const x = 80 + rng.next() * (W - 160);
                const y = 80 + rng.next() * (H - 160);
                const angle = rng.next() * Math.PI * 2;

                const en = {
                    x,
                    y,
                    vx: Math.cos(angle) * t.speed,
                    vy: Math.sin(angle) * t.speed,

                    size: t.size,
                    hp: t.hp,
                    maxHp: t.hp,

                    tierIndex: 14,
                    wave: true,
                    age: rng.next() * Math.PI * 2,

                    isD4: true,
                    state: "normal", // 'normal' | 'chaining' | 'detonating'

                    bornAt: performance.now(),
                    exitAt: performance.now() + 18000 + rng.next() * 6000,
                    exitTarget: {
                        x: rng.next() < 0.5 ? -120 : W + 120,
                        y: 40 + rng.next() * (H - 80),
                    },

                    chainStart: 0,
                    chainRevealCount: 0,
                    chainTargets: [],
                    d4Reward: 0, // D4 holds the reward pool itself
                    popAt: 0,
                };

                enemies.push(en);
            }

            function scheduleD4() {
                setTimeout(() => {
                    if (rng.next() < 0.5) spawnD4();
                    scheduleD4();
                }, 60000); // Check every 1 minute, 50% chance to spawn
            }

            function triggerD4Death(d4) {
                showTitle('D4', 0, d4);
                d4.state = "chaining";
                d4.hp = d4.maxHp; // invulnerable during chain
                d4.vx = 0;
                d4.vy = 0;
                d4.chainStart = performance.now();
                d4.chainRevealCount = 0;
                // D4 itself holds the reward pool
                d4.d4Reward = betAmount * rollD4Cap();

                const maxLinks = rollD4ChainCount();
                const pool = enemies.filter(
                    (en) =>
                        en !== d4 &&
                        !en.state &&
                        !en.isD3 &&
                        !en.isD4 &&
                        !en.isBoss &&
                        [0, 1, 2, 3].includes(en.tierIndex) && 
                        !en.isNewT1A && !en.isNewT1B,
                );

                const links = [];
                let lx = d4.x;
                let ly = d4.y;
                while (pool.length > 0 && links.length < maxLinks) {
                    let bestIdx = 0;
                    let bestDist = Infinity;
                    for (let i = 0; i < pool.length; i++) {
                        const p = pool[i];
                        const d = Math.hypot(p.x - lx, p.y - ly);
                        if (d < bestDist) {
                            bestDist = d;
                            bestIdx = i;
                        }
                    }
                    const chosen = pool.splice(bestIdx, 1)[0];
                    links.push(chosen);
                    lx = chosen.x;
                    ly = chosen.y;
                }

                d4.chainTargets = links;
            }

            function updateD4(d4, ts) {
                if (d4.state === "normal") {
                    const age = ts - d4.bornAt;
                    const cycle = (age % 5000) / 5000; // slow -> fast -> slow
                    const speedMul = 0.45 + Math.sin(cycle * Math.PI) * 0.95;
                    const baseSpeed = ENEMY_TIERS[14].speed * speedMul;

                    const driftX = Math.sin(d4.age * 2.2) * 0.08;
                    const driftY = Math.cos(d4.age * 2.0) * 0.08;
                    const vLen = Math.hypot(d4.vx, d4.vy) || 1;

                    d4.vx = (d4.vx / vLen) * baseSpeed + driftX;
                    d4.vy = (d4.vy / vLen) * baseSpeed + driftY;

                    if (ts > d4.exitAt) {
                        const dx = d4.exitTarget.x - d4.x;
                        const dy = d4.exitTarget.y - d4.y;
                        const dl = Math.hypot(dx, dy) || 1;
                        d4.vx += (dx / dl) * 0.06;
                        d4.vy += (dy / dl) * 0.06;
                    }
                    // Track electrical animation
                    d4.electricalPhase = (age % 1000) / 1000;
                    return;
                }

                if (d4.state === "chaining") {
                    d4.vx = 0;
                    d4.vy = 0;

                    const elapsed = ts - d4.chainStart;
                    const revealEvery = 210;
                    const revealCount = Math.min(
                        d4.chainTargets.length,
                        Math.floor(elapsed / revealEvery),
                    );

                    for (let i = d4.chainRevealCount; i < revealCount; i++) {
                        const t = d4.chainTargets[i];
                        if (!t || !enemies.includes(t)) continue;
                        t.d4Linked = true;
                        t.d4LinkedAt = ts;
                        t.d4LinkPhase = rng.next() * Math.PI * 2;
                        t.d4AnchorX = t.x;
                        t.d4AnchorY = t.y;
                        t.vx = 0;
                        t.vy = 0;
                        t.d4RotationSpeed = 0.5 + rng.next() * 1.5; // Minimal random speed
                    }
                    d4.chainRevealCount = revealCount;

                    for (let i = 0; i < d4.chainRevealCount; i++) {
                        const t = d4.chainTargets[i];
                        if (!t || !enemies.includes(t)) continue;
                        const tt = (ts - t.d4LinkedAt) / 1000;
                        t.x = t.d4AnchorX + Math.sin(tt * 3 + t.d4LinkPhase) * 2;
                        t.y = t.d4AnchorY + Math.sin(tt * 5 + t.d4LinkPhase) * 4;
                        t.d4Rotation = tt * (t.d4RotationSpeed || 1.0);
                    }

                    if (
                        d4.chainRevealCount >= d4.chainTargets.length &&
                        elapsed > d4.chainTargets.length * revealEvery + 900
                    ) {
                        d4.state = "detonating";
                        d4.popAt = ts + 900;
                        // Create chain lightning FX
                        chainLightningFX.push({
                            x: d4.x,
                            y: d4.y,
                            targets: d4.chainTargets.filter(t => enemies.includes(t)),
                            alpha: 1.0,
                            startTime: ts
                        });
                    }
                    return;
                }

                if (d4.state === "detonating") {
                    // Pull all targets toward D4 with increasing force
                    const elapsed = ts - d4.chainStart;
                    const pullPhase = Math.min(1, (elapsed - d4.chainTargets.length * 210 - 900) / 800);
                    const pullStrength = 0.08 + pullPhase * 0.06;
                    
                    for (let i = 0; i < d4.chainTargets.length; i++) {
                        const t = d4.chainTargets[i];
                        if (!t || !enemies.includes(t)) continue;
                        t.x += (d4.x - t.x) * pullStrength;
                        t.y += (d4.y - t.y) * pullStrength;
                    }

                    if (ts >= d4.popAt) {
                        // Zap all enemies (they give 0 reward - D4 holds the pool)
                        for (let i = 0; i < d4.chainTargets.length; i++) {
                            const t = d4.chainTargets[i];
                            if (!t || !enemies.includes(t)) continue;
                            // Enemies are zapped but give 0 reward
                            const ti = enemies.indexOf(t);
                            if (ti !== -1) enemies.splice(ti, 1);
                        }

                        // D4 itself drops the reward
                        if (d4.d4Reward > 0) {
                            rtp.pay(d4.d4Reward);
                            popups.push({
                                x: d4.x,
                                y: d4.y - 30,
                                startTime: performance.now(),
                                scale: 0,
                                alpha: 1,
                                text: d4.d4Reward.toString(),
                                subText: "",
                                duration: 3000,
                            });
                            scheduleBaseReward(d4.d4Reward, 1500);
                        }

                        if (explosionFX.length < MAX_EXPLOSION_FX) {
                        const fx = poolNext(explosionFX); fx.active = true; fx.x = d4.x; fx.y = d4.y; fx.alpha = 1.0; fx.radius = 95;
                        }
                        
                        chainLightningFX.push({
                            x: d4.x,
                            y: d4.y,
                            targets: [],
                            alpha: 1.0,
                            startTime: ts,
                            isPop: true
                        });

                        triggerScreenShake(15, 320);

                        const di = enemies.indexOf(d4);
                        if (di !== -1) enemies.splice(di, 1);
                        
                        // D4 respawn timer - 2 minutes
                        d4Active = false;
                        setTimeout(() => {
                            if (rng.next() < 0.5) spawnD4();
                        }, 120000);
                    }
                }
            }

            scheduleD4();
            
            // ── chain variants ───────────────────────────────────────────────────
            function updateNewVariants(v, ts, idx) {
                if (v.state === "chaining") {
                    v.vx = 0; v.vy = 0;
                    
                    if (v.floatY === undefined) v.floatY = v.y;
                    v.y = v.floatY + Math.sin(ts / 200) * 3;

                    const elapsed = ts - v.chainStart;
                    
                    if (elapsed < 1000) {
                        v.chargePhase = elapsed / 1000;
                        v.chainRevealCount = 0;
                    } else {
                        v.chargePhase = 1.0;
                        const chainElapsed = elapsed - 1000;
                        const revealEvery = 200;
                        const revealCount = Math.min(v.chainTargets.length, Math.floor(chainElapsed / revealEvery));
                        
                        for (let i = v.chainRevealCount; i < revealCount; i++) {
                            const t = v.chainTargets[i];
                            if (!t || !enemies.includes(t)) continue;
                            t.chainVariantLinked = true;
                            t.chainVariantLinkedAt = ts;
                            t.floatY = t.y;
                            t.hp = 999;
                            t.vx = 0; t.vy = 0;
                            if (t.tierIndex === 1) t.t1bDiagSpeed = 0;
                        }
                        v.chainRevealCount = revealCount;

                        if (v.chainRevealCount >= v.chainTargets.length && chainElapsed > v.chainTargets.length * revealEvery + 800) {
                            v.state = "detonating";
                            v.popAt = ts + 500;
                            
                            chainLightningFX.push({ x: v.x, y: v.y, targets: [], alpha: 1.0, startTime: ts, isPop: true });
                            triggerScreenShake(10, 200);
                        }
                    }

                    for (let i = 0; i < v.chainRevealCount; i++) {
                        const t = v.chainTargets[i];
                        if (!t || !enemies.includes(t) || t.floatY === undefined) continue;
                        t.y = t.floatY + Math.sin(ts / 200 + i) * 3;
                    }
                } else if (v.state === "detonating") {
                    for (const t of v.chainTargets) {
                        if (!t || !enemies.includes(t)) continue;
                        t.x += (rng.next() - 0.5) * 4;
                        t.y += (rng.next() - 0.5) * 4;
                    }
                    if (ts > v.popAt) {
                        // Kill all targets
                        for (const t of v.chainTargets) {
                            if (!t || !enemies.includes(t)) continue;
                            t.killedByChainVariant = true;
                            killEnemy(t, enemies.indexOf(t));
                        }
                        // Drop reward
                        if (v.chainRewardAmt > 0) {
                            rtp.pay(v.chainRewardAmt);
                            spawnExplosionAnimation(v.x, v.y, v.tierIndex, v.size);
                            popups.push({
                                x: v.x,
                                y: v.y - 30,
                                startTime: performance.now(),
                                scale: 0,
                                alpha: 1,
                                text: v.chainRewardAmt.toString(),
                                subText: "",
                                duration: 3000,
                            });
                            scheduleBaseReward(v.chainRewardAmt, 1500);
                        }
                        const vi = enemies.indexOf(v);
                        if (vi !== -1) enemies.splice(vi, 1);
                    }
                }
            }

            function spawnNewVariant() {
                if (gamePhase !== 'playing' || spawningPaused) return;
                const isA = rng.next() > 0.5;
                const ti = isA ? 0 : 1;
                const t = ENEMY_TIERS[ti];

                const e = {
                    x: rng.next() > 0.5 ? -40 : W + 40,
                    y: 40 + rng.next() * (H - 140),
                    vx: 0,
                    vy: 0,
                    size: t.size * 1.5,
                    hp: 15,
                    mult: t.mult,
                    tierIndex: ti,
                    wave: false,
                    age: 0,
                    hitEffect: 0,
                    bornAt: performance.now(),
                    isNewT1A: isA,
                    isNewT1B: !isA
                };
                const speed = t.speed;
                e.vx = e.x < 0 ? speed : -speed;

                if (ti === 1) initT1BPathState(e, performance.now());
                enemies.push(e);
            }

            function scheduleNewVariants() {
                setTimeout(() => {
                    spawnNewVariant();
                    scheduleNewVariants();
                }, 10000);
            }
            scheduleNewVariants();

            // Boss System (T6 & T6B) ────────────────────────────────────────────────

            const BOSS_INTERVAL = 60000; // 1 minute

            // T6B reward scale: dragon strike uses 0.5s ticks (cadence DRAGON_FIRE_RATE); lightning /
            // nuke / bullets keep 1s ticks with the original 500ms stale window.
            const T6B_DRAGON_TICK_MS = 500;

            const T6B_DRAGON_RECENT_HIT_MS = DRAGON_FIRE_RATE + 250;

            const T6B_OTHER_TICK_MS = 1000;

            const T6B_OTHER_RECENT_HIT_MS = 500;

            let bossState = {
                active: false,

                currentType: "T6B", // Starts with T6B

                passesLeft: 0,

                boss: null,

                bossHp: null,

                nextSpawn: BOSS_INTERVAL,

                lastFromLeft: null,

                hitStartTime: null,

                t6bRewardScale: 200,

                t6bDragonLastHitTs: 0,

                t6bDragonHitAccumulator: 0,

                t6bOtherLastHitTs: 0,

                t6bOtherHitAccumulator: 0,

                t6bLastUpdateTs: 0,
            };

            function spawnBossPass() {
                if (gamePhase !== 'playing' || spawningPaused) return;
                const isT6B = bossState.currentType === "T6B";

                const tierIdx = isT6B ? 11 : 6;

                const t = ENEMY_TIERS[tierIdx];

                let fromLeft =
                    bossState.lastFromLeft === null
                        ? rng.next() < 0.5
                        : !bossState.lastFromLeft;

                let x, y, vx, vy;

                if (isT6B) {
                    if (bossState.t6bLastExitSide === undefined) {
                        bossState.t6bLastExitSide = null;
                    }

                    const isSpawnLeft =
                        bossState.t6bLastExitSide === "left"
                            ? true
                            : bossState.t6bLastExitSide === "right"
                              ? false
                              : rng.next() < 0.5;

                    const isTop = rng.next() < 0.5;

                    if (isSpawnLeft) {
                        x = -t.size;

                        y = isTop ? -t.size : H + t.size;
                    } else {
                        x = W + t.size;

                        y = isTop ? -t.size : H + t.size;
                    }

                    const angle = Math.atan2(H / 2 - y, W / 2 - x);

                    vx = Math.cos(angle) * t.speed * 4;

                    vy = Math.sin(angle) * t.speed * 4;

                    bossState.lastFromLeft = x < W / 2;
                } else {
                    bossState.lastFromLeft = fromLeft;

                    y = 60 + rng.next() * (H - 180);

                    x = fromLeft ? -t.size : W + t.size;

                    vx = fromLeft ? t.speed : -t.speed;

                    vy = 0;
                }

                if (bossState.bossHp === null) bossState.bossHp = t.hp;

                const boss = {
                    x,
                    y,
                    vx,
                    vy,

                    size: t.size,
                    hp: bossState.bossHp,
                    maxHp: t.hp,

                    tierIndex: tierIdx,
                    wave: false,
                    age: 0,
                    isBoss: true,

                    state: isT6B ? "enter" : "normal",

                    orbitTimer: 0,

                    orbitAngle: rng.next() * Math.PI * 2,
                };

                bossState.boss = boss;

                enemies.push(boss);
            }

            function processBossHit(e, ts, fromDragon = false) {
                if (!e || e.tierIndex !== 11) return;
                if (fromDragon) bossState.t6bDragonLastHitTs = ts;
                else bossState.t6bOtherLastHitTs = ts;
            }

            function t6bRewardScaleStepForBand(scale) {
                if (scale >= 600) return 0;
                if (scale >= 500) return 1; // x500–x600
                if (scale >= 401) return 2; // x401–x499
                if (scale >= 200) return 3; // x200–x400
                return 0;
            }

            function rollBossSpecial(ts, boss) {
                const sinceSpawn = bossState.hitStartTime
                    ? (ts - bossState.hitStartTime) / 1000
                    : 0;

                // Boss spike damage is intentionally capped to avoid huge swing kills.
                if (sinceSpawn <= 5 && rng.next() < 0.001)
                    return Math.ceil(boss.maxHp * 0.065);

                if (!bossState.hitStartTime) bossState.hitStartTime = ts;

                const dur = (ts - bossState.hitStartTime) / 1000;

                if (dur > 20 && rng.next() < 0.012)
                    return Math.ceil(boss.maxHp * 0.13);

                if (dur > 10 && rng.next() < 0.005)
                    return Math.ceil(boss.maxHp * 0.095);

                return 0;
            }

            function updateBoss(ts) {
                if (bossState.active && bossState.currentType === "T6B") {
                    const dt = ts - (bossState.t6bLastUpdateTs || ts);

                    bossState.t6bLastUpdateTs = ts;

                    if (
                        ts - bossState.t6bDragonLastHitTs <
                        T6B_DRAGON_RECENT_HIT_MS
                    ) {
                        bossState.t6bDragonHitAccumulator += dt;
                        let safety = 0;
                        while (safety++ < 50) {
                            const rate = t6bRewardScaleStepForBand(
                                bossState.t6bRewardScale,
                            );
                            if (rate <= 0) break;
                            if (
                                bossState.t6bDragonHitAccumulator <
                                T6B_DRAGON_TICK_MS
                            )
                                break;
                            bossState.t6bDragonHitAccumulator -=
                                T6B_DRAGON_TICK_MS;
                            bossState.t6bRewardScale = Math.min(
                                600,
                                bossState.t6bRewardScale + rate,
                            );
                        }
                    } else {
                        bossState.t6bDragonHitAccumulator = 0;
                    }

                    if (
                        ts - bossState.t6bOtherLastHitTs <
                        T6B_OTHER_RECENT_HIT_MS
                    ) {
                        bossState.t6bOtherHitAccumulator += dt;
                        let safety = 0;
                        while (safety++ < 50) {
                            const rate = t6bRewardScaleStepForBand(
                                bossState.t6bRewardScale,
                            );
                            if (rate <= 0) break;
                            if (
                                bossState.t6bOtherHitAccumulator <
                                T6B_OTHER_TICK_MS
                            )
                                break;
                            bossState.t6bOtherHitAccumulator -=
                                T6B_OTHER_TICK_MS;
                            bossState.t6bRewardScale = Math.min(
                                600,
                                bossState.t6bRewardScale + rate,
                            );
                        }
                    } else {
                        bossState.t6bOtherHitAccumulator = 0;
                    }
                }

                if (bossState.active) {
                    if (bossState.boss && !enemies.includes(bossState.boss)) {
                        if (bossState.boss.x < W / 2)
                            bossState.t6bLastExitSide = "left";
                        else bossState.t6bLastExitSide = "right";

                        bossState.bossHp = bossState.boss.hp;

                        bossState.passesLeft--;

                        bossState.boss = null;

                        if (bossState.passesLeft > 0) {
                            setTimeout(spawnBossPass, 1200);
                        } else {
                            bossState.active = false;

                            bossState.lastFromLeft = null;

                            bossState.currentType =
                                bossState.currentType === "T6" ? "T6B" : "T6";

                            bossState.t6bRewardScale = 200;

                            bossState.nextSpawn = ts + BOSS_INTERVAL;
                        }
                    }
                } else {
                    if (spawningPaused) { /* skip */ }
                    else if (ts >= bossState.nextSpawn) {
                        bossState.active = true;

                        bossState.passesLeft =
                            bossState.currentType === "T6B" ? 6 : 5;

                        bossState.boss = null;

                        bossState.bossHp = null;

                        bossState.t6bLastUpdateTs = ts;

                        spawnBossPass();
                    }
                }
            }

            function updateT6Ability(e, ts, idx) {
                const elapsed = ts - e.t6ChargeStart;

                if (e.state === "charging") {
                    e.vx = 0;
                    e.vy = 0;

                    if (elapsed >= 3000) {
                        e.state = "crossing";
                        // Start first cross: pick side based on position
                        e.t6CrossDir = e.x < W / 2 ? 1 : -1;
                        e.t6CrossingStartX = e.x;
                    }
                } else if (e.state === "crossing") {
                    const baseSpeed = 16;
                    const sizeMult = e.t6CrossesDone >= 1 ? 2.5 : 1.0;
                    e.size = ENEMY_TIERS[6].size * sizeMult;
                    e.vx = e.t6CrossDir * baseSpeed;
                    e.vy = 0;

                    // Check if T6 has completely exited the screen
                    const margin = e.size + 50;
                    const crossed = (e.t6CrossDir === 1 && e.x > W + margin) ||
                                    (e.t6CrossDir === -1 && e.x < -margin);

                    if (crossed) {
                        // Spawn 10-12 mini explosions at random screen positions
                        const explosionCount = 10 + Math.floor(rng.next() * 3);
                        for (let i = 0; i < explosionCount; i++) {
                            const ex = rng.next() * W;
                            const ey = rng.next() * H;
                            spawnExplosionAnimation(ex, ey, 0, 10 + rng.next() * 15);
                        }

                        // Roll reward for this crossing if not the 1st
                        if (e.t6CrossesDone > 0) {
                            const crossReward = (100 + Math.floor(rng.next() * 51)) * betAmount;
                            e.t6TotalReward += crossReward;
                        }

                        e.t6CrossesDone++;

                        if (e.t6CrossesDone >= e.t6CrossCount) {
                            // All crosses done → finish phase
                            e.state = "finishing";
                            e.vx = 0;
                            e.vy = 0;
                            e.t6FinishStart = ts;
                            // Move to center of screen
                            e.targetX = W / 2;
                            e.targetY = H / 2;
                        } else {
                            // Pause 2 seconds before next cross
                            e.state = "crossPause";
                            e.vx = 0;
                            e.vy = 0;
                            e.t6CrossPauseUntil = ts + 2000;
                        }
                    }
                } else if (e.state === "crossPause") {
                    e.vx = 0;
                    e.vy = 0;
                    if (ts >= e.t6CrossPauseUntil) {
                        e.state = "crossing";
                        e.t6CrossDir *= -1;
                        const margin2 = e.size + 50;
                        e.x = e.t6CrossDir === 1 ? -margin2 : W + margin2;
                    }
                } else if (e.state === "finishing") {
                    // Move toward center
                    const dx = (W / 2) - e.x;
                    const dy = (H / 2) - e.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 5) {
                        const speed = 6;
                        e.vx = (dx / dist) * speed;
                        e.vy = (dy / dist) * speed;
                    } else {
                        e.vx = 0;
                        e.vy = 0;
                        e.x = W / 2;
                        e.y = H / 2;

                        // Wait 3 seconds then explode
                        if (ts - e.t6FinishStart >= 3000) {
                            e.state = "exploding";
                            e.t6ExplodeStart = ts;

                            // Pay total reward: base ×500 + accumulated cross rewards
                            const totalPayout = e.t6BaseReward + e.t6TotalReward;
                            rtp.pay(totalPayout);
                            popups.push({
                                x: e.x,
                                y: e.y - 30,
                                startTime: performance.now(),
                                scale: 0,
                                alpha: 1,
                                text: totalPayout.toString(),
                                subText: "",
                                duration: 3000,
                            });
                            scheduleBaseReward(totalPayout, 1500);

                            // Screen shake then explosion
                            triggerScreenShake(12, 300);
                            setTimeout(() => {
                                spawnExplosionAnimation(e.x, e.y, 6, e.size * 2);
                            }, 200);
                        }
                    }
                } else if (e.state === "exploding") {
                    e.vx = 0;
                    e.vy = 0;

                    // Remove T6 after a short delay (explosion animation plays)
                    if (ts - e.t6ExplodeStart > 2500) {
                        const ei = enemies.indexOf(e);
                        if (ei !== -1) {
                            enemies.splice(ei, 1);
                        }
                        const tii = activeTitles.findIndex(t => t.type === 'T6');
                        if (tii !== -1) activeTitles.splice(tii, 1);
                        playerAttackLocked = false;

                        // Reset boss cycle so T6B spawns next, then T6 after (full cycle)
                        bossState.active = false;
                        bossState.boss = null;
                        bossState.bossHp = null;
                        bossState.lastFromLeft = null;
                        bossState.hitStartTime = null;
                        bossState.currentType = "T6B";
                        bossState.t6bRewardScale = 200;
                        bossState.nextSpawn = performance.now() + BOSS_INTERVAL;
                    }
                }
            }

            function initT1BPathState(e, ts) {
                e.wave = false;
                e.t1bMotionMode = "straight";
                e.t1bNextModeTs = ts + (1000 + rng.next() * 2000);
                e.t1bDiagSpeed = 0;
                e.t1bLastPerpVel = 0;
                e.t1bLastTs = ts;
            }

            function makeEnemy(x, y, vx, vy, t, wave, ti) {
                const now = performance.now();

                const useWave = ti === 1 || ti === 10 ? false : wave;

                const e = {
                    x,
                    y,
                    vx,
                    vy,

                    size: t.size,

                    hp: t.hp,

                    maxHp: t.hp,

                    tierIndex: ti,

                    wave: useWave,

                    age: rng.next() * Math.PI * 2,

                    hitEffect: 0, // Red flash effect timer

                    originalColor: t.color,
                };

                if (ti === 1 || ti === 10) initT1BPathState(e, now);

                if (ti === 15) {
                    e.t6cMode = "slow";
                    e.t6cModeStart = now;
                    e.t6cModeDuration = 5000 + Math.random() * 3000;
                    e.t6cFrameIdx = 1;
                    e.t6cFastFrame = 0;
                    e.t6cPhaseStart = now;
                }

                return e;
            }

            function isTargetable(en) {
                if (!en || !enemies.includes(en)) return false;

                if (en.state === "dying") return false;

                if (en.isD3 && en.state !== "normal") return false;

                if (en.isD4 && en.state !== "normal") return false;

                if (en.d4Linked) return false;
                
                if (en.state === "chaining" || en.state === "detonating") return false;
                
                if (en.chainVariantLinked) return false;

                if (en.tierIndex === 6 && en.t6Triggered) return false;

                return true;
            }

            function spawnEnemy() {
                if (gamePhase !== 'playing' || spawningPaused) return;

                // Skip ~25% of spawn calls to reduce overall density
                if (Math.random() < 0.25) return;
                const side = Math.floor(Math.random() * 3);

                const roll = Math.random();

                // T1A=0, T1B=1, T2=2, T3=3, T4=4, T5=5

                // T1A+T1B heavy, good T2 presence

                const tier =
                    roll < 0.10
                        ? 0
                        : roll < 0.20
                          ? 1
                          : roll < 0.42
                            ? 2
                            : roll < 0.60
                              ? 3
                              : roll < 0.90
                                ? 4
                                : 5;

                const t = ENEMY_TIERS[tier];

                // T1A rows are straight/diagonal, T1B rows are wave

                if ((tier === 0 || tier === 1) && Math.random() < 0.20) {
                    spawnRow(side, t, tier);
                    return;
                }

                const speed = (0.8 + Math.random() * 1.2) * t.speed;

                const drift =
                    tier <= 1 ? 0.3 : tier === 2 ? 0.6 : tier === 3 ? 0.9 : 1.2;

                // T1A never waves; T1B uses initT1BPathState (straight / wave segments)

                const wave = false;

                let x, y, vx, vy;

                // T1A and T1B get randomized speed 1–2

                const finalSpeed =
                    tier === 0 || tier === 1 ? 1 + Math.random() : speed;

                if (side === 0) {
                    x = -t.size;
                    y = 40 + Math.random() * (H - 140);
                    vx = finalSpeed;
                    vy = (Math.random() - 0.5) * 2 * drift;
                } else if (side === 1) {
                    x = W + t.size;
                    y = 40 + Math.random() * (H - 140);
                    vx = -finalSpeed;
                    vy = (Math.random() - 0.5) * 2 * drift;
                } else {
                    x = Math.random() * W;
                    y = -t.size;
                    vx = (Math.random() - 0.5) * drift;
                    vy = finalSpeed;
                }

                enemies.push(makeEnemy(x, y, vx, vy, t, wave, tier));
            }

            // Gap = T4 size for spacing between row enemies

            const ROW_GAP = ENEMY_TIERS[4].size + 4;

            function spawnRow(side, t, tierIndex) {
                // T1B always 5-wave, T1A always 3-diagonal

                const is5Wave = tierIndex === 1;

                const count = is5Wave ? 5 : 3;

                // T1A/T1B rows get randomized speed 1–2

                const speed = 1 + Math.random();

                let baseX, baseY, vx, vy;

                if (side === 0) {
                    baseY = 40 + Math.random() * (H - 140);
                    vx = speed;

                    vy = is5Wave
                        ? (Math.random() - 0.5) * 0.4
                        : (Math.random() < 0.5 ? 0.5 : -0.5) * speed;

                    for (let i = 0; i < count; i++)
                        enemies.push(
                            makeEnemy(
                                -t.size - i * ROW_GAP,
                                baseY,
                                vx,
                                vy,
                                t,
                                is5Wave,
                                tierIndex,
                            ),
                        );
                } else if (side === 1) {
                    baseY = 40 + Math.random() * (H - 140);
                    vx = -speed;

                    vy = is5Wave
                        ? (Math.random() - 0.5) * 0.4
                        : (Math.random() < 0.5 ? 0.5 : -0.5) * speed;

                    for (let i = 0; i < count; i++)
                        enemies.push(
                            makeEnemy(
                                W + t.size + i * ROW_GAP,
                                baseY,
                                vx,
                                vy,
                                t,
                                is5Wave,
                                tierIndex,
                            ),
                        );
                } else {
                    baseX = 40 + Math.random() * (W - 80);
                    vy = speed;

                    vx = is5Wave
                        ? (Math.random() - 0.5) * 0.4
                        : (Math.random() < 0.5 ? 0.5 : -0.5) * speed;

                    for (let i = 0; i < count; i++)
                        enemies.push(
                            makeEnemy(
                                baseX,
                                -t.size - i * ROW_GAP,
                                vx,
                                vy,
                                t,
                                is5Wave,
                                tierIndex,
                            ),
                        );
                }
            }

            // ── 30-Minute Auto-Reset ─────────────────────────────────────────────────

            let resetTimer = null;
            let spawnStopTimer = null;
            let spawningPaused = false;

            function scheduleReset() {
                if (resetTimer) clearTimeout(resetTimer);
                if (spawnStopTimer) clearTimeout(spawnStopTimer);
                spawningPaused = false;
                const RESET_DELAY = 30 * 60 * 1000;
                const SPAWN_STOP_DELAY = RESET_DELAY - 5000;
                spawnStopTimer = setTimeout(() => { spawningPaused = true; }, SPAWN_STOP_DELAY);
                resetTimer = setTimeout(resetGame, RESET_DELAY);
            }

            function resetGame() {
                spawningPaused = false;
                if (spawnStopTimer) { clearTimeout(spawnStopTimer); spawnStopTimer = null; }
                bgDrawn = false;

                // Clear entity arrays
                bullets.length = 0;
                enemies.length = 0;
                activeMissiles.length = 0;
                nukeMissiles.length = 0;
                eliteT2Missiles.length = 0;
                smokeFX.length = 0;
                lightningSparks.length = 0;
                activeTitles.length = 0;
                popups.length = 0;
                baseRewardPopups.length = 0;
                refundPopups.length = 0;
                pendingRewards.length = 0;
                explosionAnimations.length = 0;
                thunderFX.length = 0;
                chainLightningFX.length = 0;
                thunderAttacks.length = 0;
                dragonImpactFX.length = 0;
                dragonBaseAttackFX.length = 0;
                explosionFX.length = 0;
                d2DeathAnims.length = 0;
                if (window.d2Shockwaves) window.d2Shockwaves.length = 0;

                // Clear burst interval
                if (burstInterval) {
                    clearInterval(burstInterval);
                    burstInterval = null;
                }
                isHolding = false;

                // Reset game phase back to intro
                gamePhase = 'intro';
                introStartTime = performance.now();

                // Reset player position
                player.x = W / 2;

                // Reset balance / economy
                // Before resetting, sync any remaining balance to server
                syncBalanceNow();
                balance = 0;
                betIndex = 0;
                betAmount = BET_VALUES[0];
                betDisplay.textContent = betAmount.toString();
                updateStrikeCosts();

                // Reset RTP
                rtp.totalSpent = 0;
                rtp.totalPaid = 0;
                sessionTotalBets = 0;
                sessionTotalWins = 0;
                lastSyncedBets = 0;
                lastSyncedWins = 0;

                // Reset crit state
                critState.phase = 'idle';
                critState.shotCount = 0;
                critState.threshold = 0;
                critState.windowStart = 0;

                // Reset missile state
                missileState.shotsCount = 0;
                missileState.threshold = 90 + Math.floor(rng.next() * 11);

                // Reset auto mode
                autoMode = false;
                autoTierIndex = -1;
                autoTarget = null;
                laserAlpha = 0;
                lastAutoFire = 0;
                document.getElementById("autoBtn").classList.remove("active");

                // Reset nuke mode
                nukeMode = false;
                lastNukeFire = 0;
                missileBtn.style.boxShadow = "0 0 10px rgba(255,80,0,0.5), inset 0 0 6px rgba(255,60,0,0.15)";
                missileBtn.style.borderColor = "#cc4400";

                // Reset dragon mode
                dragonMode = false;
                lastDragonFire = 0;
                dragonBtn.style.boxShadow = "0 0 10px rgba(255,80,0,0.5), inset 0 0 6px rgba(255,60,0,0.15)";
                dragonBtn.style.borderColor = "#cc4400";

                // Reset encounter flags
                d1Count = 0;
                d2Active = false;
                lastD2DeathTime = 0;
                d3Active = false;
                playerAttackLocked = false;
                d4Active = false;
                t6cSpawnCooldown = false;

                // Reset boss state
                bossState.active = false;
                bossState.currentType = "T6B";
                bossState.passesLeft = 0;
                bossState.boss = null;
                bossState.bossHp = null;
                bossState.nextSpawn = BOSS_INTERVAL;
                bossState.lastFromLeft = null;
                bossState.hitStartTime = null;
                bossState.t6bRewardScale = 200;
                bossState.t6bDragonLastHitTs = 0;
                bossState.t6bDragonHitAccumulator = 0;
                bossState.t6bOtherLastHitTs = 0;
                bossState.t6bOtherHitAccumulator = 0;
                bossState.t6bLastUpdateTs = 0;

                // Reset animation state
                cannonFrame = 0;
                cannonFrameTimer = 0;
                lightningFrame = 0;
                lightningTimer = 0;
                dragonBaseFrame = 0;
                dragonBaseFrameTimer = 0;

                // Reset screen shake
                screenShake.amplitude = 0;
                screenShake.endAt = 0;

                // Reinitialize stars
                stars = initStars();

                // Reset loop timestamp to avoid huge delta
                lastLoopTs = 0;

                // Show intro UI
                document.getElementById('hudOverlay').style.display = 'none';
                document.getElementById('ui').style.display = 'none';
                document.getElementById('missileBtn').style.display = 'none';
                document.getElementById('dragonBtn').style.display = 'none';

                // Restart background music for new cycle
                const bgEl = document.getElementById('bgMusic');
                if (bgEl) {
                    delete bgEl.dataset.started;
                    bgEl.currentTime = 0;
                }
                startBgMusic();

                // Schedule next 30-minute reset
                scheduleReset();
            }

            // Solo T1A, T1B, T2 on dedicated fast timers

            setInterval(spawnEnemy, 1200);

            setInterval(() => {
                if (gamePhase !== 'playing' || spawningPaused) return;

                // extra solo T1A (straight)

                const side = Math.floor(Math.random() * 3),
                    t = ENEMY_TIERS[0];

                const speed = 1 + Math.random(),
                    drift = 0.4;

                let x, y, vx, vy;

                if (side === 0) {
                    x = -t.size;
                    y = 40 + Math.random() * (H - 140);
                    vx = speed;
                    vy = (Math.random() - 0.5) * 2 * drift;
                } else if (side === 1) {
                    x = W + t.size;
                    y = 40 + Math.random() * (H - 140);
                    vx = -speed;
                    vy = (Math.random() - 0.5) * 2 * drift;
                } else {
                    x = Math.random() * W;
                    y = -t.size;
                    vx = (Math.random() - 0.5) * drift;
                    vy = speed;
                }

                enemies.push(makeEnemy(x, y, vx, vy, t, false, 0));

            function update(ts) {

                        );

                    const dx = m.target.x - m.x,
                        dy = m.target.y - m.y;

                        continue;

                    if (m.age < 30) {

                    } else {
                        m.speed = m.baseSpeed; // Normal speed near enemy
