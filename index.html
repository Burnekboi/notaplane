                });

                // Thunder FX

                for (const fx of thunderFX) {
                    if (fx.alpha <= 0) continue;

                    ctx.strokeStyle = `rgba(0,255,136,${fx.alpha * 0.5})`;

                    ctx.lineWidth = 2;

                    ctx.shadowColor = "#00ff88";
                    ctx.shadowBlur = 12;

                    ctx.beginPath();

                    ctx.arc(
                        fx.x,
                        fx.y,
                        fx.radius * (1 - fx.alpha * 0.5),
                        0,
                        Math.PI * 2,
                    );

                    ctx.stroke();

                    ctx.shadowBlur = 0;

                    for (const segs of fx.bolts) {
                        ctx.strokeStyle = `rgba(${fx.alpha > 0.5 ? "180,255,180" : "0,255,136"},${fx.alpha})`;

                        ctx.lineWidth = 1.5;

                        ctx.shadowColor = "#00ff88";
                        ctx.shadowBlur = 8;

                        ctx.beginPath();

                        ctx.moveTo(segs[0].x, segs[0].y);

                        for (let s = 1; s < segs.length; s++)
                            ctx.lineTo(segs[s].x, segs[s].y);

                        ctx.stroke();

                        ctx.shadowBlur = 0;
                    }
                }

                // Explosion FX (D2) with shockwaves

                // Update and render shockwaves
                if (window.d2Shockwaves) {
                    for (let i = window.d2Shockwaves.length - 1; i >= 0; i--) {
                        const shockwave = window.d2Shockwaves[i];
                        const elapsed = performance.now() - shockwave.startTime;
                        const duration = 400; // 400ms shockwave duration
                        const progress = Math.min(elapsed / duration, 1.0);
                        
                        shockwave.radius = shockwave.maxRadius * progress;
                        shockwave.alpha = Math.max(0, 1.0 - progress);
                        
                        if (progress >= 1.0) {
                            window.d2Shockwaves.splice(i, 1);
                            continue;
                        }
                        
                        // Draw shockwave ring
                        ctx.strokeStyle = `rgba(255, 200, 100, ${shockwave.alpha * 0.8})`;
                        ctx.lineWidth = 3;
                        ctx.shadowColor = "#ffaa00";
                        ctx.shadowBlur = 12;
                        ctx.beginPath();
                        ctx.arc(shockwave.x, shockwave.y, shockwave.radius, 0, Math.PI * 2);
                        ctx.stroke();
                        
                        // Inner glow
                        ctx.strokeStyle = `rgba(255, 255, 150, ${shockwave.alpha * 0.5})`;
                        ctx.lineWidth = 6;
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        ctx.arc(shockwave.x, shockwave.y, Math.max(0, shockwave.radius - 3), 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                }

                for (const fx of explosionFX) {
                    if (!fx.active || fx.alpha <= 0) continue;

                    const expand = 1 - fx.alpha;

                    ctx.strokeStyle = `rgba(255,0,255,${fx.alpha * 0.6})`;

                    ctx.lineWidth = 3;

                    ctx.shadowColor = "#ff00ff";
                    ctx.shadowBlur = 10;

                    ctx.beginPath();

                    ctx.arc(
                        fx.x,
                        fx.y,
                        fx.radius * (0.3 + expand * 0.7),
                        0,
                        Math.PI * 2,
                    );

                    ctx.stroke();

                    ctx.strokeStyle = `rgba(255,180,255,${fx.alpha})`;

                    ctx.lineWidth = 1.5;

                    ctx.beginPath();

                    ctx.arc(
                        fx.x,
                        fx.y,
                        fx.radius * (0.1 + expand * 0.4),
                        0,
                        Math.PI * 2,
                    );

                    ctx.stroke();

                    ctx.shadowBlur = 0;

                    for (let s = 0; s < 8; s++) {
                        const angle = (s / 8) * Math.PI * 2;

                        const len = fx.radius * expand * 0.6;

                        ctx.strokeStyle = `rgba(255,100,255,${fx.alpha * 0.8})`;

                        ctx.lineWidth = 1;

                        ctx.beginPath();

                        ctx.moveTo(
                            fx.x + Math.cos(angle) * len * 0.3,
                            fx.y + Math.sin(angle) * len * 0.3,
                        );

                        ctx.lineTo(
                            fx.x + Math.cos(angle) * len,
                            fx.y + Math.sin(angle) * len,
                        );

                        ctx.stroke();
                    }
                }

                // Chain Lightning FX (D4)

                for (const fx of chainLightningFX) {
                    if (fx.alpha <= 0) continue;

                    if (fx.isPop) {
                        // Electrical pop burst effect when D4 detonates
                        const bursts = 16;
                        for (let i = 0; i < bursts; i++) {
                            const angle = (Math.PI * 2 * i) / bursts;
                            const distance = 30 + (1 - fx.alpha) * 150;
                            const ex = fx.x + Math.cos(angle) * distance;
                            const ey = fx.y + Math.sin(angle) * distance;
                            
                            ctx.strokeStyle = `rgba(0, 212, 255, ${fx.alpha * 0.7})`;
                            ctx.lineWidth = 2;
                            ctx.shadowColor = "#00d4ff";
                            ctx.shadowBlur = 15;
                            
                            ctx.beginPath();
                            ctx.moveTo(fx.x, fx.y);
                            ctx.lineTo(ex, ey);
                            ctx.stroke();
                        }
                        
                        // Expanding rings
                        for (let i = 0; i < 4; i++) {
                            const ringSize = 20 + (1 - fx.alpha) * 120 + i * 30;
                            ctx.strokeStyle = `rgba(0, 212, 255, ${fx.alpha * (0.6 - i * 0.15)})`;
                            ctx.lineWidth = 1.5;
                            ctx.shadowBlur = 0;
                            
                            ctx.beginPath();
                            ctx.arc(fx.x, fx.y, ringSize, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        
                        // Central bright burst
                        const burstSize = 15 + (1 - fx.alpha) * 25;
                        const gd = ctx.createRadialGradient(fx.x, fx.y, 0, fx.x, fx.y, burstSize);
                        gd.addColorStop(0, `rgba(255, 255, 255, ${fx.alpha * 0.8})`);
                        gd.addColorStop(0.5, `rgba(100, 212, 255, ${fx.alpha * 0.4})`);
                        gd.addColorStop(1, `rgba(0, 100, 200, 0)`);
                        
                        ctx.fillStyle = gd;
                        ctx.beginPath();
                        ctx.arc(fx.x, fx.y, burstSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // Draw lightning arcs connecting D4 to each linked target
                        for (let i = 0; i < fx.targets.length; i++) {
                            const target = fx.targets[i];
                            if (!target || !enemies.includes(target)) continue;

                            const sx = fx.x;
                            const sy = fx.y;
                            const tx = target.x;
                            const ty = target.y;

                            // Draw jagged lightning bolt
                            const steps = 5 + Math.floor(Math.random() * 3);
                            const segs = [];

                            for (let s = 0; s <= steps; s++) {
                                const p = s / steps;
                                segs.push({
                                    x: sx + (tx - sx) * p + (s > 0 && s < steps ? (Math.random() - 0.5) * 25 : 0),
                                    y: sy + (ty - sy) * p + (s > 0 && s < steps ? (Math.random() - 0.5) * 25 : 0),
                                });
                            }

                            // Main arc line
                            ctx.strokeStyle = `rgba(0, 212, 255, ${fx.alpha * 0.8})`;
                            ctx.lineWidth = 2;
                            ctx.shadowColor = "#00d4ff";
                            ctx.shadowBlur = 12;
                            ctx.lineCap = "round";
                            ctx.lineJoin = "round";

                            ctx.beginPath();
                            ctx.moveTo(segs[0].x, segs[0].y);
                            for (let s = 1; s < segs.length; s++) ctx.lineTo(segs[s].x, segs[s].y);
                            ctx.stroke();

                            // Glow effect
                            ctx.strokeStyle = `rgba(150, 230, 255, ${fx.alpha * 0.3})`;
                            ctx.lineWidth = 5;
                            ctx.shadowBlur = 0;

                            ctx.beginPath();
                            ctx.moveTo(segs[0].x, segs[0].y);
                            for (let s = 1; s < segs.length; s++) ctx.lineTo(segs[s].x, segs[s].y);
                            ctx.stroke();

                            ctx.shadowBlur = 0;
                            ctx.lineCap = "butt";
                            ctx.lineJoin = "miter";
                        }

                        // Bright sphere at D4 origin
                        ctx.shadowColor = "#00d4ff";
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = `rgba(255, 255, 255, ${fx.alpha * 0.6})`;
                        ctx.beginPath();
                        ctx.arc(fx.x, fx.y, 8, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.shadowBlur = 0;
                    }
                }

                // D2 Death Animations (frames 16, then 17, 18, 21, 22, 23)
                // Frame 16 (index 15): 1000ms
                // Frames 17, 18, 21, 22, 23 (indices 16, 17, 20, 21, 22): 150ms each
                for (let i = d2DeathAnims.length - 1; i >= 0; i--) {
                    const deathAnim = d2DeathAnims[i];
                    if (!deathAnim) continue; // Safety check
                    
                    const elapsed = performance.now() - deathAnim.startTime;
                    
                    // Safety: force remove animation after max duration
                    if (deathAnim.maxDuration && elapsed > deathAnim.maxDuration) {
                        d2DeathAnims.splice(i, 1);
                        continue;
                    }
                    
                    if (d2Img && d2Img.complete && d2Img.naturalWidth > 0) {
                        let d2FrameIdx = -1;
                        
                        if (deathAnim.isD2Death) {
                            // Frame 16 (index 15) for first 1000ms
                            if (elapsed < 1000) {
                                d2FrameIdx = 15;
                            } else if (elapsed < 1750) {
                                // Frames 17, 18, 21, 22, 23 (indices 16, 17, 20, 21, 22) at 150ms each
                                const t = elapsed - 1000; // Time after frame 16
                                const frameOffset = Math.floor(t / 150);
                                const frameSequence = [16, 17, 20, 21, 22]; // Skip indices 18, 19
                                
                                // Bounds checking to prevent array out of bounds
                                if (frameOffset >= 0 && frameOffset < frameSequence.length) {
                                    d2FrameIdx = frameSequence[frameOffset];
                                } else {
                                    // Animation should be complete
                                    d2DeathAnims.splice(i, 1);
                                    continue;
                                }
                            } else {
                                // Animation complete, remove from array
                                d2DeathAnims.splice(i, 1);
                                continue;
                            }
                        } else {
                            // Invalid animation type, remove
                            d2DeathAnims.splice(i, 1);
                            continue;
                        }

                        // Safety checks before drawing
                        if (d2FrameIdx >= 0 && d2FrameIdx < D2_FRAMES.length && D2_FRAMES[d2FrameIdx]) {
                            const [sx, sy, sw, sh] = D2_FRAMES[d2FrameIdx];
                            if (sw > 0 && sh > 0 && Number.isFinite(deathAnim.x) && Number.isFinite(deathAnim.y)) {
                                const drawSize = 120;
                                const dw = drawSize * (sw / sh);
                                const dh = drawSize;

                                ctx.save();
                                try {
                                    let shakeX = 0, shakeY = 0;
                                    if (elapsed < 1000 && deathAnim.wasSlowed) {
                                        // "Shake or wobble" during the first 1s
                                        shakeX = (Math.random() - 0.5) * 8;
                                        shakeY = (Math.random() - 0.5) * 8;
                                        ctx.translate(deathAnim.x + shakeX, deathAnim.y + shakeY);
                                        ctx.rotate((Math.random() - 0.5) * 0.1); // slight wobble
                                    } else {
                                        ctx.translate(deathAnim.x, deathAnim.y);
                                    }
                                    ctx.drawImage(d2Img, sx, sy, sw, sh, -dw/2, -dh/2, dw, dh);
                                } catch (err) {
                                    console.error("D2 death animation error:", err);
                                    d2DeathAnims.splice(i, 1);
                                } finally {
                                    ctx.restore();
                                }
                            }
                        }
                    }
                }

                // Explosion Animations (frame-by-frame sprite rendering)

                explosionAnimations.forEach((ex) => {
                    if (
                        explosionSheet &&
                        explosionSheet.complete &&
                        explosionSheet.naturalWidth > 0 &&
                        ex.frameIndex < EXPLOSION_FRAMES
                    ) {
                        // Calculate grid position for this frame
                        const fw = explosionSheet.naturalWidth / EXPLOSION_COLS;
                        const fh = explosionSheet.naturalHeight / EXPLOSION_ROWS;
                        const col = ex.frameIndex % EXPLOSION_COLS;
                        const row = Math.floor(ex.frameIndex / EXPLOSION_COLS);

                        ctx.save();
                        ctx.translate(ex.x, ex.y);
                        ctx.rotate(ex.rotation);
                        ctx.drawImage(
                            explosionSheet,
                            col * fw,
                            row * fh,
                            fw,
                            fh,
                            -ex.size / 2,
                            -ex.size / 2,
                            ex.size,
                            ex.size
                        );
                        ctx.restore();
                    }
                });

                // Smoke FX

                smokeFX.forEach((s) => {
                    if (!s.active) return;
                    ctx.save();

                    ctx.translate(s.x, s.y);

                    ctx.rotate(s.angle);

                    ctx.scale(s.scale, s.scale);

                    ctx.globalAlpha = s.alpha;

                    if (smokeImg.complete && smokeImg.naturalWidth > 0) {
                        ctx.drawImage(smokeImg, -25, -25, 50, 50); // Drawn centered
                    } else {
                        ctx.fillStyle = "#888";

                        ctx.beginPath();
                        ctx.arc(0, 0, 15, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.restore();
                });

                // Missiles

                activeMissiles.forEach((m) => {
                    const angle = Math.atan2(m.ty - m.startY, m.tx - m.startX);

                    // Zoom in at start (progress 0->0.3), zoom out at end (progress 0.7->1)

                    let scale = 1;

                    if (m.progress < 0.3) {
                        scale = m.progress / 0.3; // zooms in from 0 to 1
                    } else if (m.progress > 0.7) {
                        scale = (1.0 - m.progress) / 0.3; // zooms out from 1 to 0
                    }

                    ctx.save();

                    ctx.translate(m.x, m.y);

                    ctx.rotate(angle + Math.PI);

                    ctx.scale(scale, scale);

                    if (missileImg.complete && missileImg.naturalWidth > 0) {
                        ctx.drawImage(missileImg, -37.5, -12.5, 75, 25);
                    } else {
                        ctx.fillStyle = "#ff4757";

                        ctx.fillRect(-18.5, -5, 37.5, 10);

                        ctx.fillStyle = "#ffa502";

                        ctx.fillRect(-18.5, -7.5, 6, 15);
                    }

                    ctx.restore();
                });

                // Bullets with sprite rotation

                bullets.forEach((b) => {
                    if (!b.active) return;
                    ctx.save();
                    if (bulletImg.complete && bulletImg.naturalWidth > 0) {

                        ctx.translate(b.x, b.y);

                        // b.vy, b.vx gives angle, +PI/2 because sprite points UP

                        ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);

                        ctx.drawImage(bulletImg, -17.5, -27.5, 35, 55);
                    } else {
                        ctx.fillStyle = "#eccc68";

                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });

                lightningSparks.forEach((p) => {
                    if (!p.active) return;
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation || Math.atan2(p.vy, p.vx));
                    ctx.strokeStyle = p.color || "#ff4a4a";
                    ctx.lineWidth = Math.max(1, p.size * 0.75);
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    ctx.moveTo(-(p.length || 8) * 0.5, 0);
                    ctx.lineTo((p.length || 8) * 0.5, 0);
                    ctx.stroke();

                    ctx.globalAlpha = p.alpha * 0.55;
                    ctx.strokeStyle = "#ffd0d0";
                    ctx.lineWidth = Math.max(1, p.size * 0.35);
                    ctx.beginPath();
                    ctx.moveTo(-(p.length || 8) * 0.2, 0);
                    ctx.lineTo((p.length || 8) * 0.2, 0);
                    ctx.stroke();
                    ctx.restore();
                });

                ctx.globalAlpha = 1;

                // ── D1 Title Image (behind base) ────────────────────────────────────

                for (const t of activeTitles) {
                    if (t.type !== 'D1') continue;
                    const img = d1TitleImg;
                    if (img.complete && img.naturalWidth > 0) {
                        const th = 42 * 2;
                        const tw = th * (img.naturalWidth / img.naturalHeight);
                        const titleX = player.x - tw / 2;
                        const titleY = player.y - 60 - th + 30;
                        ctx.drawImage(img, titleX, titleY, tw, th);
                    }
                }

                // ── Player: Base Cannon (static, centered) ──────────────────────────────

                const baseSize = 120;

                const textboxOk =
                    baseTextboxImg.complete && baseTextboxImg.naturalWidth > 0;
                const textboxW = 74;
                const textboxH = 50;
                const textboxOverlap = 24;
                const textboxY =
                    player.y + baseSize / 2 - textboxH - 12;
                const centerTextboxW = 50;
                const centerTextboxH = 36;
                const centerTextboxX = player.x - centerTextboxW / 2;
                const centerTextboxY =
                    player.y + 22 - centerTextboxH / 2;
                const leftTextboxX =
                    player.x - baseSize / 2 - textboxW + textboxOverlap;
                const rightTextboxX =
                    player.x + baseSize / 2 - textboxOverlap;

                const nukeBaseOk =
                    nukeBaseImg.complete && nukeBaseImg.naturalWidth > 0;

                const nukeBarrelOk =
                    nukeBarrelImg.complete && nukeBarrelImg.naturalWidth > 0;

                const dragonBaseOk =
                    dragonBaseImg.complete && dragonBaseImg.naturalWidth > 0;

                if (textboxOk) {
                    ctx.save();
                    ctx.globalCompositeOperation = "source-over";
                    ctx.drawImage(
                        baseTextboxImg,
                        leftTextboxX,
                        textboxY,
                        textboxW,
                        textboxH,
                    );
                    ctx.save();
                    ctx.translate(
                        rightTextboxX + textboxW / 2,
                        textboxY + textboxH / 2,
                    );
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        baseTextboxImg,
                        -textboxW / 2,
                        -textboxH / 2,
                        textboxW,
                        textboxH,
                    );
                    ctx.restore();
                    ctx.restore();
                }


                if (dragonMode && dragonBaseOk) {
                    ctx.save();

                    ctx.globalCompositeOperation = "source-over";

                    // Use spritesheet animation for dragon base (similar to cannon)

                    const fw = dragonBaseImg.naturalWidth / DRAGON_BASE_COLS;

                    const fh = dragonBaseImg.naturalHeight / DRAGON_BASE_ROWS;

                    const col = dragonBaseFrame % DRAGON_BASE_COLS;

                    const row = Math.floor(dragonBaseFrame / DRAGON_BASE_COLS);

                    ctx.drawImage(
                        dragonBaseImg,
                        col * fw,
                        row * fh,
                        fw,
                        fh,
                        player.x - baseSize / 2,
                        player.y - baseSize / 2,
                        baseSize,
                        baseSize,
                    );

                    ctx.restore();

                    const orb = getDragonOrbPosition();
                    const idlePulse =
                        0.68 + 0.32 * Math.sin(performance.now() / 90);

                    ctx.save();
                    ctx.globalCompositeOperation = "lighter";

                    const outerGlow = ctx.createRadialGradient(
                        orb.x,
                        orb.y,
                        0,
                        orb.x,
                        orb.y,
                        DRAGON_ORB_IDLE_RADIUS * 2.9,
                    );
                    outerGlow.addColorStop(0, "rgba(255,255,255,0.95)");
                    outerGlow.addColorStop(
                        0.18,
                        `rgba(255,140,140,${0.8 * idlePulse})`,
                    );
                    outerGlow.addColorStop(
                        0.5,
                        `rgba(255,40,40,${0.45 * idlePulse})`,
                    );
                    outerGlow.addColorStop(1, "rgba(255,0,0,0)");
                    ctx.fillStyle = outerGlow;
                    ctx.beginPath();
                    ctx.arc(
                        orb.x,
                        orb.y,
                        DRAGON_ORB_IDLE_RADIUS * 2.9,
                        0,
                        Math.PI * 2,
                    );
                    ctx.fill();

                    const coreGlow = ctx.createRadialGradient(
                        orb.x,
                        orb.y,
                        0,
                        orb.x,
                        orb.y,
                        DRAGON_ORB_IDLE_RADIUS,
                    );
                    coreGlow.addColorStop(0, "rgba(255,255,255,0.98)");
                    coreGlow.addColorStop(0.3, "rgba(255,210,210,0.95)");
                    coreGlow.addColorStop(0.7, "rgba(255,70,70,0.8)");
                    coreGlow.addColorStop(1, "rgba(255,10,10,0)");
                    ctx.fillStyle = coreGlow;
                    ctx.beginPath();
                    ctx.arc(
                        orb.x,
                        orb.y,
                        DRAGON_ORB_IDLE_RADIUS,
                        0,
                        Math.PI * 2,
                    );
                    ctx.fill();
                    ctx.restore();
                } else if (nukeMode && nukeBaseOk) {
                    ctx.save();

                    ctx.globalCompositeOperation = "source-over";

                    ctx.drawImage(
                        nukeBaseImg,
                        player.x - baseSize / 2,
                        player.y - baseSize / 2,
                        baseSize,
                        baseSize,
                    );

                    ctx.restore();
                } else if (
                    !nukeMode &&
                    !dragonMode &&
                    baseCannonImg.complete &&
                    baseCannonImg.naturalWidth > 0
                ) {
                    ctx.drawImage(
                        baseCannonImg,
                        player.x - baseSize / 2,
                        player.y - baseSize / 2,
                        baseSize,
                        baseSize,
                    );
                } else {
                    ctx.fillStyle = nukeMode
                        ? "#cc2200"
                        : dragonMode
                          ? "#ff6600"
                          : "#2ed573";

                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 20, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ── Enemy Title Images (above base) ──────────────────────────────────

                const TITLE_BASE_H = 42;
                for (const t of activeTitles) {
                    if (t.type === 'D1') continue;
                    const img = t.type === 'T6' ? t6TitleImg : t.type === 'T6B' ? t6bTitleImg : t.type === 'T6C' ? t6cTitleImg : t.type === 'NT1' ? nt1TitleImg : t.type === 'D2' ? d2TitleImg : t.type === 'D3' ? d3TitleImg : t.type === 'D4' ? d4TitleImg : null;
                    if (img && img.complete && img.naturalWidth > 0) {
                        const isT6C = t.type === 'T6C';
                        const scale = isT6C ? 3 : (t.type === 'NT1' || t.type === 'D1' || t.type === 'D2') ? 2 : (t.type === 'D3' || t.type === 'D4') ? 2 : 1.5;
                        const th = TITLE_BASE_H * scale;
                        const tw = th * (img.naturalWidth / img.naturalHeight);
                        const gap = isT6C ? -45 : t.type === 'T6' ? -10 : t.type === 'T6B' ? -25 : (t.type === 'NT1' || t.type === 'D1' || t.type === 'D2' || t.type === 'D3' || t.type === 'D4') ? -30 : 2;
                        const titleX = player.x - tw / 2;
                        const titleY = player.y - baseSize / 2 - th - gap;
                        ctx.drawImage(img, titleX, titleY, tw, th);
                    }
                }

                // ── Player: Barrel (rotates toward mouse) ────────────────────────────────

                // In nuke+auto mode, barrel points at the auto-aim target

                let aimX = mouseX,
                    aimY = mouseY;

                if (
                    (nukeMode || dragonMode) &&
                    autoMode &&
                    autoTarget &&
                    enemies.includes(autoTarget)
                ) {
                    aimX = autoTarget.x;
                    aimY = autoTarget.y;
                }

                const barrelAngle = Math.atan2(
                    aimY - player.y,
                    aimX - player.x,
                );

                const angle = barrelAngle + Math.PI / 2; // used by normal cannon only

                if (nukeMode && nukeBarrelOk && !dragonMode) {
                    const barrelW = 85,
                        barrelH = 95;

                    const isFiringNuke = nukeMissiles.length > 0;

                    ctx.save();

                    ctx.translate(player.x, player.y);

                    ctx.rotate(barrelAngle);

                    // Image: left side = red tube tip (firing end), right side = claw (base)

                    // Flip horizontally so the red tube tip points toward the target

                    ctx.scale(-1, 1);

                    ctx.drawImage(
                        nukeBarrelImg,
                        -barrelW * 0.65,
                        -barrelH / 2,
                        barrelW,
                        barrelH,
                    );

                    // Blue gem glow animation when firing

                    if (isFiringNuke) {
                        const gemPulse =
                            0.6 + 0.4 * Math.sin(performance.now() / 60);

                        ctx.save();

                        ctx.globalCompositeOperation = "lighter";

                        const gemGrad = ctx.createRadialGradient(
                            0,
                            0,
                            0,
                            0,
                            0,
                            14,
                        );

                        gemGrad.addColorStop(
                            0,
                            `rgba(100,180,255,${gemPulse})`,
                        );

                        gemGrad.addColorStop(1, "transparent");

                        ctx.fillStyle = gemGrad;

                        ctx.beginPath();
                        ctx.arc(0, 0, 14, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();
                    }

                    ctx.restore();
                } else if (
                    !nukeMode &&
                    !dragonMode &&
                    cannonSheetImg.complete &&
                    cannonSheetImg.naturalWidth > 0
                ) {
                    const fw = cannonSheetImg.naturalWidth / CANNON_COLS;

                    const fh = cannonSheetImg.naturalHeight / CANNON_ROWS;

                    const col = cannonFrame % CANNON_COLS;

                    const row = Math.floor(cannonFrame / CANNON_COLS);

                    const cannonSize = 100;

                    ctx.save();

                    ctx.translate(player.x, player.y);

                    ctx.rotate(angle); // angle = barrelAngle + PI/2 for normal cannon

                    ctx.drawImage(
                        cannonSheetImg,
                        col * fw,
                        row * fh,
                        fw,
                        fh,
                        -cannonSize / 2,
                        -cannonSize / 2,
                        cannonSize,
                        cannonSize,
                    );

                    ctx.restore();
                } else if (!nukeMode && !dragonMode) {
                    ctx.save();

                    ctx.translate(player.x, player.y);

                    ctx.rotate(
                        Math.atan2(mouseY - player.y, mouseX - player.x),
                    );

                    ctx.fillStyle = "#1e90ff";

                    ctx.fillRect(0, -8, 36, 16);

                    ctx.restore();
                }

                // ── Nuke missiles draw ────────────────────────────────────────────────

                const nukeMissileOk =
                    nukeMissileImg.complete && nukeMissileImg.naturalWidth > 0;

                for (const m of nukeMissiles) {
                    const mAngle = Math.atan2(m.vy, m.vx);

                    ctx.save();


                    ctx.translate(m.x, m.y);

                    ctx.rotate(mAngle + Math.PI / 4); // missile icon is diagonal

                    if (nukeMissileOk) {
                        ctx.globalCompositeOperation = "source-over";

                        ctx.drawImage(nukeMissileImg, -16, -16, 32, 32);
                    } else {
                        ctx.fillStyle = "#ff4400";

                        ctx.fillRect(-12, -4, 24, 8);
                    }

                    ctx.restore();
                }

                // ── Elite T2 homing missiles draw ─────────────────────────────

                const eliteT2MissileOk =
                    eliteT2MissileImg.complete &&
                    eliteT2MissileImg.naturalWidth > 0;

                for (const m of eliteT2Missiles) {
                    const mAngle = Math.atan2(m.vy, m.vx);

                    ctx.save();

                    ctx.translate(m.x, m.y);

                    ctx.rotate(mAngle + Math.PI / 4); // missile icon is diagonal

                    ctx.scale(m.scale, m.scale);

                    if (eliteT2MissileOk) {
                        ctx.globalCompositeOperation = "source-over";

                        ctx.drawImage(eliteT2MissileImg, -16, -16, 32, 32);
                    } else {
                        ctx.fillStyle = "#ff6600";

                        ctx.fillRect(-12, -4, 24, 8);
                    }

                    ctx.restore();
                }

                // ── Lightning Ball + Beam: auto-aim system (normal mode only) ───────────

                if (autoMode && !nukeMode && !dragonMode) {
                    // Shared position: ball center sits just above the top of the base cannon

                    const ballCX = player.x;

                    const ballCY = player.y - 45 - LIGHTNING_SIZE * 0.35;

                    // 1. LIGHTNING BEAM — Organic procedural bolt

                    if (autoTarget) {
                        drawProceduralBolt(
                            ballCX,
                            ballCY,
                            autoTarget.x,
                            autoTarget.y,
                            "rgba(255,200,100,0.55)",
                            "#fff",
                        );

                    }

                    // 3. LIGHTNING BALL — drawn on top of the beam base

                    if (
                        lightningSheet &&
                        lightningSheet.complete &&
                        lightningSheet.naturalWidth > 0 &&
                        lightningFrames.length > 0
                    ) {
                        const lf = lightningFrames[lightningFrame];

                        const fr = lf.frame;

                        const sss = lf.spriteSourceSize;

                        const ss = lf.sourceSize;

                        const scale = LIGHTNING_SIZE / ss.w;

                        const dstX = sss.x * scale;

                        const dstY = sss.y * scale;

                        const dstW = fr.w * scale;

                        const dstH = fr.h * scale;

                        ctx.save();

                        const pulse =
                            0.6 + 0.4 * Math.sin(performance.now() / 180);

                        ctx.shadowColor = `rgba(255,180,80,${pulse * 0.4})`;

                        ctx.shadowBlur = 6;

                        ctx.drawImage(
                            lightningSheet,

                            fr.x,
                            fr.y,
                            fr.w,
                            fr.h,

                            ballCX - LIGHTNING_SIZE / 2 + dstX,

                            ballCY - LIGHTNING_SIZE / 2 + dstY,

                            dstW,
                            dstH,
                        );

                        ctx.restore();
                    } else {
                        // Fallback — glowing energy orb with visible outline ring

                        const now = performance.now();

                        const innerPulse = 0.7 + 0.3 * Math.sin(now / 150);

                        const r2 = LIGHTNING_SIZE / 2 - 4; // slightly smaller outline

                        // Outer glow

                        ctx.save();

                        const orbGrad = ctx.createRadialGradient(
                            ballCX,
                            ballCY,
                            0,
                            ballCX,
                            ballCY,
                            r2,
                        );

                        orbGrad.addColorStop(
                            0,
                            `rgba(255,255,255,${0.9 * innerPulse})`,
                        );

                        orbGrad.addColorStop(
                            0.4,
                            `rgba(255,200,100,${0.5 * innerPulse})`,
                        );

                        orbGrad.addColorStop(1, "transparent");

                        ctx.fillStyle = orbGrad;

                        // shadow removed - was causing blue flash

                        ctx.beginPath();

                        ctx.arc(ballCX, ballCY, r2, 0, Math.PI * 2);

                        ctx.fill();

                        ctx.restore();

                        // Solid outline ring

                        ctx.save();

                        ctx.strokeStyle = `rgba(255,180,80,${0.5 + 0.3 * innerPulse})`;

                        ctx.lineWidth = 2;

                        ctx.shadowColor = "#ffcc66";

                        ctx.shadowBlur = 10;

                        ctx.beginPath();

                        ctx.arc(ballCX, ballCY, r2, 0, Math.PI * 2);

                        ctx.stroke();

                        ctx.restore();

                        // ── Mini thunder cluster inside the ball (only when attacking) ──

                        if (autoTarget) {
                            // Use a seeded-by-time offset so bolts flicker every ~80ms

                            const tick = Math.floor(now / 80);

                            const boltCount = 4;

                            ctx.save();

                            ctx.beginPath();
                            ctx.arc(ballCX, ballCY, r2 - 1, 0, Math.PI * 2);
                            ctx.clip();

                            for (let b = 0; b < boltCount; b++) {
                                // Each bolt gets a stable-ish random seed per tick

                                const seed = (tick * 7 + b * 31) & 0xffff;

                                const s = (n) =>
                                    (((Math.sin(seed * 127.1 + n * 311.7) *
                                        43758.5453) %
                                        1) +
                                        1) %
                                    1;

                                const angle = s(0) * Math.PI * 2;

                                const len = r2 * (0.4 + s(1) * 0.5);

                                const ex = ballCX + Math.cos(angle) * len;

                                const ey = ballCY + Math.sin(angle) * len;

                                // 2–3 jagged segments

                                const segs = 2 + Math.floor(s(2) * 2);

                                const alpha = 0.5 + 0.5 * s(3);

                                ctx.strokeStyle = `rgba(255,220,150,${alpha})`;

                                ctx.lineWidth = 1;

                                ctx.shadowColor = "#ffcc66";

                                ctx.shadowBlur = 6;

                                ctx.beginPath();

                                ctx.moveTo(ballCX, ballCY);

                                for (let sg = 1; sg <= segs; sg++) {
                                    const t = sg / segs;

                                    const jx =
                                        ballCX +
                                        (ex - ballCX) * t +
                                        (s(sg * 5) - 0.5) * r2 * 0.4;

                                    const jy =
                                        ballCY +
                                        (ey - ballCY) * t +
                                        (s(sg * 7) - 0.5) * r2 * 0.4;

                                    ctx.lineTo(jx, jy);
                                }

                                ctx.stroke();
                            }

                            ctx.restore();
                        }

                        // Inner bright core

                        ctx.save();

                        ctx.fillStyle = `rgba(255,220,150,${0.4 * innerPulse})`;

                        ctx.beginPath();

                        ctx.arc(ballCX, ballCY, r2 * 0.3, 0, Math.PI * 2);

                        ctx.fill();

                        ctx.restore();
                    }
                }

                // ── Dragon Power spritesheet animation (visual only) ───────────
                const thunderOk =
                    thunderImg.complete && thunderImg.naturalWidth > 0;
                for (const thunder of thunderAttacks) {
                    if (!thunderOk) continue;
                    const progress = Math.min(
                        1,
                        1 - thunder.ttl / THUNDER_TOTAL_MS,
                    );
                    const scale =
                        (1.55 +
                            Math.sin(Math.min(progress, 0.75) * Math.PI) *
                                0.12) *
                        1.5;
                    var alpha =
                        thunder.frame >= THUNDER_EXPLOSION_START
                            ? 1 -
                              ((thunder.frame - THUNDER_EXPLOSION_START) /
                                  THUNDER_EXPLOSION_FRAMES) *
                                  0.25
                            : 0.97;


                    const fw = thunderImg.naturalWidth / THUNDER_COLS;
                    const fh = thunderImg.naturalHeight / THUNDER_ROWS;
                    const col = thunder.frame % THUNDER_COLS;
                    const row = Math.floor(thunder.frame / THUNDER_COLS);
                    const spriteW = 120 * scale;
                    const spriteH = 120 * scale;
                    const [frameCenterX, frameCenterY] = THUNDER_FRAME_CENTERS[
                        thunder.frame
                    ] || [THUNDER_REF_CENTER_X, THUNDER_REF_CENTER_Y];
                    const anchorX = (frameCenterX / 229) * spriteW;
                    const anchorY = (frameCenterY / 245) * spriteH;

                    ctx.save();
                    ctx.translate(thunder.x, thunder.y);
                    ctx.rotate(thunder.rotation || 0);
                    ctx.globalAlpha = alpha;
                    ctx.globalCompositeOperation = "lighter";
                    ctx.drawImage(
                        thunderImg,
                        col * fw,
                        row * fh,
                        fw,
                        fh,
                        -anchorX,
                        -anchorY,
                        spriteW,
                        spriteH,
                    );
                    ctx.restore();
                }

                // ── Dragon Impact Burst FX ─────────────────────────────────────
                for (const fx of dragonImpactFX) {
                    const t = fx.age / fx.ttl;
                    const shockA = 1 - t;

                    ctx.save();
                    ctx.translate(fx.x, fx.y);

                    // expanding shockwave rings
                    const r1 = DRAGON_AOE_RADIUS_X * (0.25 + t * 0.95);
                    const r2 = DRAGON_AOE_RADIUS_Y * (0.25 + t * 0.95);
                    ctx.strokeStyle = `rgba(255,100,100,${0.55 * shockA})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r1, r2, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    const r3 = DRAGON_AOE_RADIUS_X * (0.1 + t * 0.6);
                    const r4 = DRAGON_AOE_RADIUS_Y * (0.1 + t * 0.6);
                    ctx.strokeStyle = `rgba(255,200,200,${0.35 * shockA})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r3, r4, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // center flash
                    const flare = ctx.createRadialGradient(
                        0,
                        0,
                        0,
                        0,
                        0,
                        DRAGON_AOE_RADIUS_X * 0.55,
                    );
                    flare.addColorStop(0, `rgba(255,255,255,${0.55 * shockA})`);
                    flare.addColorStop(
                        0.3,
                        `rgba(255,140,140,${0.35 * shockA})`,
                    );
                    flare.addColorStop(1, "rgba(255,40,40,0)");
                    ctx.fillStyle = flare;
                    ctx.beginPath();
                    ctx.arc(0, 0, DRAGON_AOE_RADIUS_X * 0.55, 0, Math.PI * 2);
                    ctx.fill();

                    // electric spark streaks
                    ctx.lineCap = "round";
                    for (const sp of fx.sparks) {
                        const sx = sp.x - fx.x;
                        const sy = sp.y - fx.y;
                        const angle = sp.rotation || Math.atan2(sp.vy, sp.vx);
                        ctx.save();
                        ctx.translate(sx, sy);
                        ctx.rotate(angle);
                        ctx.globalAlpha = shockA * 0.85;
                        ctx.strokeStyle = sp.color;
                        ctx.lineWidth = sp.width;
                        ctx.beginPath();
                        ctx.moveTo(-sp.len * 0.5, 0);
                        ctx.lineTo(sp.len * 0.5, 0);
                        ctx.stroke();
                        // bright core
                        ctx.strokeStyle = "#fff";
                        ctx.lineWidth = sp.width * 0.35;
                        ctx.globalAlpha = shockA * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(-sp.len * 0.25, 0);
                        ctx.lineTo(sp.len * 0.25, 0);
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.restore();
                }

                // ── Dragon Base Orb FX ───────────────────────────────────────
                for (const fx of dragonBaseAttackFX) {
                    const t = fx.age / fx.ttl;
                    const alpha = 1 - t;

                    ctx.save();
                    ctx.translate(fx.x, fx.y);

                    ctx.globalCompositeOperation = "lighter";
                    const pulseRadius = DRAGON_ORB_IDLE_RADIUS + t * 26;
                    const orbPulse = ctx.createRadialGradient(
                        0,
                        0,
                        0,
                        0,
                        0,
                        pulseRadius,
                    );
                    orbPulse.addColorStop(0, `rgba(255,255,255,${0.95 * alpha})`);
                    orbPulse.addColorStop(
                        0.28,
                        `rgba(255,120,120,${0.72 * alpha})`,
                    );
                    orbPulse.addColorStop(
                        0.65,
                        `rgba(255,20,20,${0.42 * alpha})`,
                    );
                    orbPulse.addColorStop(1, "rgba(255,0,0,0)");
                    ctx.fillStyle = orbPulse;
                    ctx.beginPath();
                    ctx.arc(0, 0, pulseRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = `rgba(255,120,120,${0.7 * alpha})`;
                    ctx.lineWidth = 2.4 - t * 1.1;
                    ctx.beginPath();
                    ctx.arc(0, 0, 10 + t * 20, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.strokeStyle = `rgba(255,220,220,${0.45 * alpha})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 5 + t * 12, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.lineCap = "round";
                    for (const sp of fx.sparks) {
                        const sx = sp.x - fx.x;
                        const sy = sp.y - fx.y;
                        ctx.save();
                        ctx.translate(sx, sy);
                        ctx.rotate(sp.rotation || Math.atan2(sp.vy, sp.vx));
                        ctx.globalAlpha = alpha * 0.9;
                        ctx.strokeStyle = sp.color;
                        ctx.lineWidth = sp.width;
                        ctx.beginPath();
                        ctx.moveTo(-sp.len * 0.5, 0);
                        ctx.lineTo(sp.len * 0.5, 0);
                        ctx.stroke();

                        ctx.globalAlpha = alpha * 0.55;
                        ctx.strokeStyle = "#fff1f1";
                        ctx.lineWidth = sp.width * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(-sp.len * 0.22, 0);
                        ctx.lineTo(sp.len * 0.22, 0);
                        ctx.stroke();
                        ctx.restore();
                    }

                     ctx.restore();
                }

                 ctx.restore();

                drawUi();
            }

            // ── Thunder FX (Dragon Strike) ──────────────────────────────────────

            let lastLoopTs = 0;

            function loop(ts) {
                const dt = Math.min(ts - lastLoopTs, 50);

                lastLoopTs = ts;

                // Advance cannon barrel spin — fast when shooting, slow when idle

                const isFiring =
                    isHolding ||
                    dragonMode ||
                    (autoMode && autoTierIndex !== -1 && autoTarget !== null);

                const cannonMs = isFiring ? CANNON_MS_FIRING : CANNON_MS_IDLE;

                cannonFrameTimer += dt;

                // Advance lightning ball frame (only when auto-mode is on)

                if (autoMode && lightningFrames.length > 0) {
                    lightningTimer += dt;

                    while (lightningTimer >= LIGHTNING_MS) {
                        lightningTimer -= LIGHTNING_MS;

                        lightningFrame =
                            (lightningFrame + 1) % lightningFrames.length;
                    }
                }

                while (cannonFrameTimer >= cannonMs) {
                    cannonFrameTimer -= cannonMs;

                    cannonFrame = (cannonFrame + 1) % CANNON_FRAMES;
                }

                // Advance dragon base frame animation when dragon mode is active

                if (dragonMode) {
                    const dragonBaseMs = DRAGON_BASE_MS_IDLE; // Always use idle timing for base animation
                    dragonBaseFrameTimer += dt;

                    while (dragonBaseFrameTimer >= dragonBaseMs) {
                        dragonBaseFrameTimer -= dragonBaseMs;

                        dragonBaseFrame =
                            (dragonBaseFrame + 1) % DRAGON_BASE_FRAMES;
                    }
                }

                // Advance thunder frame animation for active thunder attacks
                for (let i = thunderAttacks.length - 1; i >= 0; i--) {
                    const thunder = thunderAttacks[i];
                    thunder.frameTimer += dt;

                    while (thunder.frameTimer >= THUNDER_MS) {
                        thunder.frameTimer -= THUNDER_MS;
                        if (thunder.frame < THUNDER_FRAMES - 1) {
                            thunder.frame++;
                        }
                    }
                }

                if (gamePhase === 'intro') {
                    startBgMusic();
                    const introElapsed = ts - introStartTime;
                    document.getElementById('hudOverlay').style.display = 'none';
                    document.getElementById('ui').style.display = 'none';
                    document.getElementById('missileBtn').style.display = 'none';
                    document.getElementById('dragonBtn').style.display = 'none';
                    if (introElapsed >= INTRO_DURATION) {
                        gamePhase = 'playing';
                        scheduleReset();
                        document.getElementById('hudOverlay').style.display = '';
                        document.getElementById('ui').style.display = '';
                        document.getElementById('missileBtn').style.display = '';
                        document.getElementById('dragonBtn').style.display = '';
                    }
                } else if (gamePhase === 'playing' && isLandscape && !document.hidden) {
                    update(ts);
                }

                if (isLandscape && gamePhase !== 'lobby') {
                    draw();
                }

                requestAnimationFrame(loop);
            }

// ── Landscape Orientation & Resizing System ──────────────────────────────────────────
// Detects device orientation, scales the game to fit, and handles Telegram WebApp integration.

const orientationOverlay = document.getElementById('orientationOverlay');
const gameWrap = document.getElementById('gameWrap');
let isLandscape = true;

function resizeGame() {
    const w = screen.width;
    const h = screen.height;

    // Update canvas pixel buffers to match screen dimensions
    bgCanvas.width = w;
    bgCanvas.height = h;
    gameCanvas.width = w;
    gameCanvas.height = h;
    uiCanvas.width = w;
    uiCanvas.height = h;

    // Calculate scale to fit 800x500 virtual space into screen with aspect ratio
    const s = Math.min(w / 800, h / 500);
    gameScale = s;
    gameOffsetX = Math.round((w - 800 * s) / 2);
    gameOffsetY = Math.round((h - 500 * s) / 2);

    bgDrawn = false;
    player.x = W / 2;
    player.y = H - 40;
    mouseX = W / 2;
    mouseY = H / 2;
    if (typeof layoutBaseHud === 'function') {
        layoutBaseHud();
    }
}

function checkOrientation() {
    isLandscape = window.innerWidth >= window.innerHeight;
    
    if (orientationOverlay) {
        orientationOverlay.classList.toggle('active', !isLandscape);
    }
    
    if (isLandscape) {
        resizeGame();
    }
}

function lockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {
            // Fallback: overlay handles the rotation hint via orientationOverlay
        });
    }
}

// Telegram WebApp Initialization (with retry, handles async injection)
(function initTg() {
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            const twa = window.Telegram.WebApp;
            twa.ready();
            twa.expand();
            if (twa.requestFullscreen) {
                twa.requestFullscreen();
            }
            // Hide Telegram header chrome so close button blends into game
            if (twa.setHeaderColor) twa.setHeaderColor('#000000');
            if (twa.setBackgroundColor) twa.setBackgroundColor('#000000');
            // Ask for confirmation when user taps native X close button
            twa.isClosingConfirmationEnabled = true;
            if (twa.disableVerticalSwipes) {
                twa.disableVerticalSwipes();
            }
            // Use Telegram's BackButton as the exit button
            if (twa.BackButton) {
                twa.BackButton.show();
                twa.BackButton.onClick(function() {
                    showExitConfirmation();
                });
            }
            twa.onEvent('viewportChanged', () => {
                checkOrientation();
                resizeGame();
            });
            return;
        }
    } catch (_) { /* WebApp methods may throw in restrictive environments */ }
    setTimeout(initTg, 50);
})();

// ── Server Balance Sync (auth + periodic sync) ────────────────────
// Authenticates via Telegram WebApp, fetches server balance,
// and syncs bet/win deltas periodically and on game exit.

const API_BASE = window.location.origin;

function initBalanceFromServer() {
    // Try stored token first (from dashboard or previous session)
    const storedToken = localStorage.getItem('token');
    if (storedToken) {
        authToken = storedToken;
        fetchBalance();
        // Flush any unsynced deltas from a previous session
        flushUnsyncedDeltas();
    }

    // Fall back to Telegram WebApp auth
    try {
        const tg = window.Telegram?.WebApp;
        if (tg && tg.initDataUnsafe?.user) {
            const user = tg.initDataUnsafe.user;
            fetch(API_BASE + '/api/auth/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: user.id,
                    username: user.username,
                    first_name: user.first_name,
                    last_name: user.last_name,
                    photo_url: user.photo_url,
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.token) {
                    authToken = data.token;
                    localStorage.setItem('token', data.token);
                    if (data.user && data.user.sk_balance !== undefined) {
                        serverBalance = data.user.sk_balance;
                        balance = data.user.sk_balance;
                    }
                    // Flush any unsynced deltas from a previous session
                    flushUnsyncedDeltas();
                }
            })
            .catch(() => { /* offline mode — local balance only */ });
        }
    } catch (e) { /* Telegram not available — local balance only */ }
}

async function fetchBalance() {
    if (!authToken) return;
    try {
        const res = await fetch(API_BASE + '/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        });
        if (res.ok) {
            const data = await res.json();
            if (data.sk_balance !== undefined) {
                serverBalance = data.sk_balance;
                balance = data.sk_balance;
            }
        }
    } catch (e) { /* offline */ }
}

// Syncs the net balance delta to the server.
// Called on game exit / restart — not during gameplay.
async function syncBalanceNow() {
    if (!authToken) return;

    const pendingBets = sessionTotalBets - lastSyncedBets;
    const pendingWins = sessionTotalWins - lastSyncedWins;
    const net = pendingWins - pendingBets;

    if (net === 0) return;

    try {
        if (net > 0) {
            const res = await fetch(API_BASE + '/api/game/win', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + authToken
                },
                body: JSON.stringify({ amount: net })
            });
            if (res.ok) {
                lastSyncedBets = sessionTotalBets;
                lastSyncedWins = sessionTotalWins;
            } else {
                console.warn('Win sync failed:', await res.text());
            }
        } else {
            const res = await fetch(API_BASE + '/api/game/bet', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + authToken
                },
                body: JSON.stringify({ amount: -net })
            });
            if (res.ok) {
                lastSyncedBets = sessionTotalBets;
                lastSyncedWins = sessionTotalWins;
            } else {
                console.warn('Bet sync failed:', await res.text());
            }
        }
    } catch (e) {
        console.warn('Sync failed (offline?):', e.message);
    }
}

// ── Exit confirmation ──────────────────────────────────────────
function showExitConfirmation() {
    const overlay = document.getElementById('exitOverlay');
    if (overlay) overlay.classList.add('active');
}

function hideExitConfirmation() {
    const overlay = document.getElementById('exitOverlay');
    if (overlay) overlay.classList.remove('active');
}

// ── localStorage backup for unsynced deltas ────────────────────
function savePendingDeltas() {
    if (!authToken) return;
    const pendingBets = sessionTotalBets - lastSyncedBets;
    const pendingWins = sessionTotalWins - lastSyncedWins;
    const net = pendingWins - pendingBets;
    if (net !== 0) {
        try { localStorage.setItem('pendingSyncNet', net.toString()); } catch (e) {}
    } else {
        try { localStorage.removeItem('pendingSyncNet'); } catch (e) {}
    }
}

function flushUnsyncedDeltas() {
    if (!authToken) return;
    const netStr = localStorage.getItem('pendingSyncNet');
    if (!netStr) return;
    const net = parseInt(netStr, 10);
    if (net === 0 || isNaN(net)) { localStorage.removeItem('pendingSyncNet'); return; }

    const endpoint = net > 0 ? '/api/game/win' : '/api/game/bet';
    const amount = net > 0 ? net : -net;
    fetch(API_BASE + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
        body: JSON.stringify({ amount })
    })
    .then(r => {
        if (r.ok) localStorage.removeItem('pendingSyncNet');
    })
    .catch(() => {});
}

// ── Exit confirmation YES/NO handlers ──
(function initExitBtns() {
    const yesBtn = document.getElementById('exitConfirmYes');
    const noBtn = document.getElementById('exitConfirmNo');
    if (!yesBtn || !noBtn) return;

    noBtn.addEventListener('click', hideExitConfirmation);

    yesBtn.addEventListener('click', function() {
        hideExitConfirmation();
        savePendingDeltas();
        syncBalanceNow().finally(() => {
            // Close the Telegram Mini App after syncing
            try {
                const twa = window.Telegram?.WebApp;
                if (twa && twa.close) twa.close();
            } catch (e) {}
            // Fallback: navigate to dashboard
            const tokenVal = authToken || localStorage.getItem('token') || '';
            window.location.href = 'dashboard.html?token=' + encodeURIComponent(tokenVal);
        });
    });
})();

// ── Sync on page unload (refresh/close) ──
window.addEventListener('beforeunload', () => {
    if (syncInterval) clearInterval(syncInterval);
    if (!authToken) return;

    const pendingBets = sessionTotalBets - lastSyncedBets;
    const pendingWins = sessionTotalWins - lastSyncedWins;
    const net = pendingWins - pendingBets;
    if (net === 0) {
        try { localStorage.removeItem('pendingSyncNet'); } catch (e) {}
        return;
    }

    // Save to localStorage as backup in case sendBeacon / beforeunload fails
    try { localStorage.setItem('pendingSyncNet', net.toString()); } catch (e) {}

    const endpoint = net > 0 ? '/api/game/win' : '/api/game/bet';
    const amount = net > 0 ? net : -net;
    try {
        navigator.sendBeacon(
            API_BASE + endpoint + '?token=' + encodeURIComponent(authToken),
            new Blob([JSON.stringify({ amount })], { type: 'application/json' })
        );
    } catch (e) {}
});

// ── Also save deltas when page becomes hidden (mobile app switch / screen off) ──
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        savePendingDeltas();
    }
});

checkOrientation();
resizeGame();
// Attempt to lock orientation (gracefully fails if not permitted)
lockLandscape();

// Listen for device orientation changes
window.addEventListener('orientationchange', () => {
    setTimeout(checkOrientation, 200);
    setTimeout(resizeGame, 200);
    setTimeout(lockLandscape, 400);
});

// Listen for resize (covers desktop and mobile viewport changes)
window.addEventListener('resize', () => {
    checkOrientation();
    resizeGame();
});
