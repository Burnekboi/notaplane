                    thunder.ttl -= 16.67;
                    if (thunder.ttl <= 0) thunderAttacks.splice(i, 1);
                }

                // Dragon Impact FX tick
                for (let i = dragonImpactFX.length - 1; i >= 0; i--) {
                    const fx = dragonImpactFX[i];
                    fx.age += 16.67;
                    for (const sp of fx.sparks) {
                        sp.x += sp.vx;
                        sp.y += sp.vy;
                        sp.vx *= 0.88;
                        sp.vy *= 0.88;
                    }
                    if (fx.age >= fx.ttl) dragonImpactFX.splice(i, 1);
                }

                // Dragon base orb attack FX tick
                for (let i = dragonBaseAttackFX.length - 1; i >= 0; i--) {
                    const fx = dragonBaseAttackFX[i];
                    fx.age += 16.67;
                    for (const sp of fx.sparks) {
                        sp.x += sp.vx;
                        sp.y += sp.vy;
                        sp.vx *= 0.9;
                        sp.vy *= 0.9;
                    }
                    if (fx.age >= fx.ttl) dragonBaseAttackFX.splice(i, 1);
                }

                // Enemies

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    if (!e) continue; // Guard: chain-variant logic may have spliced extra enemies, shrinking the array

                    e.age += 0.04;

                    // Update hit effect timer

                    if (e.hitEffect > 0) {
                        e.hitEffect -= 0.05; // Fade out over time
                        if (e.hitEffect < 0) e.hitEffect = 0;
                    }
                    if (e.dragonHitFlash > 0) {
                        e.dragonHitFlash -= 0.022; // slower fade ~45 frames ≈ 750ms
                        if (e.dragonHitFlash < 0) e.dragonHitFlash = 0;
                    }

                    if (e.state === "dying") {
                        if (e.tierIndex === 15) {
                            const dur = ts - e.t6cDeathTime;
                            if (dur > 1000) {
                                playDragonFireSound();
                                spawnExplosionAnimation(e.x, e.y, e.tierIndex, e.size);
                                enemies.splice(i, 1);
                            }
                            continue;
                        }

                        if (e.tierIndex === 11 && !e._t6bTitleShown) {
                            e._t6bTitleShown = true;
                            showTitle('T6B');
                        }

                        const hasBonus = e.dyingFinalMult > 1;

                        const dur = ts - e.dyingTimer;

                        if (hasBonus) {
                            if (dur > 6000) {
                                killEnemy(e, i);
                            }
                        } else {
                            if (dur > 4200) {
                                killEnemy(e, i);
                            }
                        }

                        continue;
                    }

                    if (e.tierIndex === 11) {
                        // T6B Orbit movement

                        if (e.state === "enter") {
                            e.x += e.vx;
                            e.y += e.vy;

                            if (Math.hypot(e.x - W / 2, e.y - H / 2) < 20) {
                                e.state = "orbit";

                                e.orbitTimer = ts;
                            }
                        } else if (e.state === "orbit") {
                            e.orbitAngle += 0.01;

                            const radius = 50;

                            const tx = W / 2 + Math.cos(e.orbitAngle) * radius;

                            const ty = H / 2 + Math.sin(e.orbitAngle) * radius;

                            e.x += (tx - e.x) * 0.1;

                            e.y += (ty - e.y) * 0.1;

                            if (ts - e.orbitTimer > 10000) {
                                e.state = "exit";

                                e.vx =
                                    e.x < W / 2
                                        ? -ENEMY_TIERS[11].speed * 3
                                        : ENEMY_TIERS[11].speed * 3;

                                e.vy = 0;
                            }
                        } else if (e.state === "exit") {
                            e.x += e.vx;
                            e.y += e.vy;
                        }
                    } else if (e.tierIndex === 15) {
                        // T6C frame-based movement
                        const t6cElapsed = ts - (e.t6cPhaseStart || ts);
                        const slowFrames = 14;
                        const frameDuration = 200;

                        if (e.t6cMode === "slow") {
                            e.t6cFrameIdx = 1 + Math.floor(t6cElapsed / frameDuration) % slowFrames;
                            e.x += e.vx;
                            e.y += e.vy;

                            if (t6cElapsed > e.t6cModeDuration) {
                                e.t6cMode = "fast";
                                e.t6cPhaseStart = ts;
                                e.t6cFastFrame = Math.random() < 0.5 ? 0 : 15;
                                e.t6cFrameIdx = e.t6cFastFrame;
                                e.vx *= 2;
                                e.vy *= 2;
                            }
                        } else if (e.t6cMode === "fast") {
                            e.t6cFrameIdx = e.t6cFastFrame;
                            e.x += e.vx;
                            e.y += e.vy;

                            if (t6cElapsed > 3000) {
                                e.t6cMode = "slow";
                                e.t6cPhaseStart = ts;
                                e.vx *= 0.5;
                                e.vy *= 0.5;
                                e.t6cModeDuration = 5000 + Math.random() * 3000;
                            }
                        }
                    } else if (!e.isD2 && (!e.isD3 || e.state === "normal")) {
                        // Normal enemies (exclude D2, include D3/D4 in normal states)

                        if (e.isD4 && e.state !== "normal") {
                            // handled by updateD4
                        } else {
                            e.x += e.vx;
                            e.y += e.vy;
                        }
                    }

                    if (
                        (e.tierIndex === 1 || e.tierIndex === 10) &&
                        e.state !== "dying"
                    ) {
                        const nowTs = ts;
                        if (nowTs >= e.t1bNextModeTs) {
                            e.t1bMotionMode =
                                rng.next() < 0.46 ? "straight" : "diagonal";
                            e.t1bNextModeTs =
                                nowTs + (600 + rng.next() * 1400);
                            if (e.t1bMotionMode === "diagonal") {
                                const dir = rng.next() < 0.5 ? -1 : 1;
                                const baseSpeed = Math.hypot(e.vx || 0, e.vy || 0);
                                e.t1bDiagSpeed = dir * baseSpeed * (0.6 + rng.next() * 0.8);
                            }
                        }
                        e.t1bLastTs = nowTs;
                        e.t1bLastPerpVel = 0;
                        if (e.t1bMotionMode === "diagonal") {
                            const perpVel = e.t1bDiagSpeed;
                            e.t1bLastPerpVel = perpVel;
                            if (Math.abs(e.vx) > Math.abs(e.vy))
                                e.y += perpVel;
                            else e.x += perpVel;
                        }
                    }

                    if (e.wave) {
                        if (Math.abs(e.vx) > Math.abs(e.vy))
                            e.y += Math.sin(e.age * 3) * 1.2;
                        else e.x += Math.sin(e.age * 3) * 1.2;
                    }

                    // T1A / T1B engine smoke + facing direction (tiers 0,1 + elites 9,10)
                    if (
                        (e.tierIndex === 0 ||
                            e.tierIndex === 1 ||
                            e.tierIndex === 9 ||
                            e.tierIndex === 10) &&
                        e.state !== "dying"
                    ) {
                        const spd = Math.hypot(e.vx || 0, e.vy || 0);
                        if (e.tierIndex === 1 || e.tierIndex === 10) {
                            let tx = e.vx,
                                ty = e.vy;
                            const pv = e.t1bLastPerpVel || 0;
                            if (Math.abs(e.vx) > Math.abs(e.vy)) ty += pv;
                            else tx += pv;
                            if (Math.hypot(tx, ty) > 0.01)
                                e.facingAngle = Math.atan2(ty, tx);
                        } else if (spd > 0.01)
                            e.facingAngle = Math.atan2(e.vy, e.vx);
                        if (rng.next() < 0.35) {
                            const ang = e.facingAngle ?? 0;
                            const r = e.size / 2;
                            const back = r * 0.92;
                            const side = r * 0.22;
                            // Spawn smoke slightly BEHIND the pipes (further back than the tail point)
                            const behind = r * 0.28;
                            const tailX = e.x - Math.cos(ang) * (back + behind);
                            const tailY = e.y - Math.sin(ang) * (back + behind);
                            const px = Math.cos(ang + Math.PI / 2);
                            const py = Math.sin(ang + Math.PI / 2);

                            for (const sgn of [-1, 1]) {
                                const sfx = poolNext(smokeFX);
                                sfx.active = true;
                                sfx.x = tailX + px * side * sgn + (rng.next() - 0.5) * 4;
                                sfx.y = tailY + py * side * sgn + (rng.next() - 0.5) * 4;
                                sfx.alpha = 0.55;
                                sfx.scale = 0.2 + rng.next() * 0.09;
                                sfx.fadeSpeed = 0.045;
                                sfx.angle = rng.next() * Math.PI * 2;
                                sfx.vAngle = (rng.next() - 0.5) * 0.06;
                            }
                        }
                    }

                    // Off-screen cleanup

                    if (
                        !e.isD2 && !(e.tierIndex === 6 && e.t6Triggered) &&
                        (e.x < -120 ||
                            e.x > W + 120 ||
                            e.y < -120 ||
                            e.y > H + 120)
                    ) {
                        if (e.isD3) {
                            d3Active = false;
                            playerAttackLocked = false; // Release attack lock if D3 leaves screen
                        }
                        if (e.isD4) d4Active = false;

                        enemies.splice(i, 1);

                        continue;
                    }

                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        if (!b.active) continue;

                        if ((e.isD4 && e.state !== "normal") || e.d4Linked) {
                            continue;
                        }

                        if (e.state === "chaining" || e.state === "detonating") {
                            continue;
                        }

                        if (
                            Math.hypot(b.x - e.x, b.y - e.y) <
                            e.size / 2 + b.r
                        ) {
                            // Trigger red flash hit effect on touch (even if blocked or misses)

                            e.hitEffect = 1.0;

                            // T6B is invulnerable while in dying sequence
                            // D3 is invulnerable while in special states (spinning, bouncing, exploding)

                            if (e.state === "dying") {
                                b.active = false;
                                break;
                            }
                            if (e.isD3 && e.state !== "normal") {
                                b.active = false;
                                break;
                            }
                            if (e.isD4 && e.state !== "normal") {
                                continue;
                            }
                            if (e.d4Linked) {
                                continue;
                            }

                            spawnBulletHit(b.x, b.y);

                            b.active = false;


                            processBossHit(e, ts);

                            const roll = rtp.rollHit(e.tierIndex, !!e.isBoss);

                            // Manual bullet: 0.5% base instant-kill, 2.5% base crit, 2.5 base damage
                            // RTP < 30% mercy: +25% instant kill, +25% crit
                            const _bltRtpBelow30 =
                                rtp.totalSpent > 0 && rtp.currentRTP() < 0.3;
                            const _bltRtpBonus = _bltRtpBelow30 ? 0.25 : 0;

                            const bulletInstant =
                                rng.next() <
                                0.005 +
                                    _bltRtpBonus +
                                    (critState.isActive() ? 0.01 : 0);

                            const bulletCrit =
                                !bulletInstant &&
                                rng.next() <
                                    0.025 +
                                        _bltRtpBonus +
                                        (critState.isActive() ? 0.15 : 0);

                            if (roll.hit || roll.instant || bulletInstant) {
                                // Block check - instant kills bypass block

                                if (!bulletInstant && rollBlock(e))
                                    break;

                                let dmg = bulletInstant
                                    ? e.hp
                                    : bulletCrit
                                      ? 3
                                      : 2.5;

                                if (!bulletInstant && e.isBoss) {
                                    const special = rollBossSpecial(ts, e);

                                    if (special > 0) dmg = special;
                                }

                                // Crit window bonus — adds crit roll on top, not a multiplier
                                if (!bulletInstant) {
                                    const critRoll = critState.roll();
                                    if (critRoll > 1) dmg = dmg + critRoll;
                                }

                                e._payoutBet = b.bet;
                                e.hp -= dmg;

                                if (e.hp <= 0) {
                                    if (
                                        e.tierIndex === 11 &&
                                        e.state !== "dying"
                                    ) {
                                        // T6B: cinematic dying sequence

                                        e.hp = 0;

                                        e.state = "dying";

                                        e.dyingTimer = ts;

                                        e.vx = 0;
                                        e.vy = 0;

                                        bossState.bossHp = 0;

                                        if (rng.next() < 0.3) {
                                            const r = rng.next();

                                            let multi = 2;

                                            if (r >= 0.60 && r < 0.80)
                                                multi = 3;
                                            else if (r >= 0.80 && r < 0.90)
                                                multi = 4;
                                            else if (r >= 0.90 && r < 0.98)
                                                multi = 5;
                                            else if (r >= 0.98) multi = 6;

                                            e.dyingFinalMult = multi;
                                        } else {
                                            e.dyingFinalMult = 1;
                                        }
                                    } else if (e.state !== "dying") {
                                        // T6 and all others: instant death

                                        if (e.isD3) {
                                            triggerD3Death(e);
                                        } else {
                                            killEnemy(e, i);
                                        }
                                    }
                                } else if (e.isBoss) {
                                    bossState.bossHp = e.hp;
                                }
                                                                    } else {
                                // RTP miss — refund the bet
                                if (e.isBoss) {
                                    bossState.hitStartTime = null;
                                }
                            }

                            break;
                    }
                }
                }

                // HUD

                document.getElementById("balanceDisplay").textContent =
                    balance >= 1000000
                        ? (balance / 1000000).toFixed(balance % 1000000 === 0 ? 0 : 1) + 'M'
                        : balance >= 100000
                          ? Math.floor(balance / 1000) + 'k'
                          : balance.toString();

                if (rtp.totalSpent > 0) {
                    const rtpPct = (
                        (rtp.totalPaid / rtp.totalSpent) *
                        100
                    ).toFixed(1);

                    document.getElementById("rtpDisplay").textContent =
                        `Shots: ${rtp.totalSpent}  Won: ${rtp.totalPaid.toFixed(0)}  RTP: ${rtpPct}%`;
                }
            }

            // ── Draw ──────────────────────────────────────────────────────────────────

            function drawBg() {
                // Apply game-space transform (used every frame)
                bgCtx.setTransform(gameScale, 0, 0, gameScale, gameOffsetX, gameOffsetY);

                if (!bgDrawn && cosmosImg.complete && cosmosImg.naturalWidth > 0) {
                    // Clear full canvas with black (for letterbox areas), then draw cosmos
                    bgCtx.setTransform(1, 0, 0, 1, 0, 0);
                    bgCtx.fillStyle = '#000';
                    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
                    bgCtx.setTransform(gameScale, 0, 0, gameScale, gameOffsetX, gameOffsetY);
                    bgCtx.drawImage(cosmosImg, 0, 0, W, H);
                    bgDrawn = true;
                }
            }

            function drawUi() {
                if (popups.length === 0 && baseRewardPopups.length === 0 && refundPopups.length === 0) return;
                // Reset transform and clear full canvas
                uiCtx.setTransform(1, 0, 0, 1, 0, 0);
                uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
                // Apply game-space transform
                uiCtx.setTransform(gameScale, 0, 0, gameScale, gameOffsetX, gameOffsetY);
                { const ctx = uiCtx;
                    // ── Reward popups ──────────────────────────────────────────────
                    const popupNow = performance.now();
                    for (let i = popups.length - 1; i >= 0; i--) {
                        const p = popups[i];
                        const elapsed = popupNow - p.startTime;
                        if (elapsed >= p.duration) {
                            popups.splice(i, 1);
                            continue;
                        }
                        const pScale = Math.min(1, elapsed / 300) * (elapsed < 300 ? 1.3 - 0.3 * elapsed / 300 : 1);
                        const pAlpha = elapsed < p.duration - 500 ? 1 : Math.max(0, 1 - (elapsed - (p.duration - 500)) / 500);

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.scale(pScale, pScale);
                        ctx.globalAlpha = pAlpha * 0.85;

                        ctx.textAlign = "center";
                        ctx.shadowColor = "#000";
                        ctx.shadowBlur = 20;

                        const rewardVal = parseFloat(p.text.replace(/,/g, ''));
                        let rewardFontSize = 21;
                        if (rewardVal >= 500) rewardFontSize = 63;
                        else if (rewardVal >= 100) rewardFontSize = 42;
                        ctx.font = `bold ${rewardFontSize}px Arial`;
                        ctx.fillStyle = "#ffdd44";
                        ctx.fillText(p.text, 0, 0);

                        if (p.subText) {
                            ctx.font = "bold 18px Arial";
                            ctx.fillStyle = "#ffffff";
                            ctx.fillText(p.subText, 0, 30);
                        }

                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }

                    // ── Base reward popups (above left textbox) ──────────────────────
                    const bpNow = performance.now();
                    const baseSz = 120;
                    const txW = 74;
                    const txH = 50;
                    const txY = player.y + baseSz / 2 - txH - 12;
                    const ltxX = player.x - baseSz / 2 - txW + 24;
                    const bpX = ltxX + txW / 2;
                    const bpY = txY - 10;

                    for (let i = baseRewardPopups.length - 1; i >= 0; i--) {
                        const bp = baseRewardPopups[i];

                    // ── Refund popups (same position as reward popups) ──
                    const rfNow = performance.now();
                    for (let ri = refundPopups.length - 1; ri >= 0; ri--) {
                        const rp = refundPopups[ri];
                        const rpElapsed = rfNow - rp.startTime;
                        if (rpElapsed >= rp.duration) {
                            refundPopups.splice(ri, 1);
                            continue;
                        }
                        const rpAlpha = rpElapsed < rp.duration - 400 ? 1 : Math.max(0, 1 - (rpElapsed - (rp.duration - 400)) / 400);
                        const rpRise = Math.min(rpElapsed * 0.03, 20);
                        ctx.save();
                        ctx.globalAlpha = rpAlpha * 0.9;
                        ctx.textAlign = "center";
                        ctx.font = "16px Arial";
                        ctx.fillStyle = "#66ffaa";
                        ctx.shadowColor = "#000";
                        ctx.shadowBlur = 8;
                        ctx.fillText(rp.text, bpX, bpY - 32 - rpRise);
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                        const elapsed = bpNow - bp.startTime;
                        if (elapsed >= bp.duration) {
                            baseRewardPopups.splice(i, 1);
                            continue;
                        }
                        const bpAlpha = elapsed < bp.duration - 400 ? 1 : Math.max(0, 1 - (elapsed - (bp.duration - 400)) / 400);
                        const bpRise = Math.min(elapsed * 0.03, 20);

                        ctx.save();
                        ctx.globalAlpha = bpAlpha * 0.9;
                        ctx.textAlign = "center";
                        ctx.font = "18px Arial";
                        ctx.fillStyle = "#ffdd44";
                        ctx.shadowColor = "#000";
                        ctx.shadowBlur = 8;
                        ctx.fillText(bp.text, bpX, bpY - bpRise);
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                }
            }

            function drawIntro() {
                const introNow = performance.now();
                const introElapsed = introNow - introStartTime;
                const fadeAlpha = Math.min(1, introElapsed / INTRO_FADE_DURATION);

                // Reset transform and clear full canvas
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Apply game-space transform
                ctx.setTransform(gameScale, 0, 0, gameScale, gameOffsetX, gameOffsetY);

                const cx = W / 2;
                const cy = H / 2;

                // Update and draw stars
                for (let i = 0; i < stars.length; i++) {
                    const s = stars[i];
                    s.z -= s.speed;

                    if (s.z <= 0) {
                        s.x = (Math.random() - 0.5) * 2;
                        s.y = (Math.random() - 0.5) * 2;
                        s.z = 1;
                        s.speed = 0.003 + Math.random() * 0.007;
                        s.size = 0.5 + Math.random() * 1.5;
                    }

                    const px = cx + (s.x * 300) / s.z;
                    const py = cy + (s.y * 300) / s.z;
                    const drawSize = s.size * (1 - s.z * 0.6);

                    if (px < 0 || px > W || py < 0 || py > H) continue;

                    const brightness = 0.3 + (1 - s.z) * 0.7;

                    ctx.save();
                    ctx.globalAlpha = brightness * fadeAlpha;
                    ctx.fillStyle = "#c8d8ff";
                    ctx.shadowColor = "#6699ff";
                    ctx.shadowBlur = drawSize * 2;
                    ctx.beginPath();
                    ctx.arc(px, py, drawSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (introTitleImg.complete && introTitleImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.globalAlpha = fadeAlpha;
                    const titleScale = Math.min(W / introTitleImg.naturalWidth, H / introTitleImg.naturalHeight) * 0.7;
                    const titleW = introTitleImg.naturalWidth * titleScale;
                    const titleH = introTitleImg.naturalHeight * titleScale;
                    ctx.drawImage(introTitleImg, (W - titleW) / 2, (H - titleH) / 2, titleW, titleH);
                    ctx.restore();
                }
            }

            function draw() {
                if (gamePhase === 'intro') {
                    drawIntro();
                    return;
                }
                if (gamePhase === 'lobby') {
                    drawBg();
                    return;
                }

                layoutBaseHud();
                drawBg();
                // Clear game canvas to transparent so bgCanvas (cosmos) shows through
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Apply game-space transform
                ctx.setTransform(gameScale, 0, 0, gameScale, gameOffsetX, gameOffsetY);

                ctx.save();
                const shakeNow = performance.now();
                if (shakeNow < screenShake.endAt && screenShake.amplitude > 0) {
                    const duration = Math.max(1, screenShake.endAt - screenShake.startAt);
                    const t = (shakeNow - screenShake.startAt) / duration;
                    const decay = Math.max(0, 1 - t);
                    const amp = screenShake.amplitude * decay;
                    ctx.translate(
                        (rng.next() - 0.5) * amp * 2,
                        (rng.next() - 0.5) * amp * 2,
                    );
                } else {
                    screenShake.amplitude = 0;
                }

                // Crit cycle indicator — shot progress arc around player

                if (critState.phase !== "idle") {
                    const ts = performance.now();

                    const isActive = critState.isActive();

                    const cx = player.x,
                        cy = player.y,
                        cr = 28;

                    const startAngle = -Math.PI / 2;

                    // Background ring

                    ctx.strokeStyle = "rgba(255,255,255,0.08)";

                    ctx.lineWidth = 4;

                    ctx.beginPath();

                    ctx.arc(cx, cy, cr, 0, Math.PI * 2);

                    ctx.stroke();

                    // Progress arc

                    const progress = isActive
                        ? 1 -
                          Math.max(
                              0,
                              (CRIT_WINDOW - (ts - critState.windowStart)) /
                                  CRIT_WINDOW,
                          )
                        : Math.min(
                              1,
                              critState.shotCount / critState.threshold,
                          );

                    ctx.strokeStyle = isActive
                        ? "#ffdd00"
                        : "rgba(255,255,255,0.35)";

                    ctx.lineWidth = 4;

                    ctx.shadowColor = isActive ? "#ffdd00" : "transparent";

                    ctx.shadowBlur = isActive ? 10 : 0;

                    ctx.beginPath();

                    ctx.arc(
                        cx,
                        cy,
                        cr,
                        startAngle,
                        startAngle + Math.PI * 2 * progress,
                    );

                    ctx.stroke();

                    ctx.shadowBlur = 0;

                    if (isActive) {
                        const pulse = 0.7 + 0.3 * Math.sin(ts / 120);

                        ctx.fillStyle = `rgba(255,221,0,${pulse})`;

                        ctx.font = "bold 13px Arial";

                        ctx.textAlign = "center";

                        ctx.fillText("CRIT!", cx, cy - 38);

                        ctx.textAlign = "left";
                    } else {
                        // Shots remaining until check

                        const rem = Math.max(
                            0,
                            critState.threshold - critState.shotCount,
                        );

                        ctx.fillStyle = "rgba(255,255,255,0.4)";

                        ctx.font = "11px Arial";

                        ctx.textAlign = "center";

                        ctx.fillText(rem + " shots", cx, cy - 36);

                        ctx.textAlign = "left";
                    }
                }

                // (gradient laser line removed — replaced by lightning beam below)

                // D4 Electrical Grounding Lines (during chaining phase)
                for (const en of enemies) {
                    if ((en.isD4 || en.isNewT1A || en.isNewT1B) && en.state === "chaining" && en.chainTargets) {
                        const elapsed = performance.now() - en.chainStart;

                        if (en.isNewT1A || en.isNewT1B) {
                            // "produces an electric current for in its object for 1 second"
                            if (en.chargePhase !== undefined && en.chargePhase < 1.0) {
                                ctx.save();
                                ctx.shadowColor = en.isNewT1A ? "#00ffff" : "#ffaa00";
                                ctx.shadowBlur = 10 + Math.sin(performance.now()*0.02) * 5;
                                ctx.beginPath();
                                ctx.arc(en.x, en.y, en.size/2 + Math.random()*5, 0, Math.PI * 2);
                                ctx.strokeStyle = `rgba(${en.isNewT1A ? '0,255,255' : '255,170,0'}, ${0.4 + 0.6 * en.chargePhase})`;
                                ctx.lineWidth = 2 + Math.random() * 2;
                                ctx.stroke();
                                ctx.restore();
                            }
                            
                            // Chain drawing sequentially from point to point
                            let px = en.x;
                            let py = en.y;
                            for (let i = 0; i < en.chainRevealCount; i++) {
                                const target = en.chainTargets[i];
                                if (!target || !enemies.includes(target)) continue;
                                const tx = target.x;
                                const ty = target.y;

                                // Jittered electric line for realistic chain lightning
                                ctx.save();
                                ctx.strokeStyle = en.isNewT1A ? "#00ffff" : "#ffaa00";
                                ctx.shadowColor = ctx.strokeStyle;
                                ctx.shadowBlur = 8;
                                ctx.lineWidth = 1.5 + Math.random();
                                
                                ctx.beginPath();
                                ctx.moveTo(px, py);
                                const dist = Math.hypot(tx - px, ty - py);
                                const steps = Math.max(2, Math.floor(dist / 20));
                                for(let s=1; s<steps; s++) {
                                    const r = s/steps;
                                    const jx = px + (tx - px) * r + (Math.random() - 0.5) * 20;
                                    const jy = py + (ty - py) * r + (Math.random() - 0.5) * 20;
                                    ctx.lineTo(jx, jy);
                                }
                                ctx.lineTo(tx, ty);
                                ctx.stroke();
                                ctx.restore();

                                px = tx;
                                py = ty;
                            }
                        } else {
                            for (let i = 0; i < en.chainRevealCount; i++) {
                                const target = en.chainTargets[i];
                                if (!target || !enemies.includes(target)) continue;

                                const sx = en.x;
                                const sy = en.y;
                                const tx = target.x;
                                const ty = target.y;
                                
                                // Draw grounding electrical connection (cluster)
                                const segments = 6;
                                ctx.strokeStyle = "rgba(0, 212, 255, 0.4)";
                                ctx.lineWidth = 1;
                                ctx.setLineDash([3, 3]);
                                
                                ctx.beginPath();
                                ctx.moveTo(sx, sy);
                                
                                for (let s = 1; s <= segments; s++) {
                                    const p = s / segments;
                                    const x = sx + (tx - sx) * p;
                                    const y = sy + (ty - sy) * p;
                                    ctx.lineTo(x, y);
                                }
                                ctx.stroke();
                                ctx.setLineDash([]);
                                
                                // Heavy glow line
                                ctx.shadowColor = "#00d4ff";
                                ctx.shadowBlur = 8;
                                ctx.strokeStyle = "rgba(0, 212, 255, 0.2)";
                                ctx.lineWidth = 4;
                                
                                ctx.beginPath();
                                ctx.moveTo(sx, sy);
                                ctx.lineTo(tx, ty);
                                ctx.stroke();
                                
                                ctx.shadowBlur = 0;
                            }
                        }
                    }
                }

                // Enemies

                enemies.forEach((e) => {
                    const r = e.size / 2;

                    const t = ENEMY_TIERS[e.tierIndex];

                    if (e.tierIndex === 8) {
                        // D2 - Animated Spritesheet
                        // Skip rendering if this D2 is dying (death animation handles it)
                        if (e.state !== "dying" && d2Img.complete && d2Img.naturalWidth > 0) {
                            const now = performance.now();
                            if (e.d2SpawnTime === undefined) e.d2SpawnTime = now;
                            const age = now - e.d2SpawnTime;

                            // ── Frame selection ───────────────────────────────────
                            // Init random loop count (1 or 2) for frames 1-5 phase
                            if (e.d2LoopCount === undefined) e.d2LoopCount = 1 + Math.floor(rng.next() * 2);

                            let fi; // 0-based index into D2_FRAMES
                            if (age < 3000) {
                                // First 3s: hold frame 1
                                fi = 0;
                            } else if (!e.isSlowed) {
                                // Fast phase: loop frames 1-5 (indices 0-4)
                                const cycleLen = 5 * 120; // 120ms per frame
                                const totalLen = cycleLen * e.d2LoopCount;
                                const t = (age - 3000) % (totalLen + 500); // +500ms pause
                                fi = t >= totalLen ? 0 : Math.min(Math.floor(t / 120), 4);
                            } else {
                                // Slow phase: loop frames 1-15 (indices 0-14)
                                const t = (age - 3000) % (15 * 150);
                                fi = Math.min(Math.floor(t / 150), 14);
                            }

                            const [sx, sy, sw, sh] = D2_FRAMES[fi];
                            const drawSize = r * 3.2;
                            // All frames are roughly square-ish; scale to drawSize
                            const dw = drawSize * (sw / sh);
                            const dh = drawSize;

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.drawImage(d2Img, sx, sy, sw, sh, -dw/2, -dh/2, dw, dh);

                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(d2Img, sx, sy, sw, sh, 0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, dw, dh, -dw/2, -dh/2, dw, dh);
                            }
                            ctx.restore();

                            if (e.dragonHitFlash > 0) {
                                ctx.save();
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;
                                ctx.beginPath();
                                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }

                        } else {
                            // fallback circle
                            ctx.fillStyle = "#cc00cc";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (e.tierIndex === 7) {
                        // D1 - Animated Spritesheet
                        if (d1Img.complete && d1Img.naturalWidth > 0) {
                            const totalFrames = D1_COLS * D1_ROWS;
                            const fw = d1Img.naturalWidth / D1_COLS;
                            const fh = d1Img.naturalHeight / D1_ROWS;
                            
                            // Use frames 1–4 only (0-indexed 0–3, first row)
                            const frame = Math.floor(performance.now() / 120) % 4;
                            const col = frame % D1_COLS;
                            const row = Math.floor(frame / D1_COLS);

                            // Stable facing angle — prevents glitch on spawn when velocity=0
                            if (e.vx !== 0 || e.vy !== 0) {
                                e.d1FacingAng = Math.atan2(e.vy, e.vx);
                            }
                            const ang = e.d1FacingAng ?? (Math.PI / 2); // default: moving right

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.rotate(ang + Math.PI / 2);

                            const size = r * 3.5;

                            // ── Blue thruster beam flame ──────────────────────────────
                            // Speed ratio: 1.0 = full speed, ~0.25 = slowed
                            const baseSpd = Math.hypot(e.baseVx, e.baseVy) || 1;
                            const curSpd  = Math.hypot(e.vx, e.vy);
                            const spdRatio = Math.min(curSpd / baseSpd, 1.0);

                            // Smoothly animate the ratio so the flame fades in/out
                            if (e._flameRatio === undefined) e._flameRatio = spdRatio;
                            e._flameRatio += (spdRatio - e._flameRatio) * 0.06;
                            const fr = e._flameRatio;

                            if (fr > 0.02) {
                                const flameLen  = size * 2.2 * fr;   // long beam length
                                const flameW    = size * 0.22;        // beam width at base
                                const pipeY     = size * 0.42;        // pipe exit offset from center
                                const now       = performance.now();

                                // Animated flicker: slight length pulse
                                const flicker = 1 + 0.12 * Math.sin(now * 0.018);
                                const fLen    = flameLen * flicker;

                                // Core beam gradient (bright white-blue core → transparent tip)
                                const grad = ctx.createLinearGradient(0, pipeY, 0, pipeY + fLen);
                                grad.addColorStop(0,    `rgba(180,230,255,${0.95 * fr})`);
                                grad.addColorStop(0.15, `rgba(80,160,255,${0.9 * fr})`);
                                grad.addColorStop(0.5,  `rgba(30,80,255,${0.7 * fr})`);
                                grad.addColorStop(0.85, `rgba(0,30,180,${0.3 * fr})`);
                                grad.addColorStop(1,    `rgba(0,10,120,0)`);

                                // Outer glow (wider, more transparent)
                                const glowGrad = ctx.createLinearGradient(0, pipeY, 0, pipeY + fLen * 1.1);
                                glowGrad.addColorStop(0,   `rgba(100,180,255,${0.35 * fr})`);
                                glowGrad.addColorStop(0.4, `rgba(50,100,255,${0.2 * fr})`);
                                glowGrad.addColorStop(1,   `rgba(0,20,200,0)`);

                                ctx.save();

                                // Outer glow layer
                                ctx.beginPath();
                                ctx.moveTo(-flameW * 1.6, pipeY);
                                ctx.bezierCurveTo(
                                    -flameW * 1.6, pipeY + fLen * 0.4,
                                    0, pipeY + fLen * 1.1,
                                    0, pipeY + fLen * 1.1
                                );
                                ctx.bezierCurveTo(
                                    0, pipeY + fLen * 1.1,
                                    flameW * 1.6, pipeY + fLen * 0.4,
                                    flameW * 1.6, pipeY
                                );
                                ctx.closePath();
                                ctx.fillStyle = glowGrad;
                                ctx.fill();

                                // Core beam
                                ctx.beginPath();
                                ctx.moveTo(-flameW * 0.5, pipeY);
                                ctx.bezierCurveTo(
                                    -flameW * 0.5, pipeY + fLen * 0.5,
                                    0, pipeY + fLen,
                                    0, pipeY + fLen
                                );
                                ctx.bezierCurveTo(
                                    0, pipeY + fLen,
                                    flameW * 0.5, pipeY + fLen * 0.5,
                                    flameW * 0.5, pipeY
                                );
                                ctx.closePath();
                                ctx.fillStyle = grad;
                                ctx.fill();

                                // Bright white hot-spot at pipe exit
                                const hotspot = ctx.createRadialGradient(0, pipeY, 0, 0, pipeY, flameW * 0.9);
                                hotspot.addColorStop(0,   `rgba(255,255,255,${0.9 * fr})`);
                                hotspot.addColorStop(0.5, `rgba(150,210,255,${0.5 * fr})`);
                                hotspot.addColorStop(1,   `rgba(80,160,255,0)`);
                                ctx.beginPath();
                                ctx.arc(0, pipeY, flameW * 0.9, 0, Math.PI * 2);
                                ctx.fillStyle = hotspot;
                                ctx.fill();

                                ctx.restore();
                            }
                            // ─────────────────────────────────────────────────────────

                            ctx.drawImage(d1Img, col * fw, row * fh, fw, fh, -size / 2, -size / 2, size, size);

                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(d1Img, col * fw, row * fh, fw, fh, 0, 0, size, size);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, size, size);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, size, size, -size / 2, -size / 2, size, size);
                            }
                            ctx.restore();
                        } else {
                            // Fallback if image fails to load
                            ctx.fillStyle = "#00ff88";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                            ctx.fill();
                        }

                    } else if (e.tierIndex === 11) {
                        // ── T6B — Sprite sheet animation ────────────────────────
                        if (t6bImg.complete && t6bImg.naturalWidth > 0) {
                            const now = performance.now();
                            const scale = bossState.t6bRewardScale;
                            let frameIndex = 0;
                            let extraGlow = 0;

                            if (e.state === "dying") {
                                // Slot-machine: cycle frames 1-16, ease to target
                                const mult = e.dyingFinalMult || 1;
                                const targetIdx = mult === 1 ? 3 : (mult <= 4 ? 7 : 11);
                                const dur = now - (e.dyingTimer || now);
                                const FLASH_DUR = 3500;
                                if (dur >= FLASH_DUR) {
                                    frameIndex = targetIdx;
                                } else {
                                    const t = dur / FLASH_DUR;
                                    const eased = 1 - Math.pow(1 - t, 2.5);
                                    const totalFrames = targetIdx + 5 * 16;
                                    frameIndex = Math.floor(eased * totalFrames) % 16;
                                }
                            } else {
                                // Normal state: frame selection by reward scale
                                if (scale >= 451) {
                                    // High band: loop frames 13-16 only
                                    const highLoop = [12, 13, 14, 15];
                                    frameIndex = highLoop[Math.floor(now / 200) % 4];
                                } else if (scale >= 351) {
                                    // Mid band: loop frames 5-8 with glow transition
                                    if (!e._t6bGlowStart) e._t6bGlowStart = now;
                                    const glowElapsed = now - e._t6bGlowStart;
                                    if (glowElapsed < 1500) {
                                        const t = glowElapsed / 1500;
                                        extraGlow = 0.9 * (1 - t) + 0.3 * Math.sin(now * 0.01) * (1 - t);
                                    }
                                    const midLoop = [4, 5, 6, 7];
                                    frameIndex = midLoop[Math.floor(now / 200) % 4];
                                } else {
                                    // Low band: loop frames 1-4
                                    e._t6bGlowStart = 0;
                                    const lowLoop = [0, 1, 2, 3];
                                    frameIndex = lowLoop[Math.floor(now / 200) % 4];
                                }
                            }

                            const crop = T6B_CROPS[frameIndex];
                            const col = frameIndex % T6B_COLS;
                            const row = Math.floor(frameIndex / T6B_COLS);

                            // Uniform bounding box, content centered with centroid alignment
                            const UNIFORM_W = 201, UNIFORM_H = 212;
                            const displayW = r * 3.2;
                            const displayH = (UNIFORM_H / UNIFORM_W) * displayW;
                            const uScale = displayW / UNIFORM_W;

                            const padLeft = Math.round((UNIFORM_W - crop.sw) * uScale / 2 + crop.ox * uScale);
                            const padTop  = Math.round((UNIFORM_H - crop.sh) * uScale / 2 + crop.oy * uScale);
                            const drawW   = Math.round(crop.sw * uScale);
                            const drawH   = Math.round(crop.sh * uScale);

                            // No rotation
                            ctx.save();
                            ctx.translate(Math.round(e.x), Math.round(e.y));

                            // Glow effect on band transition
                            if (extraGlow > 0) {
                                ctx.shadowColor = "#00ffff";
                                ctx.shadowBlur = 18 + extraGlow * 8;
                            }

                            ctx.drawImage(t6bImg,
                                crop.sx + T6B_FW * col,
                                crop.sy + T6B_FH * row,
                                crop.sw, crop.sh,
                                Math.round(-displayW / 2) + padLeft,
                                Math.round(-displayH / 2) + padTop,
                                drawW, drawH);

                            if (extraGlow > 0) {
                                ctx.shadowBlur = 0;
                            }

                            // Red hit flash overlay
                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(t6bImg,
                                    crop.sx + T6B_FW * col,
                                    crop.sy + T6B_FH * row,
                                    crop.sw, crop.sh,
                                    0, 0, drawW, drawH);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, drawW, drawH);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, drawW, drawH,
                                    Math.round(-displayW / 2) + padLeft,
                                    Math.round(-displayH / 2) + padTop,
                                    drawW, drawH);
                            }

                            ctx.restore();

                            // Multiplier label centered on the sprite
                            ctx.textAlign = "center";
                            ctx.textBaseline = "middle";
                            ctx.shadowColor = "#000";
                            ctx.shadowBlur = 4;

                            if (e.state === "dying") {
                                const mult = e.dyingFinalMult || 1;
                                const dur = now - (e.dyingTimer || now);
                                let displayMult = mult;
                                // Flash phase (first 3.5s): cycle values 1-10
                                if (dur < 3500) {
                                    const flashVals = [1, 2, 3, 4, 5, 6];
                                    displayMult = flashVals[Math.floor(now / 100) % 6];
                                }
                                ctx.font = "bold 50px Georgia, serif";
                                ctx.fillStyle = mult > 1 ? "#ffd700" : "#ff4444";
                                ctx.fillText("x" + displayMult, e.x, e.y);
                            } else {
                                ctx.font = "bold 50px Georgia, serif";
                                ctx.fillStyle = "#ffd700";
                                ctx.fillText("x" + scale, e.x, e.y);
                            }

                            ctx.shadowBlur = 0;
                            ctx.textBaseline = "alphabetic";
                            ctx.textAlign = "left";
                        } else {
                            // Fallback if image fails to load
                            ctx.fillStyle = "#4169e1";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.fillStyle = "#ffffff";
                            ctx.textAlign = "center";
                            ctx.font = "bold 10px Arial";
                            ctx.fillText("T6B", e.x, e.y + 3);
                            ctx.textAlign = "left";
                        }
                    } else if (e.tierIndex === 6) {
                        // ── T6 (×500 boss) — imitates T5 spritesheet animation ──
                        if (t6Img.complete && t6Img.naturalWidth > 0) {
                            // T6 spritesheet: cells are 309x469 with 7px separators
                            const T6_COL_X = [4, 320, 636, 952];
                            const T6_ROW_Y = [3, 479, 955, 1431];
                            const T6_FW = 309, T6_FH = 469;

                            const now = performance.now();
                            // Cycle through all 16 frames at 200ms each (like T5)
                            const fi  = Math.floor(now / 200) % 16;
                            const srcX = T6_COL_X[fi % 4];
                            const srcY = T6_ROW_Y[Math.floor(fi / 4)];

                            // Nose points up → +PI/2 offset
                            const ang = Math.atan2(e.vy || 0, e.vx || 0) + Math.PI / 2;

                            const dh = r * 4.2;
                            const dw = dh * (T6_FW / T6_FH);

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.rotate(ang);

                            // Low brightness during ability, fade out during explosion
                            if (e.t6Triggered) {
                                if (e.state === "exploding") {
                                    const fadeProgress = (performance.now() - e.t6ExplodeStart) / 2500;
                                    ctx.globalAlpha = Math.max(0, 0.5 * (1 - fadeProgress));
                                } else {
                                    ctx.globalAlpha = 0.5;
                                }
                            }

                            // ── Burst flames from twin pipes (+ center pipe during charge) ────
                            if (e.state !== "dying") {
                                const tailY = (475 / T6_FH - 0.5) * dh;
                                const beamLen = dh * (e.state === "charging" ? 0.44 : 0.22);
                                const beamW   = dw * 0.10;
                                const pipeCount = e.state === "charging" ? 3 : 2;

                                for (let pi = 0; pi < pipeCount; pi++) {
                                    const pipeX  = pi === 2 ? 0 : ((pi === 0 ? 280 : 29) / T6_FW - 0.5) * dw;
                                    const phase = pi * 1.3;
                                    const flick = 1 + 0.15 * Math.sin(now * 0.025 + e.x + phase);
                                    const bLen  = beamLen * flick;

                                    const g = ctx.createLinearGradient(pipeX, tailY, pipeX, tailY + bLen);
                                    g.addColorStop(0,    `rgba(255,255,200,0.95)`);
                                    g.addColorStop(0.12, `rgba(255,220,50,0.9)`);
                                    g.addColorStop(0.35, `rgba(255,120,20,0.7)`);
                                    g.addColorStop(0.65, `rgba(220,40,10,0.4)`);
                                    g.addColorStop(1,    `rgba(150,10,0,0)`);

                                    const gg = ctx.createLinearGradient(pipeX, tailY, pipeX, tailY + bLen * 1.1);
                                    gg.addColorStop(0,   `rgba(255,100,0,0.25)`);
                                    gg.addColorStop(1,   `rgba(150,20,0,0)`);

                                    ctx.save();
                                    ctx.beginPath();
                                    ctx.ellipse(pipeX, tailY + bLen * 0.5, beamW * 1.8, bLen * 0.5, 0, 0, Math.PI * 2);
                                    ctx.fillStyle = gg;
                                    ctx.fill();
                                    ctx.beginPath();
                                    ctx.ellipse(pipeX, tailY + bLen * 0.5, beamW * 0.8, bLen * 0.5, 0, 0, Math.PI * 2);
                                    ctx.fillStyle = g;
                                    ctx.fill();
                                    const hs = ctx.createRadialGradient(pipeX, tailY, 0, pipeX, tailY, beamW * 1.5);
                                    hs.addColorStop(0,   `rgba(255,255,220,0.95)`);
                                    hs.addColorStop(0.4, `rgba(255,180,40,0.6)`);
                                    hs.addColorStop(0.7, `rgba(220,60,10,0.25)`);
                                    hs.addColorStop(1,   `rgba(150,10,0,0)`);
                                    ctx.beginPath();
                                    ctx.arc(pipeX, tailY, beamW * 1.5, 0, Math.PI * 2);
                                    ctx.fillStyle = hs;
                                    ctx.fill();
                                    ctx.restore();
                                }
                            }
                            // ────────────────────────────────────────────────────────

                            ctx.drawImage(t6Img, srcX, srcY, T6_FW, T6_FH, -dw/2, -dh/2, dw, dh);

                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(t6Img, srcX, srcY, T6_FW, T6_FH, 0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, dw, dh, -dw/2, -dh/2, dw, dh);
                            }

                            ctx.restore();

                            if (e.dragonHitFlash > 0) {
                                ctx.save();
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;
                                ctx.beginPath();
                                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }

                            ctx.textAlign = "left";
                        } else {
                            ctx.fillStyle = "#8b0000";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    } else if (e.tierIndex === 5) {
                        // T5 - animated spritesheet: 4x4 grid = 16 frames
                        if (t5Img.complete && t5Img.naturalWidth > 0) {
                            const T5_COL_X = [16, 179, 343, 504];
                            const T5_ROW_Y = [19, 106, 194, 284];
                            const T5_FW = 154, T5_FH = 80;

                            const now = performance.now();
                            // Slow animation to 200ms/frame to avoid glitch feel
                            const fi  = Math.floor(now / 200) % 16;
                            const srcX = T5_COL_X[fi % 4];
                            const srcY = T5_ROW_Y[Math.floor(fi / 4)];

                            // Nose points +X
                            const ang = Math.atan2(e.vy || 0, e.vx || 0);

                            // Scale: height = r*2.8 (slightly smaller), width proportional
                            const dh = r * 2.8;
                            const dw = dh * (T5_FW / T5_FH); // dh * 1.925

                            ctx.save();
                            ctx.translate(e.x, e.y);
                            ctx.rotate(ang);

                            // ── 2 red→blue pipe flames ────────────────────────────
                            // Pipe exits at cell x=12, y=13 (top) and y=67.5 (bottom)
                            // Cell is 154x80. Draw space centered on cell origin.
                            // pipeX  = (-0.5 + 12/154)*dw  = -0.422*dw
                            // pipe1Y = (-0.5 + 13/80)*dh   = -0.338*dh  (=-40px at dh=118)
                            // pipe2Y = (-0.5 + 67.5/80)*dh = +0.344*dh
                            // Pipe opening radius in draw space = (3/80)*dh = 0.0375*dh
                            // beamW matches pipe opening; beamLen = ~8x pipe radius
                            const pipeX  = (-0.6 + 15/154) * dw;
                            const pipe1Y = (-0.5 + 5/20)  * dh;
                            const pipe2Y = (-0.5 + 67.5/93) * dh;
                            const pipeR   = 0.0375 * dh;        // pipe opening radius
                            const beamW   = pipeR * 5;        // flame width ≈ pipe opening
                            const beamLen = pipeR * 10;         // flame length ≈ 10x pipe radius

                            for (let pi = 0; pi < 2; pi++) {
                                const py    = pi === 0 ? pipe1Y : pipe2Y;
                                const phase = pi * 1.4;
                                const flick = 1 + 0.12 * Math.sin(now * 0.02 + phase);
                                const bLen  = beamLen * flick;

                                const g = ctx.createLinearGradient(pipeX, py, pipeX - bLen, py);
                                g.addColorStop(0,    `rgba(255,255,200,0.95)`);
                                g.addColorStop(0.12, `rgba(255,80,20,0.90)`);
                                g.addColorStop(0.50, `rgba(140,20,200,0.60)`);
                                g.addColorStop(0.85, `rgba(40,80,255,0.35)`);
                                g.addColorStop(1,    `rgba(0,20,180,0)`);

                                const gg = ctx.createLinearGradient(pipeX, py, pipeX - bLen * 1.1, py);
                                gg.addColorStop(0,   `rgba(200,50,255,0.22)`);
                                gg.addColorStop(1,   `rgba(0,30,180,0)`);

                                ctx.save();
                                ctx.beginPath();
                                ctx.ellipse(pipeX - bLen*0.5, py, bLen*0.5, beamW*1.8, 0, 0, Math.PI*2);
                                ctx.fillStyle = gg;
                                ctx.fill();
                                ctx.beginPath();
                                ctx.ellipse(pipeX - bLen*0.5, py, bLen*0.5, beamW*0.7, 0, 0, Math.PI*2);
                                ctx.fillStyle = g;
                                ctx.fill();
                                const hs = ctx.createRadialGradient(pipeX, py, 0, pipeX, py, beamW*1.2);
                                hs.addColorStop(0,   `rgba(255,255,220,0.95)`);
                                hs.addColorStop(0.5, `rgba(255,100,40,0.65)`);
                                hs.addColorStop(1,   `rgba(120,0,200,0)`);
                                ctx.beginPath();
                                ctx.arc(pipeX, py, beamW*1.2, 0, Math.PI*2);
                                ctx.fillStyle = hs;
                                ctx.fill();
                                ctx.restore();
                            }
                            // ─────────────────────────────────────────────────────

                            ctx.drawImage(t5Img, srcX, srcY, T5_FW, T5_FH, -dw/2, -dh/2, dw, dh);

                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);
                                hitCtx.drawImage(t5Img, srcX, srcY, T5_FW, T5_FH, 0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;
                                hitCtx.fillRect(0, 0, dw, dh);
                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, dw, dh, -dw/2, -dh/2, dw, dh);
                            }

                            ctx.restore();

                            if (e.dragonHitFlash > 0) {
                                ctx.save();
                                ctx.globalAlpha = e.dragonHitFlash * 0.72;
                                ctx.fillStyle = "#ff1a1a";
                                ctx.shadowColor = "#ff0000";
                                ctx.shadowBlur = 14 * e.dragonHitFlash;
                                ctx.beginPath();
                                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.restore();
                            }

                        } else {
                            ctx.fillStyle = "#cc00ff";
                            ctx.beginPath();
                            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);

                        }
                    } else if (e.tierIndex === 15) {

                            const now = performance.now();
                            const fi = e.t6cFrameIdx || 0;
                            const crop = T6C_CROPS[fi];
                            const col = fi % T6C_COLS;
                            const row = Math.floor(fi / T6C_COLS);

                            const UNIFORM_W = 240, UNIFORM_H = 220;
                            const displayW = r * 3.4;
                            const displayH = (UNIFORM_H / UNIFORM_W) * displayW;
                            const uScale = displayW / UNIFORM_W;

                            const padLeft = Math.round((UNIFORM_W - crop.sw) * uScale / 2 + crop.ox * uScale);
                            const padTop  = Math.round((UNIFORM_H - crop.sh) * uScale / 2 + crop.oy * uScale);

                            const drawH   = Math.round(crop.sh * uScale);

                            if (e.state === "dying") {

                            ctx.translate(e.x, e.y);
                            ctx.rotate(ang);

                            const dh = displayH;

                            const isFastFrame = fi === 0 || fi === 15;
                            if (isFastFrame) {
                                const trailLen = dh * 0.45;
                                const flick = 1 + 0.15 * Math.sin(now * 0.015 + e.x);
                                const alpha = 0.5 + 0.3 * Math.sin(now * 0.02 + e.y);
                                const wingOff = dw * 0.3;

                                // Left wing trail (extends backward in +Y direction)
                                const g1 = ctx.createLinearGradient(-wingOff, 0, -wingOff, trailLen * flick);
                                g1.addColorStop(0, `rgba(255,200,100,${alpha * 0.7})`);
                                g1.addColorStop(0.5, `rgba(255,100,20,${alpha * 0.3})`);
                                g1.addColorStop(1, `rgba(255,50,0,0)`);

                                ctx.beginPath();
                                ctx.ellipse(-wingOff, trailLen * flick * 0.5, 3 * uScale, trailLen * flick * 0.5, 0, 0, Math.PI * 2);
                                ctx.fillStyle = g1;
                                ctx.fill();

                                // Right wing trail (extends backward in +Y direction)
                                const g2 = ctx.createLinearGradient(wingOff, 0, wingOff, trailLen * flick);
                                g2.addColorStop(0, `rgba(255,200,100,${alpha * 0.7})`);
                                g2.addColorStop(0.5, `rgba(255,100,20,${alpha * 0.3})`);
                                g2.addColorStop(1, `rgba(255,50,0,0)`);

                                ctx.beginPath();
                                ctx.ellipse(wingOff, trailLen * flick * 0.5, 3 * uScale, trailLen * flick * 0.5, 0, 0, Math.PI * 2);
                                ctx.fillStyle = g2;
                                ctx.fill();

                                // Glow effect on fast frames
                                ctx.shadowColor = "#ff8800";
                                ctx.shadowBlur = 12 + 6 * Math.sin(now * 0.01);

                            ctx.drawImage(t6cImg,
                                crop.sx + T6C_FW * col,
                                crop.sy + T6C_FH * row,
                                crop.sw, crop.sh,
                                Math.round(-displayW / 2) + padLeft,
                                Math.round(-displayH / 2) + padTop,
                                drawW, drawH);

                            ctx.shadowBlur = 0;

                            // Red hit flash overlay
                            if (e.hitEffect > 0) {
                                hitCtx.clearRect(0, 0, 600, 600);

                                    crop.sx + T6C_FW * col,
                                    crop.sy + T6C_FH * row,
                                    crop.sw, crop.sh,

                                hitCtx.globalCompositeOperation = "source-atop";
                                hitCtx.fillStyle = `rgba(255,0,0,${e.hitEffect * 0.55})`;

                                hitCtx.globalCompositeOperation = "source-over";
                                ctx.drawImage(hitCanvas, 0, 0, drawW, drawH,
