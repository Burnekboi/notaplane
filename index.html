                                const zoomScale =
                                    z === 0 ? 1.5 : z === 1 ? 1.2 : 0.8;

                                if (explosionFX.length < MAX_EXPLOSION_FX) {
                                const fx = poolNext(explosionFX); fx.active = true; fx.x = m.target.x; fx.y = m.target.y; fx.alpha = 1.0 - z * 0.3; fx.radius = 30 * zoomScale;
                                }
                            }, z * 100);
                        }

                        const targetIndex = enemies.indexOf(m.target);

                        if (targetIndex !== -1) {
                            enemies.splice(targetIndex, 1);
                        }

                        eliteT2Missiles.splice(i, 1);
                    }
                }

                // ── Nuke missiles update ──────────────────────────────────────────────

                for (let i = nukeMissiles.length - 1; i >= 0; i--) {
                    const m = nukeMissiles[i];

                    // If target is dying, clear the lock so missile flies off harmlessly

                    if (m.target && m.target.state === "dying") m.target = null;

                    // Track target if still alive, else fly to last known position

                    if (m.target && enemies.includes(m.target)) {
                        const dx = m.target.x - m.x,
                            dy = m.target.y - m.y;

                        const dist = Math.hypot(dx, dy) || 1;

                        const speed = 8;

                        m.vx = (dx / dist) * speed;

                        m.vy = (dy / dist) * speed;
                    }

                    m.x += m.vx;
                    m.y += m.vy;

                    // Smoke trail from the rear of the missile — 3× longer trail

                    const mAngle = Math.atan2(m.vy, m.vx);

                    for (let s = 0; s < 3; s++) {
                        if (rng.next() < 0.85) {
                            const trailDist = 14 + s * 12;

                            const sfx = poolNext(smokeFX);
                            sfx.active = true;
                            sfx.x = m.x - Math.cos(mAngle) * trailDist + (rng.next() - 0.5) * 8;
                            sfx.y = m.y - Math.sin(mAngle) * trailDist + (rng.next() - 0.5) * 8;
                            sfx.alpha = 0.6 - s * 0.12;
                            sfx.scale = 0.35 + rng.next() * 0.25 + s * 0.1;
                            sfx.fadeSpeed = 0.012;
                            sfx.angle = rng.next() * Math.PI * 2;
                            sfx.vAngle = (rng.next() - 0.5) * 0.06;
                        }
                    }

                    // Hit check — close enough to target center, skip dying enemies

                    const hitTarget = (() => {
                        if (m.target && enemies.includes(m.target) && isTargetable(m.target))
                            return m.target;

                        return enemies.find(
                            (en) =>
                                isTargetable(en) &&
                                Math.hypot(m.x - en.x, m.y - en.y) <
                                    en.size / 2 + 8,
                        );
                    })();

                    if (
                        hitTarget &&
                        Math.hypot(m.x - hitTarget.x, m.y - hitTarget.y) <
                            hitTarget.size / 2 + 8
                    ) {
                        // Trigger red flash hit effect on missile touch (even if blocked or misses)

                        hitTarget.hitEffect = 1.0;

                        const { dmg: baseDmg, instant, isCrit } = rollNukeDmg();
                        const hitRoll = rtp.rollHit(
                            hitTarget.tierIndex,
                            !!hitTarget.isBoss,
                        );
                        const nukeLanded =
                            hitRoll.hit || hitRoll.instant || instant;

                        // Block/miss runs silently in background — missile always visually hits

                        const blocked =
                            nukeLanded &&
                            !instant &&
                            !hitRoll.instant &&
                            rollBlock(hitTarget);

                        processBossHit(hitTarget, ts);

                        let finalDmg =
                            instant || hitRoll.instant
                                ? hitTarget.hp
                                : baseDmg;

                        // Apply crit state bonus if it's a critical hit
                        if (isCrit && !instant) {
                            const critRoll = critState.roll();
                            if (critRoll > 1) finalDmg = finalDmg + critRoll;
                        }

                        if (nukeLanded && !blocked) {
                            hitTarget._payoutBet = m.bet;
                            hitTarget.hp -= finalDmg;
                        }

                        // Nuke RTP miss — refund the cost
                        if (!nukeLanded) {


                        }

                        if (explosionFX.length < MAX_EXPLOSION_FX) {
                        const fx = poolNext(explosionFX); fx.active = true; fx.x = hitTarget.x; fx.y = hitTarget.y; fx.alpha = 1.0; fx.radius = 40;
                        }

                        if (nukeLanded && hitTarget.hp <= 0) {
                            if (
                                hitTarget.tierIndex === 11 &&
                                hitTarget.state !== "dying"
                            ) {
                                hitTarget.hp = 0;

                                hitTarget.state = "dying";

                                hitTarget.dyingTimer = performance.now();

                                hitTarget.vx = 0;
                                hitTarget.vy = 0;

                                bossState.bossHp = 0;

                                if (rng.next() < 0.3) {
                                    const r = rng.next();

                                    let multi = 2;

                                    if (r >= 0.60 && r < 0.80) multi = 3;
                                    else if (r >= 0.80 && r < 0.90) multi = 4;
                                    else if (r >= 0.90 && r < 0.98) multi = 5;
                                    else if (r >= 0.98) multi = 6;

                                    hitTarget.dyingFinalMult = multi;
                                } else {
                                    hitTarget.dyingFinalMult = 1;
                                }
                            } else if (hitTarget.state !== "dying") {
                                killEnemy(
                                    hitTarget,
                                    enemies.indexOf(hitTarget),
                                );
                            }
                        }

                        nukeMissiles.splice(i, 1);

                        continue;
                    }

                    // Off-screen — refund the cost and remove

                    if (
                        m.x < -50 ||
                        m.x > W + 50 ||
                        m.y < -50 ||
                        m.y > H + 50
                    ) {
                        const refundAmount = betAmount * NUKE_STRIKE_COST_MULTIPLIER;
                        
                        balance += refundAmount;
                        sessionTotalBets -= refundAmount;
                        if (sessionTotalBets < 0) sessionTotalBets = 0;
                        rtp.totalSpent -= betAmount;
                        nukeMissiles.splice(i, 1);
                        
                        if (refundPopups.length < MAX_REFUND_POPUPS) {
                            refundPopups.push({
                                text: "REFUND +" + refundAmount.toString(),
                                startTime: performance.now(),
                                duration: 2000,
                            });
                        }
                    }
                }

                // ── Auto-aim nuke firing ──────────────────────────────────────────────

                if (autoMode && nukeMode && autoTierIndex !== -1) {
                    if (playerAttackLocked) {
                        autoTarget = null;
                    } else {
                        const matchesTier = (ti) =>
                            ti === autoTierIndex ||
                            (autoTierIndex === 0 && ti === 9) ||
                            (autoTierIndex === 1 && ti === 10);

                        if (!autoTarget || !isTargetable(autoTarget)) {
                            autoTarget = null;

                            let minD = Infinity;

                            for (const en of enemies) {
                                if (
                                    !matchesTier(en.tierIndex) ||
                                    !isTargetable(en)
                                )
                                    continue;

                                const d = Math.hypot(
                                    en.x - player.x,
                                    en.y - player.y,
                                );

                                if (d < minD) {
                                    minD = d;
                                    autoTarget = en;
                                }
                            }
                        }

                        if (
                            autoTarget &&
                            isTargetable(autoTarget) &&
                            ts - lastNukeFire > NUKE_FIRE_RATE
                        ) {
                            lastNukeFire = ts;

                            fireNukeAt(autoTarget);
                        }
                    }
                }

                // Tick Missiles

                for (let i = activeMissiles.length - 1; i >= 0; i--) {
                    const m = activeMissiles[i];

                    m.progress += m.speed;

                    m.x = m.startX + (m.tx - m.startX) * m.progress;

                    m.y = m.startY + (m.ty - m.startY) * m.progress;

                    // Spawn smoke

                    if (rng.next() < 0.4) {
                        const angle = Math.atan2(
                            m.ty - m.startY,
                            m.tx - m.startX,
                        );

                        const tailX = m.x - Math.cos(angle) * 35;

                        const tailY = m.y - Math.sin(angle) * 35;

                        const sfx = poolNext(smokeFX);
                        sfx.active = true;
                        sfx.x = tailX + (rng.next() - 0.5) * 15;
                        sfx.y = tailY + (rng.next() - 0.5) * 15;
                        sfx.alpha = 1.0;
                        sfx.scale = 1.0;
                        sfx.angle = rng.next() * Math.PI * 2;
                        sfx.vAngle = (rng.next() - 0.5) * 0.1;
                    }

                    if (m.progress >= 1) {
                        triggerMissileExplosion(m.tx, m.ty, m.capRef);

                        activeMissiles.splice(i, 1);
                    }
                }

                // Tick smoke

                for (let i = smokeFX.length - 1; i >= 0; i--) {
                    const s = smokeFX[i];
                    if (!s.active) continue;

                    s.alpha -= s.fadeSpeed || 0.02; // fade to 0

                    s.scale -= 0.015; // zoom out

                    s.angle += s.vAngle; // random rotation

                    if (s.alpha <= 0 || s.scale <= 0) s.active = false;
                }

                // Tick explosion animations

                for (let i = explosionAnimations.length - 1; i >= 0; i--) {
                    const ex = explosionAnimations[i];

                    const elapsed = performance.now() - ex.startTime;

                    // Calculate which frame to show based on elapsed time
                    const frameNumber = Math.floor(elapsed / EXPLOSION_MS);

                    if (frameNumber >= EXPLOSION_FRAMES) {
                        // Animation finished, remove it
                        explosionAnimations.splice(i, 1);
                    } else {
                        ex.frameIndex = frameNumber;
                    }
                }

                // Tick thunder FX

                for (let i = thunderFX.length - 1; i >= 0; i--) {
                    thunderFX[i].alpha -= 0.04;

                    if (thunderFX[i].alpha <= 0) thunderFX.splice(i, 1);
                }

                // Decay chain lightning FX
                for (let i = chainLightningFX.length - 1; i >= 0; i--) {
                    chainLightningFX[i].alpha -= 0.08;
                    if (chainLightningFX[i].alpha <= 0) chainLightningFX.splice(i, 1);
                }

                // Tick explosion FX

                for (let i = explosionFX.length - 1; i >= 0; i--) {
                    const fx = explosionFX[i];
                    if (!fx.active) continue;
                    fx.alpha -= 0.03;

                    if (fx.alpha <= 0) fx.active = false;
                }

                // Clean up shockwaves that are done
                if (window.d2Shockwaves) {
                    for (let i = window.d2Shockwaves.length - 1; i >= 0; i--) {
                        if (window.d2Shockwaves[i].alpha <= 0) {
                            window.d2Shockwaves.splice(i, 1);
                        }
                    }
                }

                // Tick lightning particles

                for (let i = lightningSparks.length - 1; i >= 0; i--) {
                    const p = lightningSparks[i];
                    if (!p.active) continue;

                    p.x += p.vx;
                    p.y += p.vy;

                    p.alpha -= 0.06;

                    if (p.alpha <= 0) p.active = false;
                }

                // D2 random movement with speed phases

                for (const e of enemies) {
                    if (!e.isD2) continue;

                    const age = ts - e.born;
                    const spd = ENEMY_TIERS[8].speed;

                    // Determine speed phase: fast → slow → fast
                    let speedMultiplier = 1.0;
                    const timeIntoSlowPhase = age - e.slowPhaseStart;
                    if (timeIntoSlowPhase >= 0 && timeIntoSlowPhase < e.slowPhaseDuration) {
                        // Currently in slow phase: reduce speed significantly
                        e.isSlowed = true;
                        speedMultiplier = 0.3; // 30% speed during slow phase
                    } else {
                        e.isSlowed = false;
                        speedMultiplier = 1.0; // Normal/fast speed otherwise
                    }

                    if (e.entering) {
                        // Pull toward screen center to enter from edge
                        const centerDist = Math.hypot(e.x - W / 2, e.y - H / 2);
                        const pullStrength = (centerDist > 200 ? 0.05 : 0.03) * speedMultiplier;
                        e.vx += (W / 2 - e.x) * pullStrength;
                        e.vy += (H / 2 - e.y) * pullStrength;
                    } else if (e.exiting) {
                        // Head straight toward the nearest screen edge and exit (always fast)
                        const exitAngle = Math.atan2(e.y - H / 2, e.x - W / 2);
                        e.vx += Math.cos(exitAngle) * 0.12;
                        e.vy += Math.sin(exitAngle) * 0.12;
                    } else if (e.style === 0) {
                        // Swirl — orbit around screen center
                        e.angle += e.angularV;
                        const orbitR = 120 + Math.sin(age / 1800) * 80;
                        const tx = W / 2 + Math.cos(e.angle) * orbitR;
                        const ty = H / 2 + Math.sin(e.angle) * orbitR;
                        e.vx += (tx - e.x) * 0.012 * speedMultiplier;
                        e.vy += (ty - e.y) * 0.012 * speedMultiplier;
                    } else if (e.style === 1) {
                        // Zigzag — bounce between random waypoints
                        if (ts - e.wanderTimer > 1800) {
                            e.wanderTimer = ts;
                            e.wanderTarget = {
                                x: 80 + rng.next() * (W - 160),
                                y: 80 + rng.next() * (H - 160),
                            };
                        }
                        e.vx += (e.wanderTarget.x - e.x) * 0.015 * speedMultiplier;
                        e.vy += (e.wanderTarget.y - e.y) * 0.015 * speedMultiplier;
                    } else if (e.style === 2) {
                        // Spiral inward then outward
                        e.angle += 0.03;
                        const r = 60 + Math.abs(Math.sin(age / 2000)) * 160;
                        const tx = W / 2 + Math.cos(e.angle) * r;
                        const ty = H / 2 + Math.sin(e.angle) * r;
                        e.vx += (tx - e.x) * 0.014 * speedMultiplier;
                        e.vy += (ty - e.y) * 0.014 * speedMultiplier;
                    } else {
                        // Wander — slow drift with random direction changes
                        if (ts - e.wanderTimer > 2200) {
                            e.wanderTimer = ts;
                            e.vx = (rng.next() - 0.5) * spd * 2 * speedMultiplier;
                            e.vy = (rng.next() - 0.5) * spd * 2 * speedMultiplier;
                        }
                    }

                    // Clamp speed (higher cap when exiting)
                    const spd2 = Math.hypot(e.vx, e.vy);
                    const maxSpd = e.exiting ? spd * 6 : (spd * 2.5 * speedMultiplier);
                    if (spd2 > maxSpd) {
                        e.vx = (e.vx / spd2) * maxSpd;
                        e.vy = (e.vy / spd2) * maxSpd;
                    }

                    e.x += e.vx;
                    e.y += e.vy;

                    // Off-screen check — reset d2Active so next one can spawn

                    if (
                        e.x < -150 ||
                        e.x > W + 150 ||
                        e.y < -150 ||
                        e.y > H + 150
                    ) {
                        const idx = enemies.indexOf(e);
                        if (idx !== -1) enemies.splice(idx, 1);
                        d2Active = false;
                    }
                }

                // Auto aim — fires at closest enemy of the locked tier (+ elite variant)

                if (autoMode && !nukeMode && autoTierIndex !== -1) {
                    if (playerAttackLocked) {
                        autoTarget = null;

                        laserAlpha = 0;
                    } else {
                        // tier 0 also matches elite 9, tier 1 also matches elite 10

                        const matchesTier = (ti) =>
                            ti === autoTierIndex ||
                            (autoTierIndex === 0 && ti === 9) ||
                            (autoTierIndex === 1 && ti === 10);

                        if (!autoTarget || !isTargetable(autoTarget)) {
                            autoTarget = null;

                            let minD = Infinity;

                            for (const en of enemies) {
                                if (
                                    !matchesTier(en.tierIndex) ||
                                    !isTargetable(en)
                                )
                                    continue;

                                const d = Math.hypot(
                                    en.x - player.x,
                                    en.y - player.y,
                                );

                                if (d < minD) {
                                    minD = d;
                                    autoTarget = en;
                                }
                            }
                        }

                        const autoFireRate = dragonMode
                            ? DRAGON_FIRE_RATE
                            : AUTO_FIRE_RATE;

                        if (autoTarget && ts - lastAutoFire > autoFireRate) {
                            // Don't fire at non-targetable enemies or during attack lock

                            if (!isTargetable(autoTarget)) {
                                laserAlpha = 0;
                            } else if (dragonMode) {
                                lastAutoFire = ts;
                                lastDragonFire = ts;
                                laserAlpha = 0;
                                fireDragonStrikeAt(autoTarget, ts);
                            } else {
                                lastAutoFire = ts;

                                laserAlpha = 1.0;

                                // Trigger red flash hit effect on lightning touch (even if blocked or misses)

                                autoTarget.hitEffect = 1.0;

                                // D3 is invulnerable while in special states (spinning, bouncing, exploding)
                                if (
                                    autoTarget.isD3 &&
                                    autoTarget.state !== "normal"
                                ) {
                                    laserAlpha = 0;
                                } else if (
                                    autoTarget.isD4 &&
                                    autoTarget.state !== "normal"
                                ) {
                                    laserAlpha = 0;
                                } else {
                                    // Auto damage processing

                                    rtp.spend();

                                    critState.onShot(ts);

                                    missileState.onShot();

                                    balance -= betAmount; // cost of shot
                                    sessionTotalBets += betAmount;

                                    processBossHit(autoTarget, ts);

                                    const roll = rtp.rollHit(
                                        autoTarget.tierIndex,
                                        !!autoTarget.isBoss,
                                    );

                                    // Auto-aim: 0.5% base instant-kill, 2% base crit, 2.7 base damage
                                    // RTP < 30% mercy: +25% instant kill, +25% crit
                                    const _autoRtpBelow30 =
                                        rtp.totalSpent > 0 &&
                                        rtp.currentRTP() < 0.3;
                                    const _autoRtpBonus = _autoRtpBelow30
                                        ? 0.25
                                        : 0;

                                    const autoInstant =
                                        rng.next() <
                                        0.005 +
                                            _autoRtpBonus +
                                            (critState.isActive() ? 0.01 : 0);

                                    const autoCrit =
                                        !autoInstant &&
                                        rng.next() <
                                            0.02 +
                                                _autoRtpBonus +
                                                (critState.isActive()
                                                    ? 0.15
                                                    : 0);

                                    if (
                                        roll.hit ||
                                        roll.instant ||
                                        autoInstant
                                    ) {
                                        spawnLightningSparks(
                                            autoTarget.x,
                                            autoTarget.y,
                                        );

                                        // Block check — instant kills bypass block
                                        if (
                                            !autoInstant &&
                                            rollBlock(autoTarget)
                                        ) {
                                            // blocked — no damage
                                        } else {
                                            let dmg = autoInstant
                                                ? autoTarget.hp
                                                : autoCrit
                                                  ? 3
                                                  : 2.7;

                                            if (
                                                !autoInstant &&
                                                autoTarget.isBoss
                                            ) {
                                                const special = rollBossSpecial(
                                                    ts,
                                                    autoTarget,
                                                );
                                                if (special > 0) dmg = special;
                                            }

                                            // Crit window bonus — adds crit roll on top, not a multiplier
                                            if (!autoInstant) {
                                                const critRoll =
                                                    critState.roll();
                                                if (critRoll > 1)
                                                    dmg = dmg + critRoll;
                                            }

                                            autoTarget._payoutBet = betAmount;
                                            autoTarget.hp -= dmg;

                                            if (autoTarget.hp <= 0) {
                                                if (
                                                    autoTarget.tierIndex ===
                                                        11 &&
                                                    autoTarget.state !== "dying"
                                                ) {
                                                    // T6B: cinematic dying sequence
                                                    autoTarget.hp = 0;
                                                    autoTarget.state = "dying";
                                                    autoTarget.dyingTimer = ts;
                                                    autoTarget.vx = 0;
                                                    autoTarget.vy = 0;
                                                    bossState.bossHp = 0;
                                                    if (rng.next() < 0.3) {
                                                        const r = rng.next();
                                                        let multi = 2;
                                                        if (
                                                            r >= 0.60 &&
                                                            r < 0.80
                                                        )
                                                            multi = 3;
                                                        else if (
                                                            r >= 0.80 &&
                                                            r < 0.90
                                                        )
                                                            multi = 4;
                                                        else if (
                                                            r >= 0.90 &&
                                                            r < 0.98
                                                        )
                                                            multi = 5;
                                                        else if (r >= 0.98)
                                                            multi = 6;
                                                        autoTarget.dyingFinalMult =
                                                            multi;
                                                    } else {
                                                        autoTarget.dyingFinalMult = 1;
                                                    }
                                                } else if (
                                                    autoTarget.state !== "dying"
                                                ) {
                                                    // T6 and all others: instant death
                                                    if (autoTarget.isD3) {
                                                        triggerD3Death(
                                                            autoTarget,
                                                        );
                                                    } else {
                                                        killEnemy(
                                                            autoTarget,
                                                            enemies.indexOf(
                                                                autoTarget,
                                                            ),
                                                        );
                                                    }
                                                }
                                                autoTarget = null;
                                            } else if (autoTarget.isBoss) {
                                                bossState.bossHp =
                                                    autoTarget.hp;
                                            }
                                        } // end block (not blocked)
                                    } else if (
                                        autoTarget &&
                                        autoTarget.isBoss
                                    ) {
                                        bossState.hitStartTime = null;
                                    }
                                } // end else (not dying)

                            }
                        }
                    }

                    laserAlpha = dragonMode
                        ? 0
                        : Math.max(0, laserAlpha - 0.07);
                }

                // Bullets

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    if (!b.active) continue;

                    b.x += b.vx;
                    b.y += b.vy;

                    // Minimal smoke trail

                    if (rng.next() < 0.15) {
                        const angle = Math.atan2(b.vy, b.vx);

                        const sfx = poolNext(smokeFX);
                        sfx.active = true;
                        sfx.x = b.x - Math.cos(angle) * 10;
                        sfx.y = b.y - Math.sin(angle) * 10;
                        sfx.alpha = 0.35;
                        sfx.scale = 0.1;
                        sfx.fadeSpeed = 0.06;
                        sfx.angle = rng.next() * Math.PI * 2;
                        sfx.vAngle = (rng.next() - 0.5) * 0.1;
                    }

                    if (b.x - b.r < 0) {
                        b.x = b.r;
                        b.vx *= -1;
                        b.bounces++;
                    }

                    if (b.x + b.r > W) {
                        b.x = W - b.r;
                        b.vx *= -1;
                        b.bounces++;
                    }

                    if (b.y - b.r < 0) {
                        b.y = b.r;
                        b.vy *= -1;
                        b.bounces++;
                    }

                    if (b.y + b.r > H) {
                        b.y = H - b.r;
                        b.vy *= -1;
                        b.bounces++;
                    }

                    // Track bounces: after 4 bounces, consider wasted and refund
                    if (b.bounces > 4) {
                        const refundAmt = b.bet;
                        balance += refundAmt;

                        rtp.totalSpent -= refundAmt;
                        sessionTotalBets -= refundAmt;
                        if (sessionTotalBets < 0) sessionTotalBets = 0;
                        b.active = false;
                        if (refundPopups.length < MAX_REFUND_POPUPS) {
                            refundPopups.push({
                                text: "REFUND +" + refundAmt.toString(),
                                startTime: performance.now(),
                                duration: 2000,
                            });
                        }
                    }
                }

                // Dragon Power — visual only, damage already applied on fire
                for (let i = thunderAttacks.length - 1; i >= 0; i--) {
